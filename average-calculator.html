<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Average Calculator - Adiyogi Tools</title>

<meta name="description"
content="Free online average calculator. Calculate mean and average of numbers quickly and easily.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

body{
    overflow-x:hidden;
}

button,input{
    font:inherit;
}


/* HEADER */

.header{
    min-height:62px;
    padding:10px 16px;

    background:#0d1322;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    font-size:19px;
    font-weight:700;
}

.badge{
    padding:8px 11px;
    border-radius:12px;

    background:#192842;
    color:#9edbff;

    font-size:11px;
    font-weight:700;
}


/* PAGE */

.container{
    width:100%;
    max-width:700px;

    margin:auto;

    padding:22px 14px 40px;
}


/* TITLE */

.title{
    text-align:center;
    margin-bottom:20px;
}

.title-icon{
    font-size:48px;
    margin-bottom:7px;
}

.title h1{
    font-size:28px;
    margin-bottom:6px;
}

.title p{
    color:#6b7280;
    font-size:15px;
}


/* CARD */

.card{
    background:white;

    border:1px solid #e5e7eb;
    border-radius:20px;

    padding:18px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.08);
}


/* INPUT AREA */

.label{
    display:block;

    margin-bottom:8px;

    color:#374151;

    font-size:14px;
    font-weight:700;
}

#numbers{
    width:100%;

    min-height:130px;

    padding:14px;

    border:2px solid #d8deea;
    border-radius:13px;

    background:#f8fafc;
    color:#111827;

    font-size:17px;

    outline:none;

    resize:vertical;
}

#numbers:focus{
    border-color:#7545f5;
    background:white;
}


/* HINT */

.hint{
    margin-top:8px;

    color:#6b7280;

    font-size:12px;
    line-height:1.5;
}


/* CALCULATE */

.calculate{
    width:100%;
    height:53px;

    margin-top:20px;

    border:0;
    border-radius:13px;

    background:#7545f5;
    color:white;

    font-size:16px;
    font-weight:700;

    box-shadow:
    0 5px 14px rgba(117,69,245,.25);
}

.calculate:active{
    transform:scale(.98);
}


/* RESULT */

.result{
    display:none;

    margin-top:20px;

    padding:18px;

    border-radius:15px;

    background:#f0ecff;

    border:1px solid #d9ceff;

    text-align:center;
}

.result.show{
    display:block;
}

.result-title{
    color:#6b7280;

    font-size:13px;

    margin-bottom:10px;
}

.result-value{
    color:#5d32d4;

    font-size:36px;
    font-weight:800;
}

.result-info{
    margin-top:12px;

    color:#4b5563;

    font-size:14px;

    line-height:1.7;
}


/* CLEAR */

.clear{
    width:100%;
    height:45px;

    margin-top:10px;

    border:1px solid #d8deea;
    border-radius:11px;

    background:#f3f4f6;
    color:#374151;

    font-weight:700;
}

.clear:active{
    transform:scale(.98);
}


/* INFO */

.info{
    margin-top:18px;

    padding:15px;

    border-radius:13px;

    background:#f8fafc;

    border:1px solid #e5e7eb;

    color:#4b5563;

    font-size:13px;

    line-height:1.65;
}

.info strong{
    color:#111827;
}


/* FOOTER */

.footer{
    text-align:center;

    margin-top:22px;

    color:#9ca3af;

    font-size:12px;
}


/* MOBILE */

@media(max-width:500px){

    .brand{
        font-size:17px;
    }

    .container{
        padding:18px 11px 35px;
    }

    .title-icon{
        font-size:42px;
    }

    .title h1{
        font-size:25px;
    }

    .card{
        padding:14px;
        border-radius:17px;
    }

    #numbers{
        font-size:16px;
    }

    .result-value{
        font-size:32px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="brand">
        🧮 Adiyogi Tools
    </div>

    <div class="badge">
        AVERAGE
    </div>

</header>


<main class="container">


<section class="title">

    <div class="title-icon">
        📈
    </div>

    <h1>
        Average Calculator
    </h1>

    <p>
        Calculate the mean and average of numbers.
    </p>

</section>


<section class="card">


<label
for="numbers"
class="label">

Enter Numbers

</label>


<textarea
id="numbers"
placeholder="Example: 10, 20, 30, 40, 50"></textarea>


<div class="hint">

Enter numbers separated by commas, spaces or new lines.

</div>


<button
class="calculate"
onclick="calculateAverage()">

Calculate Average

</button>


<div
id="result"
class="result">

<div class="result-title">
Arithmetic Mean
</div>

<div
id="averageValue"
class="result-value">
0
</div>

<div
id="resultInfo"
class="result-info">
</div>

</div>


<button
class="clear"
onclick="clearAll()">

Clear All

</button>


<div class="info">

<strong>Example:</strong><br><br>

10, 20, 30, 40, 50

<br><br>

Sum = 150

<br>

Number of values = 5

<br>

Average = 150 ÷ 5 = <strong>30</strong>

</div>


</section>


<div class="footer">

© Adiyogi Tools

</div>


</main>


<script>


/* =========================================
   CALCULATE AVERAGE
========================================= */

function calculateAverage(){

    const input =
        document
        .getElementById("numbers")
        .value
        .trim();


    if(!input){

        alert(
            "Please enter some numbers."
        );

        return;

    }


    /*
       Accept:
       comma
       space
       newline
    */

    const values =
        input
        .split(/[\s,]+/)
        .filter(function(value){

            return value !== "";

        })
        .map(Number);


    /* CHECK NUMBERS */

    if(
        values.length === 0 ||
        values.some(function(value){

            return !Number.isFinite(value);

        })
    ){

        alert(
            "Please enter valid numbers only."
        );

        return;

    }


    /* SUM */

    const sum =
        values.reduce(
            function(total,value){

                return total + value;

            },
            0
        );


    /* AVERAGE */

    const average =
        sum / values.length;


    /* DISPLAY */

    document
    .getElementById(
        "averageValue"
    )
    .textContent =
        formatNumber(average);


    document
    .getElementById(
        "resultInfo"
    )
    .innerHTML =

        "Sum = <strong>" +
        formatNumber(sum) +
        "</strong><br>" +

        "Number of values = <strong>" +
        values.length +
        "</strong>";


    document
    .getElementById(
        "result"
    )
    .classList.add("show");

}


/* =========================================
   FORMAT NUMBER
========================================= */

function formatNumber(value){

    return Number(
        value.toFixed(10)
    ).toString();

}


/* =========================================
   CLEAR
========================================= */

function clearAll(){

    document
    .getElementById("numbers")
    .value = "";


    document
    .getElementById("result")
    .classList.remove("show");


    document
    .getElementById("averageValue")
    .textContent = "0";


    document
    .getElementById("resultInfo")
    .innerHTML = "";

}


/* =========================================
   ENTER
========================================= */

document
.getElementById("numbers")
.addEventListener(
    "keydown",
    function(event){

        /*
           Ctrl + Enter
           calculates average
        */

        if(
            event.ctrlKey &&
            event.key === "Enter"
        ){

            calculateAverage();

        }

    }
);

</script>


</body>

</html>
