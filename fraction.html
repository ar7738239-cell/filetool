<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Fraction Calculator - Adiyogi Tools</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

body{
    overflow-x:hidden;
}

button,input{
    font:inherit;
}


/* HEADER */

.header{
    min-height:62px;
    padding:10px 16px;
    background:#0d1322;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    font-size:19px;
    font-weight:700;
}

.badge{
    padding:8px 11px;
    border-radius:12px;
    background:#192842;
    color:#9edbff;
    font-size:11px;
    font-weight:700;
}


/* PAGE */

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:22px 14px 40px;
}


/* TITLE */

.title{
    text-align:center;
    margin-bottom:20px;
}

.title-icon{
    font-size:48px;
    margin-bottom:7px;
}

.title h1{
    font-size:28px;
    margin-bottom:6px;
}

.title p{
    color:#6b7280;
    font-size:15px;
}


/* CARD */

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:20px;
    padding:18px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.08);
}


/* OPERATION */

.operation-title{
    font-size:14px;
    font-weight:700;
    color:#374151;
    margin-bottom:9px;
}

.operations{
    display:grid;
    grid-template-columns:
    repeat(4,1fr);
    gap:7px;
    margin-bottom:20px;
}

.op{
    height:45px;
    border:0;
    border-radius:11px;
    background:#eef1f6;
    color:#374151;
    font-size:20px;
    font-weight:700;
}

.op.active{
    background:#7545f5;
    color:white;
}

.op:active{
    transform:scale(.96);
}


/* FRACTION AREA */

.fractions{
    display:grid;
    grid-template-columns:
    1fr auto 1fr;

    align-items:center;
    gap:12px;
}


/* FRACTION BOX */

.fraction-box{
    background:#f8fafc;
    border:2px solid #d8deea;
    border-radius:15px;
    padding:14px 10px;
}

.fraction-box:focus-within{
    border-color:#7545f5;
    background:white;
}

.fraction-label{
    text-align:center;
    color:#6b7280;
    font-size:12px;
    font-weight:700;
    margin-bottom:10px;
}

.frac-input{
    width:100%;
    height:48px;

    border:2px solid #d8deea;
    border-radius:10px;

    background:white;
    color:#111827;

    text-align:center;

    font-size:20px;
    font-weight:600;

    outline:none;
}

.frac-input:focus{
    border-color:#7545f5;
}

.fraction-line{
    height:2px;
    background:#111827;
    margin:6px 15px;
}


/* OPERATOR */

.operator-symbol{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#7545f5;
    color:white;

    font-size:22px;
    font-weight:700;
}


/* CALCULATE */

.calculate{
    width:100%;
    height:53px;

    margin-top:20px;

    border:0;
    border-radius:13px;

    background:#7545f5;
    color:white;

    font-size:16px;
    font-weight:700;

    box-shadow:
    0 5px 14px rgba(117,69,245,.25);
}

.calculate:active{
    transform:scale(.98);
}


/* RESULT */

.result{
    display:none;

    margin-top:20px;
    padding:18px;

    border-radius:15px;

    background:#f0ecff;
    border:1px solid #d9ceff;

    text-align:center;
}

.result.show{
    display:block;
}

.result-title{
    color:#6b7280;
    font-size:13px;
    margin-bottom:12px;
}

.result-fraction{
    display:inline-flex;
    flex-direction:column;
    align-items:center;

    min-width:70px;

    color:#5d32d4;

    font-size:28px;
    font-weight:800;
}

.result-num,
.result-den{
    padding:2px 12px;
}

.result-line{
    width:100%;
    height:3px;
    background:#5d32d4;
}

.result-decimal{
    margin-top:14px;
    color:#4b5563;
    font-size:14px;
}

.result-mixed{
    margin-top:8px;
    color:#4b5563;
    font-size:14px;
    font-weight:600;
}


/* CLEAR */

.clear{
    width:100%;
    height:45px;

    margin-top:10px;

    border:1px solid #d8deea;
    border-radius:11px;

    background:#f3f4f6;
    color:#374151;

    font-weight:700;
}

.clear:active{
    transform:scale(.98);
}


/* INFO */

.info{
    margin-top:18px;

    padding:15px;

    border-radius:13px;

    background:#f8fafc;

    border:1px solid #e5e7eb;

    color:#4b5563;

    font-size:13px;
    line-height:1.65;
}

.info strong{
    color:#111827;
}


/* FOOTER */

.footer{
    text-align:center;
    margin-top:22px;

    color:#9ca3af;
    font-size:12px;
}


/* MOBILE */

@media(max-width:500px){

    .brand{
        font-size:17px;
    }

    .container{
        padding:18px 11px 35px;
    }

    .title-icon{
        font-size:42px;
    }

    .title h1{
        font-size:25px;
    }

    .card{
        padding:14px;
        border-radius:17px;
    }

    .fractions{
        gap:7px;
    }

    .operator-symbol{
        width:36px;
        height:36px;
        font-size:19px;
    }

    .frac-input{
        height:46px;
        font-size:18px;
    }

    .result-fraction{
        font-size:26px;
    }
}


/* SMALL PHONE */

@media(max-width:360px){

    .badge{
        display:none;
    }

    .title h1{
        font-size:23px;
    }

    .operations{
        gap:5px;
    }

    .op{
        height:42px;
        font-size:18px;
    }

    .fraction-box{
        padding:11px 7px;
    }

    .frac-input{
        height:43px;
        font-size:16px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="brand">
        🧮 Adiyogi Tools
    </div>

    <div class="badge">
        FRACTION
    </div>

</header>


<main class="container">


<section class="title">

    <div class="title-icon">
        🔢
    </div>

    <h1>
        Fraction Calculator
    </h1>

    <p>
        Add, subtract, multiply and divide fractions.
    </p>

</section>


<section class="card">


    <div class="operation-title">
        Select Operation
    </div>


    <div class="operations">

        <button
            class="op active"
            data-op="+">
            +
        </button>

        <button
            class="op"
            data-op="-">
            −
        </button>

        <button
            class="op"
            data-op="×">
            ×
        </button>

        <button
            class="op"
            data-op="÷">
            ÷
        </button>

    </div>


    <div class="fractions">


        <!-- FRACTION A -->

        <div class="fraction-box">

            <div class="fraction-label">
                FIRST FRACTION
            </div>

            <input
                id="num1"
                class="frac-input"
                type="number"
                inputmode="numeric"
                placeholder="Numerator">

            <div class="fraction-line"></div>

            <input
                id="den1"
                class="frac-input"
                type="number"
                inputmode="numeric"
                placeholder="Denominator">

        </div>


        <!-- OPERATOR -->

        <div
            id="operatorSymbol"
            class="operator-symbol">
            +
        </div>


        <!-- FRACTION B -->

        <div class="fraction-box">

            <div class="fraction-label">
                SECOND FRACTION
            </div>

            <input
                id="num2"
                class="frac-input"
                type="number"
                inputmode="numeric"
                placeholder="Numerator">

            <div class="fraction-line"></div>

            <input
                id="den2"
                class="frac-input"
                type="number"
                inputmode="numeric"
                placeholder="Denominator">

        </div>


    </div>


    <button
        class="calculate"
        onclick="calculateFraction()">

        Calculate

    </button>


    <div
        id="result"
        class="result">

        <div class="result-title">
            Result
        </div>

        <div
            id="resultFraction"
            class="result-fraction">
        </div>

        <div
            id="resultMixed"
            class="result-mixed">
        </div>

        <div
            id="resultDecimal"
            class="result-decimal">
        </div>

    </div>


    <button
        class="clear"
        onclick="clearAll()">

        Clear All

    </button>


    <div class="info">

        <strong>Examples:</strong><br><br>

        • 1/2 + 1/3 = <strong>5/6</strong><br>

        • 3/4 − 1/4 = <strong>1/2</strong><br>

        • 2/3 × 3/4 = <strong>1/2</strong><br>

        • 3/5 ÷ 2/7 = <strong>21/10</strong>

    </div>


</section>


<div class="footer">
    © Adiyogi Tools
</div>


</main>


<script>

/* =========================================
   STATE
========================================= */

let operation = "+";


/* =========================================
   GCD
========================================= */

function gcd(a,b){

    a = Math.abs(a);
    b = Math.abs(b);

    while(b !== 0){

        const temp = b;

        b = a % b;

        a = temp;

    }

    return a;
}


/* =========================================
   SIMPLIFY
========================================= */

function simplify(num,den){

    if(den === 0){

        throw new Error(
            "Denominator cannot be zero."
        );

    }


    if(num === 0){

        return {
            num:0,
            den:1
        };

    }


    if(den < 0){

        num = -num;
        den = -den;

    }


    const divisor =
        gcd(num,den);


    return {

        num:num/divisor,

        den:den/divisor

    };

}


/* =========================================
   FORMAT
========================================= */

function formatNumber(value){

    if(
        Math.abs(value) < 1e-12
    )
        value=0;

    return Number(
        value.toFixed(12)
    ).toString();

}


/* =========================================
   MIXED NUMBER
========================================= */

function mixedNumber(num,den){

    if(den === 0)
        return "";

    if(
        Math.abs(num) < den
    )
        return "";


    const whole =
        Math.trunc(num / den);


    const remainder =
        Math.abs(num % den);


    if(remainder === 0){

        return String(whole);

    }


    return (
        whole +
        " " +
        remainder +
        "/" +
        den
    );

}


/* =========================================
   OPERATION BUTTONS
========================================= */

document
.querySelectorAll(".op")
.forEach(function(button){

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".op")
            .forEach(function(b){

                b.classList.remove(
                    "active"
                );

            });


            button.classList.add(
                "active"
            );


            operation =
                button.dataset.op;


            document
            .getElementById(
                "operatorSymbol"
            )
            .textContent =
                operation;

        }
    );

});


/* =========================================
   CALCULATE
========================================= */

function calculateFraction(){

    const num1 =
        Number(
            document
            .getElementById("num1")
            .value
        );

    const den1 =
        Number(
            document
            .getElementById("den1")
            .value
        );

    const num2 =
        Number(
            document
            .getElementById("num2")
            .value
        );

    const den2 =
        Number(
            document
            .getElementById("den2")
            .value
        );


    if(
        !Number.isFinite(num1) ||
        !Number.isFinite(den1) ||
        !Number.isFinite(num2) ||
        !Number.isFinite(den2)
    ){

        alert(
            "Please enter all four values."
        );

        return;

    }


    if(
        den1 === 0 ||
        den2 === 0
    ){

        alert(
            "Denominator cannot be zero."
        );

        return;

    }


    let numerator;
    let denominator;


    /* ADD */

    if(operation === "+"){

        numerator =
            num1 * den2 +
            num2 * den1;

        denominator =
            den1 * den2;

    }


    /* SUBTRACT */

    else if(operation === "-"){

        numerator =
            num1 * den2 -
            num2 * den1;

        denominator =
            den1 * den2;

    }


    /* MULTIPLY */

    else if(operation === "×"){

        numerator =
            num1 * num2;

        denominator =
            den1 * den2;

    }


    /* DIVIDE */

    else if(operation === "÷"){

        if(num2 === 0){

            alert(
                "Cannot divide by zero."
            );

            return;

        }


        numerator =
            num1 * den2;

        denominator =
            den1 * num2;

    }


    const result =
        simplify(
            numerator,
            denominator
        );


    const finalNum =
        result.num;

    const finalDen =
        result.den;


    /* RESULT FRACTION */

    const resultFraction =
        document
        .getElementById(
            "resultFraction"
        );


    if(finalDen === 1){

        resultFraction.innerHTML =
            `<span class="result-num">
                ${finalNum}
            </span>`;

    }else{

        resultFraction.innerHTML =

            `<span class="result-num">
                ${finalNum}
            </span>

            <span class="result-line"></span>

            <span class="result-den">
                ${finalDen}
            </span>`;

    }


    /* MIXED */

    const mixed =
        mixedNumber(
            finalNum,
            finalDen
        );


    document
    .getElementById(
        "resultMixed"
    )
    .textContent =
        mixed
        ?
        "Mixed Number: " + mixed
        :
        "";


    /* DECIMAL */

    const decimal =
        finalNum / finalDen;


    document
    .getElementById(
        "resultDecimal"
    )
    .textContent =
        "Decimal: " +
        formatNumber(decimal);


    document
    .getElementById(
        "result"
    )
    .classList.add(
        "show"
    );

}


/* =========================================
   CLEAR
========================================= */

function clearAll(){

    document
    .querySelectorAll(
        ".frac-input"
    )
    .forEach(function(input){

        input.value = "";

    });


    document
    .getElementById(
        "result"
    )
    .classList.remove(
        "show"
    );

}


/* =========================================
   ENTER KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            calculateFraction();

        }

    }
);

</script>


</body>

</html>
