<!DOCTYPE html>
<html lang="en">

<head>
   

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Percentage Calculator - Adiyogi Tools</title>

<style>

/* ================================
   RESET
================================ */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

body{
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}


/* ================================
   HEADER
================================ */

.header{

    width:100%;
    min-height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 18px;

    background:#0d1322;
    color:white;

    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.brand{

    font-size:19px;
    font-weight:700;
}

.header-badge{

    padding:8px 11px;

    border-radius:12px;

    background:#192842;

    color:#9edbff;

    font-size:11px;
    font-weight:700;
}


/* ================================
   PAGE
================================ */

.container{

    width:100%;
    max-width:700px;

    margin:auto;

    padding:22px 15px 40px;
}


/* ================================
   TITLE
================================ */

.page-title{

    text-align:center;

    margin-bottom:20px;
}

.page-title .icon{

    font-size:48px;

    margin-bottom:7px;
}

.page-title h1{

    font-size:28px;

    margin-bottom:6px;
}

.page-title p{

    color:#6b7280;

    font-size:15px;
}


/* ================================
   CALCULATOR CARD
================================ */

.calculator{

    background:white;

    border-radius:20px;

    padding:18px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.08);

    border:1px solid #e5e7eb;
}


/* ================================
   TABS
================================ */

.tabs{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:8px;

    margin-bottom:18px;
}

.tab{

    border:0;

    padding:12px 7px;

    border-radius:11px;

    background:#eef1f6;

    color:#374151;

    font-size:13px;

    font-weight:700;

    cursor:pointer;
}

.tab.active{

    background:#7545f5;

    color:white;
}

.tab:active{

    transform:scale(.97);
}


/* ================================
   MODE
================================ */

.mode{

    display:none;
}

.mode.active{

    display:block;
}


/* ================================
   FORM
================================ */

.form-group{

    margin-bottom:15px;
}

.label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:700;

    color:#374151;
}

.input-row{

    display:flex;

    gap:8px;
}

.input-wrap{

    position:relative;

    flex:1;
}

.input{

    width:100%;

    height:52px;

    border:2px solid #d8deea;

    border-radius:12px;

    padding:0 45px 0 14px;

    outline:none;

    background:#f9fafb;

    color:#111827;

    font-size:18px;
}

.input:focus{

    border-color:#7545f5;

    background:white;
}

.percent-symbol{

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    color:#6b7280;

    font-weight:700;
}


/* ================================
   CALCULATE BUTTON
================================ */

.calculate-btn{

    width:100%;

    height:52px;

    margin-top:5px;

    border:0;

    border-radius:13px;

    background:#7545f5;

    color:white;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 5px 14px rgba(117,69,245,.25);
}

.calculate-btn:active{

    transform:scale(.98);

    background:#6337d8;
}


/* ================================
   RESULT
================================ */

.result{

    display:none;

    margin-top:18px;

    padding:18px;

    border-radius:14px;

    background:#f0ecff;

    border:1px solid #d9ceff;

    text-align:center;
}

.result.show{

    display:block;
}

.result-label{

    color:#6b7280;

    font-size:13px;

    margin-bottom:6px;
}

.result-value{

    color:#5d32d4;

    font-size:30px;

    font-weight:800;

    word-break:break-word;
}

.result-sub{

    margin-top:7px;

    color:#4b5563;

    font-size:14px;
}


/* ================================
   INFO
================================ */

.info{

    margin-top:18px;

    padding:15px;

    border-radius:13px;

    background:#f8fafc;

    border:1px solid #e5e7eb;

    color:#4b5563;

    font-size:13px;

    line-height:1.6;
}

.info strong{

    color:#111827;
}


/* ================================
   CLEAR
================================ */

.clear-btn{

    width:100%;

    height:45px;

    margin-top:10px;

    border:1px solid #d8deea;

    border-radius:11px;

    background:#f3f4f6;

    color:#374151;

    font-weight:700;

    cursor:pointer;
}

.clear-btn:active{

    transform:scale(.98);
}


/* ================================
   FOOTER
================================ */

.footer{

    text-align:center;

    color:#9ca3af;

    font-size:12px;

    margin-top:22px;
}


/* ================================
   MOBILE
================================ */

@media(max-width:500px){

    .header{

        min-height:58px;

        padding:9px 13px;
    }

    .brand{

        font-size:17px;
    }

    .container{

        padding:18px 12px 35px;
    }

    .page-title .icon{

        font-size:42px;
    }

    .page-title h1{

        font-size:25px;
    }

    .calculator{

        padding:15px;

        border-radius:17px;
    }

    .tabs{

        gap:6px;
    }

    .tab{

        font-size:12px;

        padding:11px 5px;
    }

    .input{

        height:50px;

        font-size:17px;
    }

    .result-value{

        font-size:27px;
    }

}


/* ================================
   SMALL PHONE
================================ */

@media(max-width:360px){

    .header-badge{

        display:none;
    }

    .page-title h1{

        font-size:23px;
    }

    .tab{

        font-size:11px;
    }

}

</style>

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header class="header">

    <div class="brand">
        🧮 Adiyogi Tools
    </div>

    <div class="header-badge">
        PERCENTAGE
    </div>

</header>


<!-- ================================
     MAIN
================================ -->

<main class="container">


    <section class="page-title">

        <div class="icon">
            📊
        </div>

        <h1>
            Percentage Calculator
        </h1>

        <p>
            Calculate percentages quickly and easily.
        </p>

    </section>


    <section class="calculator">


        <!-- ============================
             TABS
        ============================= -->

        <div class="tabs">

            <button
                class="tab active"
                data-mode="percentOf">
                X% of Y
            </button>

            <button
                class="tab"
                data-mode="whatPercent">
                X is what %
            </button>

            <button
                class="tab"
                data-mode="increase">
                Increase / Decrease
            </button>

            <button
                class="tab"
                data-mode="change">
                % Change
            </button>

        </div>


        <!-- ============================
             MODE 1
        ============================= -->

        <div
            id="percentOf"
            class="mode active">

            <div class="form-group">

                <label class="label">
                    Percentage
                </label>

                <div class="input-wrap">

                    <input
                        id="percentValue"
                        class="input"
                        type="number"
                        inputmode="decimal"
                        placeholder="Example: 20">

                    <span class="percent-symbol">
                        %
                    </span>

                </div>

            </div>


            <div class="form-group">

                <label class="label">
                    Number
                </label>

                <input
                    id="baseValue"
                    class="input"
                    type="number"
                    inputmode="decimal"
                    placeholder="Example: 500">

            </div>


            <button
                class="calculate-btn"
                onclick="calculatePercentOf()">

                Calculate

            </button>


            <div
                id="result1"
                class="result">

                <div class="result-label">
                    Result
                </div>

                <div
                    id="resultValue1"
                    class="result-value">
                </div>

                <div
                    id="resultSub1"
                    class="result-sub">
                </div>

            </div>

        </div>


        <!-- ============================
             MODE 2
        ============================= -->

        <div
            id="whatPercent"
            class="mode">

            <div class="form-group">

                <label class="label">
                    Value
                </label>

                <input
                    id="partValue"
                    class="input"
                    type="number"
                    inputmode="decimal"
                    placeholder="Example: 100">

            </div>


            <div class="form-group">

                <label class="label">
                    Total / Number
                </label>

                <input
                    id="totalValue"
                    class="input"
                    type="number"
                    inputmode="decimal"
                    placeholder="Example: 500">

            </div>


            <button
                class="calculate-btn"
                onclick="calculateWhatPercent()">

                Calculate

            </button>


            <div
                id="result2"
                class="result">

                <div class="result-label">
                    Percentage
                </div>

                <div
                    id="resultValue2"
                    class="result-value">
                </div>

                <div
                    id="resultSub2"
                    class="result-sub">
                </div>

            </div>

        </div>


        <!-- ============================
             MODE 3
        ============================= -->

        <div
            id="increase"
            class="mode">

            <div class="form-group">

                <label class="label">
                    Original Value
                </label>

                <input
                    id="originalValue"
                    class="input"
                    type="number"
                    inputmode="decimal"
                    placeholder="Example: 500">

            </div>


            <div class="form-group">

                <label class="label">
                    Percentage
                </label>

                <div class="input-wrap">

                    <input
                        id="increasePercent"
                        class="input"
                        type="number"
                        inputmode="decimal"
                        placeholder="Example: 20">

                    <span class="percent-symbol">
                        %
                    </span>

                </div>

            </div>


            <div class="form-group">

                <label class="label">
                    Operation
                </label>

                <select
                    id="increaseType"
                    class="input">

                    <option value="increase">
                        Increase
                    </option>

                    <option value="decrease">
                        Decrease
                    </option>

                </select>

            </div>


            <button
                class="calculate-btn"
                onclick="calculateIncrease()">

                Calculate

            </button>


            <div
                id="result3"
                class="result">

                <div class="result-label">
                    Final Value
                </div>

                <div
                    id="resultValue3"
                    class="result-value">
                </div>

                <div
                    id="resultSub3"
                    class="result-sub">
                </div>

            </div>

        </div>


        <!-- ============================
             MODE 4
        ============================= -->

        <div
            id="change"
            class="mode">

            <div class="form-group">

                <label class="label">
                    Old Value
                </label>

                <input
                    id="oldValue"
                    class="input"
                    type="number"
                    inputmode="decimal"
                    placeholder="Example: 500">

            </div>


            <div class="form-group">

                <label class="label">
                    New Value
                </label>

                <input
                    id="newValue"
                    class="input"
                    type="number"
                    inputmode="decimal"
                    placeholder="Example: 600">

            </div>


            <button
                class="calculate-btn"
                onclick="calculateChange()">

                Calculate

            </button>


            <div
                id="result4"
                class="result">

                <div class="result-label">
                    Percentage Change
                </div>

                <div
                    id="resultValue4"
                    class="result-value">
                </div>

                <div
                    id="resultSub4"
                    class="result-sub">
                </div>

            </div>

        </div>


        <!-- ============================
             CLEAR
        ============================= -->

        <button
            class="clear-btn"
            onclick="clearCalculator()">

            Clear All

        </button>


        <!-- ============================
             INFO
        ============================= -->

        <div class="info">

            <strong>Examples:</strong><br><br>

            • 20% of 500 = <strong>100</strong><br>

            • 100 is <strong>20%</strong> of 500<br>

            • Increase 500 by 20% = <strong>600</strong><br>

            • 500 → 600 = <strong>20% increase</strong>

        </div>


    </section>


    <div class="footer">

        © Adiyogi Tools

    </div>


</main>


<script>

/* =========================================
   FORMAT NUMBER
========================================= */

function formatNumber(value){

    if(!Number.isFinite(value))
        return "Error";

    if(
        Math.abs(value) < 1e-12
    ){
        value = 0;
    }

    return Number(
        value.toFixed(10)
    ).toString();
}


/* =========================================
   SHOW RESULT
========================================= */

function showResult(
    resultId,
    valueId,
    subId,
    value,
    sub
){

    document
        .getElementById(resultId)
        .classList.add("show");

    document
        .getElementById(valueId)
        .textContent = value;

    document
        .getElementById(subId)
        .textContent = sub || "";

}


/* =========================================
   TAB SYSTEM
========================================= */

document
.querySelectorAll(".tab")
.forEach(function(tab){

    tab.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".tab")
            .forEach(function(t){

                t.classList.remove(
                    "active"
                );

            });


            document
            .querySelectorAll(".mode")
            .forEach(function(mode){

                mode.classList.remove(
                    "active"
                );

            });


            tab.classList.add(
                "active"
            );


            document
            .getElementById(
                tab.dataset.mode
            )
            .classList.add(
                "active"
            );

        }
    );

});


/* =========================================
   1. X% OF Y
========================================= */

function calculatePercentOf(){

    const percent =
        Number(
            document
            .getElementById(
                "percentValue"
            )
            .value
        );

    const number =
        Number(
            document
            .getElementById(
                "baseValue"
            )
            .value
        );


    if(
        !Number.isFinite(percent) ||
        !Number.isFinite(number)
    ){

        alert(
            "Please enter both values."
        );

        return;
    }


    const result =
        (percent / 100) * number;


    showResult(

        "result1",

        "resultValue1",

        "resultSub1",

        formatNumber(result),

        percent +
        "% of " +
        number +
        " = " +
        formatNumber(result)

    );

}


/* =========================================
   2. X IS WHAT %
========================================= */

function calculateWhatPercent(){

    const part =
        Number(
            document
            .getElementById(
                "partValue"
            )
            .value
        );

    const total =
        Number(
            document
            .getElementById(
                "totalValue"
            )
            .value
        );


    if(
        !Number.isFinite(part) ||
        !Number.isFinite(total)
    ){

        alert(
            "Please enter both values."
        );

        return;
    }


    if(total === 0){

        alert(
            "Total cannot be zero."
        );

        return;
    }


    const result =
        (part / total) * 100;


    showResult(

        "result2",

        "resultValue2",

        "resultSub2",

        formatNumber(result) + "%",

        part +
        " is " +
        formatNumber(result) +
        "% of " +
        total

    );

}


/* =========================================
   3. INCREASE / DECREASE
========================================= */

function calculateIncrease(){

    const original =
        Number(
            document
            .getElementById(
                "originalValue"
            )
            .value
        );

    const percent =
        Number(
            document
            .getElementById(
                "increasePercent"
            )
            .value
        );

    const type =
        document
        .getElementById(
            "increaseType"
        )
        .value;


    if(
        !Number.isFinite(original) ||
        !Number.isFinite(percent)
    ){

        alert(
            "Please enter all values."
        );

        return;
    }


    const change =
        original *
        percent /
        100;


    let finalValue;


    if(type === "increase"){

        finalValue =
            original + change;

    }else{

        finalValue =
            original - change;

    }


    const operation =
        type === "increase"
        ? "increased"
        : "decreased";


    showResult(

        "result3",

        "resultValue3",

        "resultSub3",

        formatNumber(finalValue),

        original +
        " " +
        operation +
        " by " +
        percent +
        "% = " +
        formatNumber(finalValue)

    );

}


/* =========================================
   4. PERCENTAGE CHANGE
========================================= */

function calculateChange(){

    const oldValue =
        Number(
            document
            .getElementById(
                "oldValue"
            )
            .value
        );

    const newValue =
        Number(
            document
            .getElementById(
                "newValue"
            )
            .value
        );


    if(
        !Number.isFinite(oldValue) ||
        !Number.isFinite(newValue)
    ){

        alert(
            "Please enter both values."
        );

        return;
    }


    if(oldValue === 0){

        alert(
            "Old value cannot be zero."
        );

        return;
    }


    const change =
        (
            (newValue - oldValue)
            /
            Math.abs(oldValue)
        ) * 100;


    let type;


    if(change > 0){

        type = "Increase";

    }else if(change < 0){

        type = "Decrease";

    }else{

        type = "No change";

    }


    showResult(

        "result4",

        "resultValue4",

        "resultSub4",

        formatNumber(
            Math.abs(change)
        ) + "%",

        type +
        " from " +
        oldValue +
        " to " +
        newValue

    );

}


/* =========================================
   CLEAR
========================================= */

function clearCalculator(){

    document
    .querySelectorAll(
        "input"
    )
    .forEach(function(input){

        input.value = "";

    });


    document
    .querySelectorAll(
        ".result"
    )
    .forEach(function(result){

        result.classList.remove(
            "show"
        );

    });

}


/* =========================================
   ENTER KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Enter")
            return;


        const activeMode =
            document
            .querySelector(
                ".mode.active"
            );


        if(!activeMode)
            return;


        if(
            activeMode.id ===
            "percentOf"
        ){

            calculatePercentOf();

        }else if(
            activeMode.id ===
            "whatPercent"
        ){

            calculateWhatPercent();

        }else if(
            activeMode.id ===
            "increase"
        ){

            calculateIncrease();

        }else if(
            activeMode.id ===
            "change"
        ){

            calculateChange();

        }

    }
);

</script>

</body>

</html>
