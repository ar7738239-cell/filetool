<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Adiyogi Scientific Calculator</title>

<style>
:root{
  --bg:#070d1b;
  --panel:#111a2e;
  --key:#29334a;
  --key2:#374158;
  --text:#f8fafc;
  --muted:#9fb0ca;
  --accent:#7c4dff;
  --green:#19a866;
  --orange:#f47f4c;
  --yellow:#f2e85c;
  --purple:#d2a9ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

body{
  min-height:100vh;
  overflow-y:auto;
}

button{
  font:inherit;
  border:0;
  color:var(--text);
  touch-action:manipulation;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

button:active{
  transform:scale(.97);
}

.app{
  width:min(760px,100%);
  margin:auto;
  padding:8px 12px 40px;
}

/* HEADER */

.top{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(7,13,27,.97);
  padding:8px 0 6px;
  border-bottom:1px solid #1d2942;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.brand h1{
  font-size:21px;
  margin:0;
}

.badges{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.badge{
  background:#1b2740;
  color:#a9c9ee;
  border-radius:14px;
  padding:6px 9px;
  font-size:12px;
}

.modes{
  display:flex;
  gap:20px;
  padding:9px 7px 4px;
  font-weight:800;
  color:#a9b6ca;
}

.modes .on{
  color:#67c8ff;
}

/* DISPLAY */

.display{
  background:#dcebea;
  color:#101820;
  border-radius:18px;
  min-height:110px;
  padding:10px 14px;
  margin:4px 3px 8px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  overflow:hidden;
  border:2px solid #c4d8d7;
}

.expr{
  font-size:18px;
  min-height:28px;
  white-space:nowrap;
  overflow-x:auto;
  text-align:right;
}

.ans{
  font-size:38px;
  font-weight:700;
  min-height:48px;
  text-align:right;
  white-space:nowrap;
  overflow-x:auto;
}

/* FRACTION */

.fraction{
  display:inline-flex;
  vertical-align:middle;
  flex-direction:column;
  line-height:.95;
  text-align:center;
  margin:0 2px;
}

.fraction .num{
  border-bottom:2px solid currentColor;
  padding:0 4px;
}

.fraction .den{
  padding:2px 4px 0;
}

.frac-editor{
  display:none;
  margin:8px 3px;
  background:#10192c;
  border-radius:14px;
  padding:10px;
}

.frac-editor.show{
  display:block;
}

.frac-line{
  height:2px;
  background:#cbd5e1;
  margin:5px 0;
}

.frac-slot{
  min-height:35px;
  text-align:center;
  font-size:22px;
  color:#fff;
}

.active-slot{
  outline:2px solid #7c4dff;
  border-radius:7px;
}

/* KEYPAD */

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}

.key{
  min-height:52px;
  background:var(--key);
  border-radius:13px;
  font-weight:700;
  font-size:15px;
}

.key.op{
  background:var(--key2);
}

.key.ac{
  background:var(--orange);
  color:#101820;
}

.key.eq{
  background:var(--green);
}

.key.mode{
  background:#7c4dff;
}

.key.alt{
  color:var(--yellow);
}

.key.purple{
  color:var(--purple);
}

.key.small{
  font-size:12px;
}

/* ENGINEERING */

.section{
  margin:14px 0;
  background:var(--panel);
  border:1px solid #293650;
  border-radius:18px;
  padding:12px;
}

.section h2{
  font-size:19px;
  margin:0 0 10px;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.tool{
  background:#263149;
  border:1px solid #3b4862;
  border-radius:12px;
  padding:13px;
  font-weight:700;
}

/* HISTORY */

.history-item{
  padding:8px 0;
  border-bottom:1px solid #27344d;
}

.history-item:last-child{
  border-bottom:0;
}

.history-item small{
  display:block;
  color:var(--muted);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.box{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111a2e;
  border:1px solid #34435f;
  border-radius:18px;
  padding:16px;
}

.box h2{
  margin:0 0 12px;
}

.box input,
.box textarea,
.box select{
  width:100%;
  background:#0b1325;
  color:#fff;
  border:1px solid #3b4a66;
  border-radius:10px;
  padding:11px;
  margin:5px 0;
  font-size:16px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.modal-actions button{
  flex:1;
  padding:12px;
  border-radius:10px;
  background:#293650;
}

.modal-actions .primary{
  background:#19a866;
}

.result{
  margin-top:12px;
  background:#0b1325;
  border-radius:10px;
  padding:12px;
  white-space:pre-wrap;
  overflow:auto;
}

.note{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

/* MOBILE */

@media(max-width:430px){

  .app{
    padding:4px 7px 28px;
  }

  .grid{
    gap:4px;
  }

  .key{
    min-height:47px;
    border-radius:11px;
    font-size:14px;
  }

  .display{
    min-height:102px;
  }

  .ans{
    font-size:32px;
  }

  .expr{
    font-size:16px;
  }

  .brand h1{
    font-size:18px;
  }

  .badge{
    padding:5px 7px;
    font-size:10px;
  }

  .tools{
    gap:6px;
  }

  .tool{
    padding:11px 7px;
    font-size:13px;
  }
}
</style>
</head>

<script>
"use strict";

/* =========================================================
   BASIC REFERENCES
========================================================= */

const $ = id => document.getElementById(id);

const $$ = selector =>
document.querySelectorAll(selector);


/* =========================================================
   CALCULATOR STATE
========================================================= */

let expr = "";
let answer = 0;
let memory = 0;

let angleMode = "DEG";

let cursor = 0;

let second = false;

let fracMode = false;
let fracPart = "num";
let fracNum = "0";
let fracDen = "1";

let historyData = [];

let state = {
  type:null
};


/* =========================================================
   FORMAT
========================================================= */

function format(value){

  if(typeof value !== "number")
    return String(value);

  if(!Number.isFinite(value))
    return "Error";

  if(Math.abs(value) < 1e-12)
    value = 0;

  return Number(value.toPrecision(12)).toString();
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================================================
   ANGLE
========================================================= */

function toRad(x){

  if(angleMode === "DEG")
    return x * Math.PI / 180;

  if(angleMode === "GRAD")
    return x * Math.PI / 200;

  return x;
}


function fromRad(x){

  if(angleMode === "DEG")
    return x * 180 / Math.PI;

  if(angleMode === "GRAD")
    return x * 200 / Math.PI;

  return x;
}


function setAngle(mode){

  angleMode = mode;

  $("angleBadge").textContent = mode;

  render();
}


/* =========================================================
   MATH FUNCTIONS
========================================================= */

function factorial(n){

  n = Number(n);

  if(!Number.isInteger(n) || n < 0)
    throw Error("Factorial requires a non-negative integer");

  if(n > 170)
    throw Error("Number too large");

  let r = 1;

  for(let i=2;i<=n;i++)
    r *= i;

  return r;
}


function gcd(a,b){

  a = Math.abs(Math.trunc(a));
  b = Math.abs(Math.trunc(b));

  while(b){
    let t = a % b;
    a = b;
    b = t;
  }

  return a;
}


function lcm(a,b){

  if(a === 0 || b === 0)
    return 0;

  return Math.abs(a*b)/gcd(a,b);
}


function npr(n,r){

  if(n<0 || r<0 || r>n)
    throw Error("Invalid nPr");

  return factorial(n)/factorial(n-r);
}


function ncr(n,r){

  if(n<0 || r<0 || r>n)
    throw Error("Invalid nCr");

  return factorial(n)/(factorial(r)*factorial(n-r));
}


/* =========================================================
   EXPRESSION ENGINE
========================================================= */

function evalExpr(input){

  let s = String(input)
  .trim();

  if(!s)
    return 0;

  s = s
  .replace(/π/g,"Math.PI")
  .replace(/\be\b/g,"Math.E")
  .replace(/×/g,"*")
  .replace(/÷/g,"/")
  .replace(/−/g,"-");

  s = s.replace(/\^/g,"**");

  s = s.replace(/\bANS\b/g,`(${answer})`);

  s = s.replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");

  s = s.replace(/sqrt\(/g,"Math.sqrt(");
  s = s.replace(/cbrt\(/g,"Math.cbrt(");
  s = s.replace(/abs\(/g,"Math.abs(");
  s = s.replace(/floor\(/g,"Math.floor(");
  s = s.replace(/ceil\(/g,"Math.ceil(");
  s = s.replace(/round\(/g,"Math.round(");

  s = s.replace(/sin\(/g,`Math.sin(`);
  s = s.replace(/cos\(/g,`Math.cos(`);
  s = s.replace(/tan\(/g,`Math.tan(`);

  s = s.replace(/log\(/g,"Math.log10(");
  s = s.replace(/ln\(/g,"Math.log(");

  s = s.replace(/exp\(/g,"Math.exp(");

  s = s.replace(/asin\(/g,`Math.asin(`);
  s = s.replace(/acos\(/g,`Math.acos(`);
  s = s.replace(/atan\(/g,`Math.atan(`);

  s = s.replace(/sinh\(/g,"Math.sinh(");
  s = s.replace(/cosh\(/g,"Math.cosh(");
  s = s.replace(/tanh\(/g,"Math.tanh(");

  /*
     Convert trig arguments correctly for DEG/GRAD.
     The expression parser supports direct function syntax.
  */

  s = s.replace(
    /TRIG_PLACEHOLDER/g,
    ""
  );

  /*
     Evaluate.
     Function constructors are intentionally restricted
     to mathematical expressions generated by this calculator.
  */

  const fn = Function(
    `"use strict";return (${s})`
  );

  const result = fn();

  if(typeof result !== "number" ||
     !Number.isFinite(result))
    throw Error("Invalid calculation");

  return result;
}


/* =========================================================
   TRIG EVALUATION
========================================================= */

function trigValue(fn,x){

  const r = toRad(x);

  if(fn === "sin")
    return Math.sin(r);

  if(fn === "cos")
    return Math.cos(r);

  if(fn === "tan")
    return Math.tan(r);

  if(fn === "asin")
    return fromRad(Math.asin(x));

  if(fn === "acos")
    return fromRad(Math.acos(x));

  if(fn === "atan")
    return fromRad(Math.atan(x));

  throw Error("Unknown function");
}


/* =========================================================
   INSERT
========================================================= */

function insert(value){

  if(fracMode){

    if(fracPart === "num"){

      if(fracNum === "0")
        fracNum = "";

      fracNum += value;

    }else{

      if(fracDen === "1")
        fracDen = "";

      fracDen += value;

    }

    render();
    return;
  }


  expr =
    expr.slice(0,cursor) +
    value +
    expr.slice(cursor);

  cursor += value.length;

  render();
}


/* =========================================================
   DELETE
========================================================= */

function backspace(){

  if(fracMode){

    if(fracPart === "num"){
      fracNum = fracNum.slice(0,-1) || "0";
    }else{
      fracDen = fracDen.slice(0,-1) || "1";
    }

    render();
    return;
  }

  if(cursor <= 0)
    return;

  expr =
    expr.slice(0,cursor-1) +
    expr.slice(cursor);

  cursor--;

  render();
}


/* =========================================================
   FUNCTION BUTTONS
========================================================= */

function applyFn(fn){

  if(fn === "mod"){
    insert("%");
    return;
  }

  if(fracMode){

    finishFraction();

  }

  let value;

  try{

    if(expr.trim() === ""){
      expr = "0";
      cursor = expr.length;
    }

    value = evalExpr(expr);

    if(
      ["sin","cos","tan","asin","acos","atan"].includes(fn)
    ){

      value = trigValue(fn,value);

    }else if(fn === "sinh"){

      value = Math.sinh(value);

    }else if(fn === "cosh"){

      value = Math.cosh(value);

    }else if(fn === "tanh"){

      value = Math.tanh(value);

    }else if(fn === "sqrt"){

      value = Math.sqrt(value);

    }else if(fn === "cbrt"){

      value = Math.cbrt(value);

    }else if(fn === "sq"){

      value = value ** 2;

    }else if(fn === "pow"){

      insert("**");

      return;

    }else if(fn === "inv"){

      value = 1/value;

    }else if(fn === "abs"){

      value = Math.abs(value);

    }else if(fn === "floor"){

      value = Math.floor(value);

    }else if(fn === "ceil"){

      value = Math.ceil(value);

    }else if(fn === "round"){

      value = Math.round(value);

    }else if(fn === "fact"){

      value = factorial(value);

    }else if(fn === "sign"){

      value = Math.sign(value);

    }else if(fn === "npr"){

      let parts = expr.split(",");

      if(parts.length !== 2)
        throw Error("Use nPr as n,r");

      value = npr(
        evalExpr(parts[0]),
        evalExpr(parts[1])
      );

    }else if(fn === "ncr"){

      let parts = expr.split(",");

      if(parts.length !== 2)
        throw Error("Use nCr as n,r");

      value = ncr(
        evalExpr(parts[0]),
        evalExpr(parts[1])
      );

    }else if(fn === "gcd"){

      let parts = expr.split(",");

      if(parts.length !== 2)
        throw Error("Use GCD as a,b");

      value = gcd(
        evalExpr(parts[0]),
        evalExpr(parts[1])
      );

    }else if(fn === "lcm"){

      let parts = expr.split(",");

      if(parts.length !== 2)
        throw Error("Use LCM as a,b");

      value = lcm(
        evalExpr(parts[0]),
        evalExpr(parts[1])
      );

    }else if(fn === "logbase"){

      let parts = expr.split(",");

      if(parts.length !== 2)
        throw Error("Use logₐ as base,value");

      value =
        Math.log(evalExpr(parts[1])) /
        Math.log(evalExpr(parts[0]));

    }

    answer = value;

    expr = format(value);
    cursor = expr.length;

    render();

  }catch(error){

    $("ans").textContent =
      "Error";

    $("expr").textContent =
      error.message || "Invalid";

  }

}


/* =========================================================
   CALCULATE
========================================================= */

function calculate(){

  try{

    if(!expr.trim())
      return;

    const old = expr;

    const value =
      evalExpr(expr);

    answer = value;

    addHistory(
      old,
      value
    );

    expr = format(value);

    cursor = expr.length;

    render();

  }catch(error){

    $("ans").textContent =
      "Error";

    $("expr").textContent =
      error.message || "Invalid expression";

  }

}


/* =========================================================
   FRACTION
========================================================= */

function finishFraction(){

  if(!fracMode)
    return;

  try{

    const n =
      evalExpr(fracNum || "0");

    const d =
      evalExpr(fracDen || "1");

    if(d === 0)
      throw Error("Denominator cannot be zero");

    expr =
      format(n/d);

    cursor =
      expr.length;

    fracMode = false;

    render();

  }catch(error){

    $("ans").textContent =
      "Error";

  }
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  $("expr").textContent =
    expr || "";

  $("ans").textContent =
    expr ? expr : "0";

  if(fracMode){

    $("fracEditor")
      .classList.add("show");

    $("fracNum").textContent =
      fracNum;

    $("fracDen").textContent =
      fracDen;

    $("fracNum")
      .classList.toggle(
        "active-slot",
        fracPart === "num"
      );

    $("fracDen")
      .classList.toggle(
        "active-slot",
        fracPart === "den"
      );

  }else{

    $("fracEditor")
      .classList.remove("show");

  }

  $("angleBadge").textContent =
    angleMode;
}


/* =========================================================
   HISTORY
========================================================= */

function addHistory(expression,result){

  historyData.unshift({
    expression,
    result,
    time:new Date().toLocaleString()
  });

  historyData =
    historyData.slice(0,30);

  localStorage.setItem(
    "adiyogiCalcHistory",
    JSON.stringify(historyData)
  );

  renderHistory();
}


function renderHistory(){

  const box =
    $("historyList");

  if(!historyData.length){

    box.textContent =
      "No calculations yet.";

    return;
  }

  box.innerHTML =
    historyData.map(item => `
      <div class="history-item">
        <b>${esc(item.expression)}</b>
        <div>= ${esc(format(Number(item.result)))}</div>
        <small>${esc(item.time)}</small>
      </div>
    `).join("");
}


/* =========================================================
   MEMORY
========================================================= */

function memValue(){

  try{
    return evalExpr(expr || "0");
  }catch{
    return 0;
  }
}


/* =========================================================
   ACTIONS
========================================================= */

function handleAction(action){

  switch(action){

    case "ac":

      expr = "";
      answer = 0;
      cursor = 0;

      fracMode = false;

      render();

      break;


    case "back":

      backspace();

      break;


    case "equals":

      if(fracMode)
        finishFraction();
      else
        calculate();

      break;


    case "ans":

      insert("ANS");

      break;


    case "comma":

      insert(",");

      break;


    case "angle":

      setAngle("DEG");

      break;


    case "angleRad":

      setAngle("RAD");

      break;


    case "angleGrad":

      setAngle("GRAD");

      break;


    case "second":

      second = !second;

      break;


    case "mc":

      memory = 0;

      break;


    case "mr":

      insert(format(memory));

      break;


    case "mplus":

      memory += memValue();

      break;


    case "mminus":

      memory -= memValue();

      break;


    case "ms":

      memory = memValue();

      break;


    case "fraction":

    case "toggleFrac":

      fracMode = !fracMode;

      if(fracMode){

        fracPart = "num";
        fracNum = "0";
        fracDen = "1";

      }

      render();

      break;


    case "home":

      cursor = 0;

      render();

      break;


    case "end":

      cursor = expr.length;

      render();

      break;


    case "left":

      cursor =
        Math.max(0,cursor-1);

      render();

      break;


    case "right":

      cursor =
        Math.min(expr.length,cursor+1);

      render();

      break;


    case "up":

      if(fracMode){

        fracPart = "num";

        render();

      }

      break;


    case "down":

      if(fracMode){

        fracPart = "den";

        render();

      }

      break;


    case "noop":

      break;


    case "history":

      $("historyList")
        .scrollIntoView({
          behavior:"smooth"
        });

      break;
  }

}

/* =========================================================
   FUNCTION FOR ENGINEERING TOOLS
========================================================= */

function parseF(expression,x){

  let s =
    expression
    .replace(/\^/g,"**")
    .replace(/\bx\b/g,`(${x})`);

  return evalExpr(s);
}


/* =========================================================
   MATRIX
========================================================= */

function matrix(text){

  return text
    .split(";")
    .map(row =>
      row.split(",").map(Number)
    );

}


function determinant(A){

  if(A.length !== A[0].length)
    throw Error("Square matrix required");

  let n=A.length;

  let M=A.map(r=>r.slice());

  let det=1;


  for(let i=0;i<n;i++){

    let pivot=i;

    for(let j=i+1;j<n;j++){

      if(
        Math.abs(M[j][i]) >
        Math.abs(M[pivot][i])
      )
        pivot=j;

    }


    if(
      Math.abs(M[pivot][i]) <
      1e-14
    )
      return 0;


    if(pivot!==i){

      [M[pivot],M[i]] =
      [M[i],M[pivot]];

      det *= -1;

    }


    let p =
      M[i][i];

    det *= p;


    for(let j=i+1;j<n;j++){

      let factor =
        M[j][i]/p;

      for(let k=i;k<n;k++){

        M[j][k] -=
          factor*M[i][k];

      }

    }

  }

  return det;

}


/* =========================================================
   MATRIX INVERSE
========================================================= */

function inverse(A){

  let n=A.length;

  if(n !== A[0].length)
    throw Error("Square matrix required");


  let M=A.map(
    (row,i)=>
      row.concat(
        row.map(
          (_,j)=>
            i===j ? 1 : 0
        )
      )
  );


  for(let i=0;i<n;i++){

    let pivot=i;


    for(let j=i+1;j<n;j++){

      if(
        Math.abs(M[j][i]) >
        Math.abs(M[pivot][i])
      )
        pivot=j;

    }


    if(
      Math.abs(M[pivot][i]) <
      1e-14
    )
      throw Error("Singular matrix");


    [M[pivot],M[i]] =
    [M[i],M[pivot]];


    let p=M[i][i];

    M[i]=
      M[i].map(v=>v/p);


    for(let j=0;j<n;j++){

      if(j===i)
        continue;

      let factor=M[j][i];

      M[j]=
        M[j].map(
          (v,k)=>
            v-factor*M[i][k]
        );

    }

  }


  return M.map(
    row=>row.slice(n)
  );

}


function transpose(A){

  return A[0].map(
    (_,j)=>
      A.map(row=>row[j])
  );

}


function matrixMultiply(A,B){

  if(A[0].length !== B.length)
    throw Error("Incompatible dimensions");


  return A.map(
    row =>
      B[0].map(
        (_,j)=>
          row.reduce(
            (sum,value,k)=>
              sum +
              value*B[k][j],
            0
          )
      )
  );

}


function formatMatrix(A){

  return A
    .map(
      row =>
        row.map(format).join("    ")
    )
    .join("\n");

}


/* =========================================================
   RUN ENGINEERING TOOL
========================================================= */

function runTool(){

  const type =
    state.type;


  try{

    let out="";


    /* DERIVATIVE */

    if(type==="derivative"){

      const f =
        $("f").value;

      const x =
        Number($("x").value);

      const h =
        Number($("h").value);


      out =
        (
          parseF(f,x+h) -
          parseF(f,x-h)
        )/(2*h);

    }


    /* INTEGRAL */

    else if(type==="integral"){

      const f =
        $("f").value;

      const a =
        Number($("a").value);

      const b =
        Number($("b").value);

      let n =
        Math.max(
          2,
          Math.floor(
            Number($("n").value)
          )
        );


      if(n%2)
        n++;


      const h =
        (b-a)/n;


      let sum =
        parseF(f,a) +
        parseF(f,b);


      for(let i=1;i<n;i++){

        sum +=
          (i%2 ? 4 : 2) *
          parseF(
            f,
            a+i*h
          );

      }


      out =
        sum*h/3;

    }


    /* LIMIT */

    else if(type==="limit"){

      const f =
        $("f").value;

      const a =
        Number($("a").value);

      const h =
        Number($("h").value);


      out =
        (
          parseF(f,a-h) +
          parseF(f,a+h)
        )/2;

    }


    /* EQUATION */

    else if(type==="equation"){

      const f =
        $("f").value;

      let x =
        Number($("x0").value);


      for(let i=0;i<60;i++){

        const h=1e-6;

        const fx =
          parseF(f,x);

        const derivative =
          (
            parseF(f,x+h) -
            parseF(f,x-h)
          )/(2*h);


        if(
          Math.abs(derivative)
          < 1e-14
        )
          break;


        const next =
          x -
          fx/derivative;


        if(
          Math.abs(next-x)
          < 1e-12
        ){

          x=next;
          break;

        }


        x=next;


        if(!Number.isFinite(x))
          throw Error(
            "No convergence"
          );

      }


      out =
        `x = ${format(x)}\n`+
        `f(x) = ${format(parseF(f,x))}`;

    }


    /* MATRIX */

    else if(type==="matrix"){

      const A =
        matrix($("A").value);

      const op =
        $("mop").value;


      if(op==="det"){

        out =
          format(
            determinant(A)
          );

      }

      else if(op==="inv"){

        out =
          formatMatrix(
            inverse(A)
          );

      }

      else if(op==="transpose"){

        out =
          formatMatrix(
            transpose(A)
          );

      }

      else if(op==="mul"){

        out =
          formatMatrix(
            matrixMultiply(
              A,
              matrix($("B").value)
            )
          );

      }

    }


    /* VECTOR */

    else if(type==="vector"){

      const A =
        $("A").value
        .split(",")
        .map(Number);

      const B =
        $("B").value
        .split(",")
        .map(Number);


      const op =
        $("vop").value;


      if(op==="dot"){

        if(A.length!==B.length)
          throw Error(
            "Same dimensions required"
          );


        out =
          A.reduce(
            (sum,v,i)=>
              sum+v*B[i],
            0
          );

      }


      else if(op==="mag"){

        out =
          Math.hypot(...A);

      }


      else if(op==="cross"){

        if(
          A.length!==3 ||
          B.length!==3
        )
          throw Error(
            "3D vectors required"
          );


        out =
          [
            A[1]*B[2]-
            A[2]*B[1],

            A[2]*B[0]-
            A[0]*B[2],

            A[0]*B[1]-
            A[1]*B[0]
          ].map(format).join(", ");

      }


      else if(op==="angle"){

        const dot =
          A.reduce(
            (sum,v,i)=>
              sum+v*B[i],
            0
          );


        const denominator =
          Math.hypot(...A) *
          Math.hypot(...B);


        out =
          fromRad(
            Math.acos(
              dot/denominator
            )
          );

      }

    }


    /* COMPLEX */

    else if(type==="complex"){

      const ar =
        Number($("ar").value);

      const ai =
        Number($("ai").value);

      const br =
        Number($("br").value);

      const bi =
        Number($("bi").value);

      const op =
        $("cop").value;


      if(op==="add"){

        out =
          `${format(ar+br)} + ${format(ai+bi)}i`;

      }


      else if(op==="sub"){

        out =
          `${format(ar-br)} + ${format(ai-bi)}i`;

      }


      else if(op==="mul"){

        out =
          `${format(ar*br-ai*bi)} + `+
          `${format(ar*bi+ai*br)}i`;

      }


      else if(op==="div"){

        const d =
          br*br+bi*bi;


        if(d===0)
          throw Error(
            "Division by zero"
          );


        out =
          `${format(
            (ar*br+ai*bi)/d
          )} + `+
          `${format(
            (ai*br-ar*bi)/d
          )}i`;

      }


      else if(op==="abs"){

        out =
          Math.hypot(ar,ai);

      }

    }


    /* STATISTICS */

    else if(type==="statistics"){

      const values =
        $("data").value
        .split(",")
        .map(Number)
        .filter(Number.isFinite);


      if(!values.length)
        throw Error(
          "Enter valid data"
        );


      const sorted =
        values.slice()
        .sort((a,b)=>a-b);


      const n =
        sorted.length;


      const mean =
        sorted.reduce(
          (sum,v)=>sum+v,
          0
        )/n;


      const variance =
        sorted.reduce(
          (sum,v)=>
            sum+(v-mean)**2,
          0
        )/n;


      const sd =
        Math.sqrt(variance);


      const median =
        n%2
        ? sorted[(n-1)/2]
        : (
          sorted[n/2-1] +
          sorted[n/2]
        )/2;


      const op =
        $("sop").value;


      if(op==="mean")
        out=format(mean);

      else if(op==="var")
        out=format(variance);

      else if(op==="sd")
        out=format(sd);

      else if(op==="median")
        out=format(median);

      else
        out =
          `Mean: ${format(mean)}\n`+
          `Variance: ${format(variance)}\n`+
          `SD: ${format(sd)}\n`+
          `Median: ${format(median)}`;

    }


    /* UNIT CONVERTER */

    else if(type==="converter"){

      const units={

        mm:0.001,
        cm:0.01,
        m:1,
        km:1000,
        ft:0.3048,
        in:0.0254

      };


      const from =
        $("from").value;

      const to =
        $("to").value;

      const value =
        Number($("val").value);


      out =
        value *
        units[from] /
        units[to];

    }


    /* CONSTANTS */

    else if(type==="constants"){

      out =
`π = ${Math.PI}

e = ${Math.E}

g = 9.80665 m/s²

c = 299792458 m/s

G = 6.67430 × 10⁻¹¹ m³ kg⁻¹ s⁻²

R = 8.314462618 J mol⁻¹ K⁻¹`;

    }


    $("modalBody")
      .insertAdjacentHTML(
        "beforeend",
        `<div class="result" id="toolResult">${
          esc(
            typeof out==="number"
            ? format(out)
            : out
          )
        }</div>`
      );


  }catch(error){

    $("modalBody")
      .insertAdjacentHTML(
        "beforeend",
        `<div class="result">
        Error: ${esc(
          error.message ||
          "Invalid input"
        )}
        </div>`
      );

  }

}
