<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;

}

.app{
    max-width:1100px;

/* HEADER */
.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.brand{
    font-size:20px;
    font-weight:bold;

.badges{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.badge{
    padding:6px 10px;

    font-size:12px;
    color:#9ee7ff;
}

/* DISPLAY */
.display{
    background:#dce9e9;
    color:#111;
    border-radius:16px;
    min-height:145px;
    padding:14px;
    margin-bottom:10px;
    overflow:hidden;
}

.expression{
    width:100%;
    min-height:40px;

    outline:0;

.result{
    min-height:60px;
    text-align:right;
    font-size:30px;
    font-weight:bold;
    overflow-x:auto;
    white-space:nowrap;
}

/* TOOLBAR */
.toolbar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:8px;
}

.tool-btn{
    border:0;
    background:#303646;
    color:white;

    border-radius:10px;

}

.tool-btn.active{

}

.tool-btn.orange{

}

/* MAIN */
.main{
    display:grid;
    grid-template-columns:1.7fr 1fr;
    gap:10px;
}

/* KEYPAD */
.keypad{
    display:grid;
    grid-template-columns:repeat(6,1fr);

}

.key{

    border-radius:11px;

    color:#fff;

    font-weight:500;

.tool-btn:active{
    transform:scale(.96);
}

.key.function{
    background:#3b4050;
    font-size:15px;
}

.key.operator{
    background:#454b5a;
}

.key.equal{
    background:#19a463;
    font-size:23px;
}

.key.danger{
    background:#e86d4d;
    color:#111;
}

.key.memory{
    color:#f5d76e;
}

/* PANELS */
.side{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.panel{
    background:#171d2c;
    border:1px solid #293247;
    border-radius:14px;
    padding:12px;
}

.panel h3{
    margin:0 0 10px;
    font-size:16px;
}

.panel textarea,
.panel input,
.panel select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #39445b;
    background:#0e1422;
    color:white;
    outline:none;
    margin-bottom:8px;
}

.panel button{
    border:0;
    padding:9px 12px;
    border-radius:8px;
    background:#316cff;
    color:white;
    font-weight:bold;
}

.history{
    max-height:220px;
    overflow:auto;
}

.history-item{
    padding:8px;
    border-bottom:1px solid #2c3447;
    font-family:monospace;
    cursor:pointer;
}

.history-item:hover{
    background:#20283a;
}

/* ADVANCED */
.advanced-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.small-btn{
    width:100%;
    padding:9px;
    background:#252d40;
    border:1px solid #39445b;
    color:#fff;
    border-radius:8px;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:20px 0 10px;
    color:#8f9bb2;
    font-size:13px;
}

/* MOBILE */
@media(max-width:800px){
    .main{
        grid-template-columns:1fr;
    }

    .toolbar{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:500px){

    .app{
        padding:8px;
    }

    .brand{
        font-size:16px;
    }

    .display{
        min-height:125px;
    }

    .expression{
        font-size:17px;
    }

    .result{
        font-size:25px;
    }

    .keypad{
        gap:4px;
    }

    .key{
        min-height:48px;
        font-size:16px;
    }

    .key.function{
        font-size:12px;
    }

    .toolbar{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>

<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let angleMode = "DEG";
let secondMode = false;
let engineeringNotation = false;
let memory = 0;
let answer = 0;


/* =====================================================
   MATH FUNCTIONS
===================================================== */

function toRadians(x){

    if(angleMode === "DEG")
        return x * Math.PI / 180;

    if(angleMode === "GRAD")
        return x * Math.PI / 200;

    return x;
}


function fromRadians(x){

    if(angleMode === "DEG")
        return x * 180 / Math.PI;

    if(angleMode === "GRAD")
        return x * 200 / Math.PI;

    return x;
}


/* =====================================================
   CUSTOM SCOPE
===================================================== */

function createScope(){

    return {

        Ans: answer,

        pi: Math.PI,

        e: Math.E,

        sin: x => Math.sin(toRadians(x)),

        cos: x => Math.cos(toRadians(x)),

        tan: x => Math.tan(toRadians(x)),

        asin: x => fromRadians(Math.asin(x)),

        acos: x => fromRadians(Math.acos(x)),

        atan: x => fromRadians(Math.atan(x)),

        sinh: x => Math.sinh(x),

        cosh: x => Math.cosh(x),

        tanh: x => Math.tanh(x),

        ln: x => Math.log(x),

        log10: x => Math.log10(x),

        exp: x => Math.exp(x),

        nPr: function(n,r){

            return math.factorial(n) /
                math.factorial(n-r);

        },

        nCr: function(n,r){

            return math.factorial(n) /
                (math.factorial(r) *
                math.factorial(n-r));

        }

    };

}


/* =====================================================
   INSERT
===================================================== */

function insert(value){

    const input =
        document.getElementById("expression");

    const start =
        input.selectionStart;

    const end =
        input.selectionEnd;

    input.value =
        input.value.substring(0,start)
        + value
        + input.value.substring(end);

    input.focus();

    input.selectionStart =
        input.selectionEnd =
        start + value.length;

}


/* =====================================================
   CALCULATE
===================================================== */

function calculate(){

    const input =
        document.getElementById("expression");

    const expression =
        input.value.trim();

    if(!expression)
        return;

    try{

        let scope = createScope();

        let value =
            math.evaluate(expression,scope);

        answer = value;

        let formatted =
            formatResult(value);

        document.getElementById("result")
            .textContent = formatted;

        addHistory(expression,formatted);

    }catch(error){

        document.getElementById("result")
            .textContent = "Error";

        console.error(error);

    }

}


/* =====================================================
   FORMAT
===================================================== */

function formatResult(value){

    try{

        if(typeof value === "number"){

            if(!Number.isFinite(value))
                return String(value);

            if(Math.abs(value) < 1e-12)
                value = 0;

            if(engineeringNotation){

                return Number(value)
                    .toExponential(8);

            }

            return math.format(value,{
                precision:14
            });

        }

        return math.format(value,{
            precision:14
        });

    }catch(e){

        return String(value);

    }

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    document.getElementById("expression").value="";
    document.getElementById("result").textContent="0";

}


function clearEntry(){

    document.getElementById("expression").value="";
}


function backspace(){

    const input =
        document.getElementById("expression");

    const start =
        input.selectionStart;

    const end =
        input.selectionEnd;

    if(start !== end){

        input.value =
            input.value.substring(0,start)
            + input.value.substring(end);

        input.selectionStart =
            input.selectionEnd = start;

    }else if(start > 0){

        input.value =
            input.value.substring(0,start-1)
            + input.value.substring(end);

        input.selectionStart =
            input.selectionEnd = start-1;

    }

    input.focus();

}


/* =====================================================
   ANGLE MODE
===================================================== */

function setAngle(mode){

    angleMode = mode;

    document.getElementById("angleBadge")
        .textContent = mode;

    document
        .getElementById("degBtn")
        .classList.remove("active");

    document
        .getElementById("radBtn")
        .classList.remove("active");

    document
        .getElementById("gradBtn")
        .classList.remove("active");

    document
        .getElementById(
            mode.toLowerCase()+"Btn"
        )
        .classList.add("active");

}


/* =====================================================
   SECOND
===================================================== */

function toggleSecond(){

    secondMode = !secondMode;

    const btn =
        document.getElementById("secondBtn");

    btn.classList.toggle(
        "active",
        secondMode
    );

}


/* =====================================================
   ENGINEERING NOTATION
===================================================== */

function toggleNotation(){

    engineeringNotation =
        !engineeringNotation;

    calculate();

}


/* =====================================================
   MEMORY
===================================================== */

function currentValue(){

    try{

        return Number(
            math.evaluate(
                document.getElementById(
                    "expression"
                ).value,
                createScope()
            )
        );

    }catch(e){

        return answer;

    }

}


function memoryClear(){

    memory=0;

}


function memoryRecall(){

    insert(String(memory));

}


function memoryAdd(){

    memory += currentValue();

}


function memorySubtract(){

    memory -= currentValue();

}


function memoryStore(){

    memory = currentValue();

}


/* =====================================================
   HISTORY
===================================================== */

let historyData =
    JSON.parse(
        localStorage.getItem(
            "adiyogiScientificHistory"
        ) || "[]"
    );


function addHistory(expr,result){

    historyData.unshift({
        expr:expr,
        result:result
    });

    historyData =
        historyData.slice(0,50);

    localStorage.setItem(
        "adiyogiScientificHistory",
        JSON.stringify(historyData)
    );

    renderHistory();

}


function renderHistory(){

    const box =
        document.getElementById("history");

    if(historyData.length === 0){

        box.innerHTML =
            "No calculations yet.";

        return;

    }

    box.innerHTML =
        historyData.map(
            (item,index)=>`

            <div
            class="history-item"
            onclick="loadHistory(${index})">

            ${escapeHtml(item.expr)}
            =
            ${escapeHtml(item.result)}

            </div>

            `
        ).join("");

}


function loadHistory(index){

    document.getElementById(
        "expression"
    ).value =
        historyData[index].expr;

}


function clearHistory(){

    historyData=[];

    localStorage.removeItem(
        "adiyogiScientificHistory"
    );

    renderHistory();

}


function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


/* =====================================================
   DERIVATIVE
===================================================== */

function openDerivative(){

    const expression =
        prompt(
            "Enter function in x\nExample: x^3 + 2*x"
        );

    if(!expression)
        return;

    try{

        const derivative =
            math.derivative(
                expression,
                "x"
            ).toString();

        const x =
            Number(
                prompt(
                    "Enter x value"
                )
            );

        const value =
            math.evaluate(
                derivative,
                {x:x}
            );

        alert(
            "Derivative:\n"
            + derivative
            + "\n\nAt x = "
            + x
            + "\nResult = "
            + formatResult(value)
        );

    }catch(e){

        alert("Unable to calculate derivative.");

    }

}


/* =====================================================
   NUMERICAL INTEGRATION
===================================================== */

function openIntegral(){

    const expression =
        prompt(
            "Enter function in x\nExample: x^2"
        );

    if(!expression)
        return;

    const a =
        Number(prompt("Lower limit"));

    const b =
        Number(prompt("Upper limit"));

    if(!Number.isFinite(a) ||
       !Number.isFinite(b))
        return;

    try{

        const n = 10000;

        const h =
            (b-a)/n;

        let sum = 0;

        for(let i=0;i<=n;i++){

            const x =
                a+i*h;

            const y =
                math.evaluate(
                    expression,
                    {x:x}
                );

            if(i===0 || i===n)
                sum += y;

            else if(i%2===0)
                sum += 2*y;

            else
                sum += 4*y;

        }

        const result =
            sum*h/3;

        alert(
            "∫ " + expression
            + " dx\n\n"
            + "Limits: "
            + a + " to " + b
            + "\n\nResult = "
            + formatResult(result)
        );

    }catch(e){

        alert(
            "Integration error."
        );

    }

}


/* =====================================================
   LIMIT
===================================================== */

function openLimit(){

    const expression =
        prompt(
            "Enter function in x\nExample: sin(x)/x"
        );

    if(!expression)
        return;

    const point =
        Number(
            prompt(
                "x approaches:"
            )
        );

    try{

        const h=1e-7;

        const left =
            math.evaluate(
                expression,
                {x:point-h}
            );

        const right =
            math.evaluate(
                expression,
                {x:point+h}
            );

        const result =
            (left+right)/2;

        alert(
            "Approximate Limit = "
            + formatResult(result)
        );

    }catch(e){

        alert("Limit could not be evaluated.");

    }

}


/* =====================================================
   EQUATION SOLVER
===================================================== */

function openEquation(){

    const expression =
        prompt(
            "Equation in x.\nExample: x^2-5*x+6"
        );

    if(!expression)
        return;

    const guess =
        Number(
            prompt(
                "Initial guess",
                "1"
            )
        );

    try{

        let x=guess;

        for(let i=0;i<100;i++){

            const f =
                math.evaluate(
                    expression,
                    {x:x}
                );

            const h=1e-6;

            const fp =
                (
                    math.evaluate(
                        expression,
                        {x:x+h}
                    )
                    -
                    math.evaluate(
                        expression,
                        {x:x-h}
                    )
                )/(2*h);

            if(Math.abs(fp)<1e-14)
                break;

            const next =
                x-f/fp;

            if(Math.abs(next-x)<1e-12){

                x=next;
                break;

            }

            x=next;

        }

        alert(
            "Equation:\n"
            + expression
            + " = 0\n\n"
            + "x ≈ "
            + formatResult(x)
        );

    }catch(e){

        alert(
            "Equation could not be solved."
        );

    }

}


/* =====================================================
   MATRIX
===================================================== */

function openMatrix(){

    const expression =
        prompt(
`Enter matrix expression.

Example:
det([[1,2],[3,4]])

Inverse:
inv([[1,2],[3,4]])

Multiply:
[[1,2],[3,4]] * [[5,6],[7,8]]

Transpose:
transpose([[1,2],[3,4]])`
        );

    if(!expression)
        return;

    try{

        const value =
            math.evaluate(
                expression,
                createScope()
            );

        alert(
            math.format(
                value,
