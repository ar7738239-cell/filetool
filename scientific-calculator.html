<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Adiyogi Scientific Calculator</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080d19;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overscroll-behavior:none;
}

button{
    border:0;
    outline:0;
    font:inherit;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    cursor:pointer;
    touch-action:manipulation;
}


/* =====================================================
   APP
===================================================== */

.app{

    width:100%;
    max-width:900px;

    height:100dvh;

    margin:auto;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:#080d19;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:46px;
    min-height:46px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:5px 10px;

    background:#0d1322;

    border-bottom:1px solid #202a40;
}

.brand{

    font-size:18px;
    font-weight:700;

    white-space:nowrap;
}

.header-right{

    display:flex;
    gap:4px;
}

.badge{

    background:#192842;

    color:#9edbff;

    border-radius:10px;

    padding:7px 8px;

    font-size:10px;
}


/* =====================================================
   DISPLAY AREA
===================================================== */

.display-area{

    flex:none;

    padding:4px 10px;

    background:#080d19;
}

.mode-row{

    height:20px;

    display:flex;
    align-items:center;

    gap:18px;

    padding-left:5px;

    font-size:11px;

    font-weight:700;

    color:#aab4c8;
}

.mode-row .active{

    color:#65d7ff;
}


/* =====================================================
   MAIN CALCULATOR DISPLAY
===================================================== */

.display{

    height:82px;

    background:#dceaea;

    color:#111820;

    border-radius:14px;

    padding:5px 10px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    overflow:hidden;

    box-shadow:
    inset 0 0 0 1px #c2d4d4;
}


/*
   Expression is now a real visual area.

   Fraction is rendered INSIDE this area.
*/

.expression{

    height:50px;

    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:3px;

    font-size:18px;

    line-height:24px;

    white-space:nowrap;

    overflow-x:auto;

    overflow-y:hidden;

    padding:0 2px;

    scrollbar-width:none;
}

.expression::-webkit-scrollbar{
    display:none;
}


.expr-text{

    display:inline-block;
}


/* Cursor */

.expr-cursor{

    display:inline-block;

    width:2px;

    height:26px;

    background:#111820;

    vertical-align:middle;

    animation:
    blink 1s steps(2,start) infinite;
}

@keyframes blink{

    50%{
        opacity:0;
    }

}


/* =====================================================
   INLINE FRACTION
===================================================== */

.inline-frac{

    display:inline-flex;

    flex-direction:column;

    align-items:stretch;

    justify-content:center;

    vertical-align:middle;

    min-width:34px;

    max-width:170px;

    line-height:18px;

    font-size:17px;

    margin:0 2px;
}

.frac-num,
.frac-den{

    min-height:18px;

    padding:0 5px;

    text-align:center;

    white-space:nowrap;

    overflow:hidden;
}

.frac-line{

    height:2px;

    background:#111820;

    width:100%;

    min-width:28px;
}


/*
   Active fraction gets a small purple
   outline so user knows where typing goes.
*/

.inline-frac.active{

    outline:2px solid #7545f5;

    border-radius:4px;
}

.inline-frac.active .frac-line{

    background:#7545f5;
}

.frac-placeholder{

    opacity:.45;
}


/* Answer */

.answer{

    height:30px;

    font-size:25px;

    line-height:30px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-align:right;
}


/* =====================================================
   CONTROL ROW
===================================================== */

.controls{

    flex:none;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    gap:4px;

    padding:4px 10px;
}

.ctrl{

    height:31px;

    border-radius:9px;

    background:#293249;

    color:white;

    font-size:11px;

    font-weight:700;
}

.ctrl.active{

    background:#7545f5;
}

.ctrl:active{

    transform:scale(.95);

    background:#46536e;
}


/* =====================================================
   SCROLL AREA
===================================================== */

.scroll-area{

    flex:1;

    min-height:0;

    overflow-y:auto;

    overflow-x:hidden;

    padding:2px 8px 20px;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior-y:contain;

    touch-action:pan-y;

    scrollbar-width:none;
}

.scroll-area::-webkit-scrollbar{

    display:none;
}


/* =====================================================
   KEYPAD
===================================================== */

.keypad{

    display:grid;

    grid-template-columns:
    repeat(6,1fr);

    gap:4px;
}

.key{

    height:41px;

    border-radius:10px;

    background:#252e42;

    color:white;

    font-size:14px;

    font-weight:500;
}

.key:active{

    transform:scale(.95);

    background:#46536e;
}

.func{

    background:#30394e;
}

.operator{

    background:#454e62;
}

.orange{

    background:#f27d4d;

    color:#111;
}

.green{

    background:#18a968;
}

.yellow{

    color:#ffe85a;
}

.purple{

    color:#d7b0ff;
}


/* =====================================================
   ENGINEERING TOOLS
===================================================== */

.tools{

    margin:7px 5px 0;

    padding:9px;

    background:#11182a;

    border:1px solid #29354d;

    border-radius:14px;
}

.tools-title{

    font-size:15px;

    font-weight:700;

    margin-bottom:7px;
}

.tools-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:5px;
}

.tool-btn{

    height:39px;

    border-radius:9px;

    background:#273149;

    color:white;

    border:1px solid #3a4862;

    font-size:12px;

    font-weight:700;
}

.tool-btn:active{

    transform:scale(.97);

    background:#465570;
}


/* =====================================================
   MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    z-index:9999;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:rgba(0,0,0,.75);
}

.modal.show{

    display:flex;
}

.modal-box{

    width:min(500px,100%);

    max-height:90dvh;

    overflow:auto;

    background:#111827;

    border:1px solid #35425c;

    border-radius:18px;

    padding:16px;
}

.modal-title{

    font-size:20px;

    font-weight:700;

    margin-bottom:12px;
}

.modal input,
.modal select,
.modal textarea{

    width:100%;

    padding:11px;

    margin:5px 0;

    background:#202a3d;

    color:white;

    border:1px solid #3b4861;

    border-radius:9px;

    font-size:15px;
}

.modal textarea{

    min-height:90px;
}

.modal-buttons{

    display:flex;

    gap:7px;

    margin-top:10px;
}

.modal-buttons button{

    flex:1;

    height:42px;

    border-radius:9px;

    background:#303b53;

    color:white;

    font-weight:700;
}

.modal-buttons .primary{

    background:#7545f5;
}

.result{

    margin-top:10px;

    padding:12px;

    border-radius:9px;

    background:#080f20;

    border:1px solid #293650;

    white-space:pre-wrap;

    word-break:break-word;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    }

    }

/* =====================================================

    }

    .ctrl{

        height:28px;

        font-size:9px;
    }

    .inline-frac{

        font-size:14px;
    }

}

</style>

<script>


/* =====================================================
   CALCULATOR STATE
===================================================== */

let tokens = [];

let cursor = 0;

let answer = 0;

let angleMode = "DEG";

let memory = 0;

let second = false;


/*
   This is the important part.

   Fraction is stored as:

   {
       type:"frac",
       num:"",
       den:""
   }

   It is rendered directly inside the
   calculator display.
*/

let activeFraction = null;

let fractionPart = "num";

const history = [];


/* =====================================================
   ELEMENTS
===================================================== */

const $ =
    id =>
    document.getElementById(id);

const expressionDisplay =
    $("expression");

const answerDisplay =
    $("answer");

const angleBadge =
    $("angleBadge");

const modal =
    $("modal");

const modalTitle =
    $("modalTitle");

const modalContent =
    $("modalContent");

const modalResult =
    $("modalResult");

const modalCalculate =
    $("modalCalculate");


/* =====================================================
   FORMAT
===================================================== */

function formatNumber(n){

    if(typeof n !== "number")
        return String(n);

    if(!Number.isFinite(n))
        return "Math Error";

    if(Math.abs(n)<1e-14)
        n=0;

    return Number(
        n.toPrecision(12)
    ).toString();
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(s){

    return String(s)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;");
}


/* =====================================================
   RENDER MAIN DISPLAY
===================================================== */

function render(){

    let html="";


    tokens.forEach(
        (t,i)=>{

            /*
               NORMAL TEXT
            */

            if(t.type==="text"){

                html+=
                    '<span class="expr-text">'+
                    escapeHtml(t.value)+
                    '</span>';

            }


            /*
               INLINE FRACTION
            */

            else{

                const active =
                    activeFraction===t
                    ? " active"
                    : "";

                html+=

                    '<span class="inline-frac'+
                    active+
                    '">' +

                    '<span class="frac-num">' +

                    (
                        t.num
                        ?
                        escapeHtml(t.num)
                        :
                        '<span class="frac-placeholder">?</span>'
                    ) +

                    '</span>' +

                    '<span class="frac-line"></span>' +

                    '<span class="frac-den">' +

                    (
                        t.den
                        ?
                        escapeHtml(t.den)
                        :
                        '<span class="frac-placeholder">?</span>'
                    ) +

                    '</span>' +

                    '</span>';
            }


            /*
               Cursor
            */

            if(
                i===cursor-1 &&
                !activeFraction
            ){

                html+=
                    '<span class="expr-cursor"></span>';
            }

        }
    );


    if(
        cursor===tokens.length &&
        !activeFraction
    ){

        html+=
            '<span class="expr-cursor"></span>';
    }


    expressionDisplay.innerHTML =
        html;

    answerDisplay.textContent =
        formatNumber(answer);


    /*
       Keep active fraction visible
    */

    if(activeFraction){

        const el =
            expressionDisplay.querySelector(
                ".inline-frac.active"
            );

        if(el){

            el.scrollIntoView({
                block:"nearest",
                inline:"nearest"
            });
        }
    }

}


/* =====================================================
   ANGLE
===================================================== */

function setAngle(mode){

    angleMode=mode;

    angleBadge.textContent=mode;

    document
        .querySelectorAll(
            '[data-action="angle"]'
        )
        .forEach(
            b=>{

                b.classList.toggle(
                    "active",
                    b.dataset.value===mode
                );

            }
        );
}


function toRad(x){

    if(angleMode==="DEG")
        return x*Math.PI/180;

    if(angleMode==="GRAD")
        return x*Math.PI/200;

    return x;
}


function fromRad(x){

    if(angleMode==="DEG")
        return x*180/Math.PI;

    if(angleMode==="GRAD")
        return x*200/Math.PI;

    return x;
}


/* =====================================================
   NORMAL INSERT
===================================================== */

function insert(value){

    /*
       If fraction is active,
       typing goes directly into
       numerator/denominator.
    */

    if(activeFraction){

        if(fractionPart==="num"){

            activeFraction.num +=
                value;

        }else{

            activeFraction.den +=
                value;
        }

        render();

        return;
    }


    /*
       Normal expression
    */

    tokens.splice(
        cursor,
        0,
        {
            type:"text",
            value:value
        }
    );

    cursor++;

    render();
}


/* =====================================================
   INSERT FRACTION
===================================================== */

function insertFraction(){

    const fraction = {

        type:"frac",

        num:"",

        den:""

    };


    /*
       Insert fraction exactly
       at current cursor position.
    */

    tokens.splice(
        cursor,
        0,
        fraction
    );


    cursor++;


    /*
       Start in numerator.
    */

    activeFraction =
        fraction;

    fractionPart =
        "num";


    render();
}


/* =====================================================
   EXIT FRACTION
===================================================== */

function exitFraction(){

    activeFraction=null;

    fractionPart="num";

    render();
}


/* =====================================================
   BACKSPACE
===================================================== */

function backspace(){

    /*
       Inside fraction
    */

    if(activeFraction){

        let text =
            fractionPart==="num"
            ?
            activeFraction.num
            :
            activeFraction.den;


        if(text.length){

            if(fractionPart==="num"){

                activeFraction.num =
                    text.slice(0,-1);

            }else{

                activeFraction.den =
                    text.slice(0,-1);
            }

            render();

            return;
        }


        /*
           Empty denominator:
           go back to numerator.
        */

        if(
            fractionPart==="den"
        ){

            fractionPart="num";

            render();

            return;
        }


        /*
           Empty numerator:
           delete complete fraction.
        */

        const index =
            tokens.indexOf(
                activeFraction
            );

        if(index>=0){

            tokens.splice(
                index,
                1
            );

            cursor=index;
        }

        activeFraction=null;

        render();

        return;
    }


    /*
       Normal expression
    */

    if(cursor<=0)
        return;


    const t =
        tokens[cursor-1];


    if(
        t.type==="text" &&
        t.value.length>1
    ){

        t.value =
            t.value.slice(
                0,
                -1
            );

    }else{

        tokens.splice(
            cursor-1,
            1
        );

        cursor--;
    }


    render();
}


/* =====================================================
   LEFT
===================================================== */

function moveLeft(){

    if(activeFraction){

        exitFraction();

        if(cursor>0)
            cursor--;

        render();

        return;
    }


    if(cursor>0)
        cursor--;

    render();
}


/* =====================================================
   RIGHT
===================================================== */

function moveRight(){

    /*
       Right arrow exits fraction.

       This is how user finishes
       numerator/denominator editing.
    */

    if(activeFraction){

        exitFraction();

        return;
    }


    if(cursor<tokens.length)
        cursor++;

    render();
}


/* =====================================================
   UP
===================================================== */

function moveUp(){

    if(activeFraction){

        fractionPart="num";

        render();

        return;
    }


    if(
        cursor>0 &&
        tokens[cursor-1] &&
        tokens[cursor-1].type==="frac"
    ){

        activeFraction =
            tokens[cursor-1];

        fractionPart="num";

        render();
    }
}


/* =====================================================
   DOWN
===================================================== */

function moveDown(){

    if(activeFraction){

        fractionPart="den";

        render();

        return;
    }


    if(
        cursor>0 &&
        tokens[cursor-1] &&
        tokens[cursor-1].type==="frac"
    ){

        activeFraction =
            tokens[cursor-1];

        fractionPart="den";

        render();
    }
}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    tokens=[];

    cursor=0;

    answer=0;

    activeFraction=null;

    fractionPart="num";

    render();
}


/* =====================================================
   CONVERT TOKENS TO MATH
===================================================== */

function tokenToString(t){

    if(t.type==="text")
        return t.value;


    /*
       Fraction becomes normal
       mathematical division for calculation.
    */

    return (
        "("+
        t.num+
        "/" +
        t.den+
        ")"
    );
}


function expressionString(){

    return tokens
        .map(tokenToString)
        .join("");
}


/* =====================================================
   FACTORIAL
===================================================== */

function factorial(n){

    if(
        n<0 ||
        !Number.isInteger(n) ||
        n>170
    ){

        throw Error(
            "Invalid factorial"
        );
    }


    let r=1;

    for(
        let i=2;
        i<=n;
        i++
    ){

        r*=i;
    }

    return r;
}


/* =====================================================
   GCD
===================================================== */

function gcd(a,b){

    a=Math.abs(
        Math.trunc(a)
    );

    b=Math.abs(
        Math.trunc(b)
    );


    while(b){

        [a,b]=[
            b,
            a%b
        ];
    }


    return a;
}


/* =====================================================
   LCM
===================================================== */

function lcm(a,b){

    if(
        a===0 ||
        b===0
    )
        return 0;


    return Math.abs(
        a*b
    )/gcd(a,b);
}


/* =====================================================
   BASIC EVALUATOR
===================================================== */

function evalBasic(s){

    return Function(
        "answer",

        '"use strict";return ('+
        s+
        ')'
    )(answer);
}


/* =====================================================
   SCIENTIFIC EVALUATOR
===================================================== */

function evaluate(expr){

    let x=expr;


    x=x
        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-")
        .replaceAll("π","Math.PI");


    x=x.replace(
        /\bAns\b/g,
        "answer"
    );


    x=x.replace(
        /\be\b/g,
        "Math.E"
    );


    /*
       Functions
    */

    x=x
        .replace(/sin\(/g,"SIN(")
        .replace(/cos\(/g,"COS(")
        .replace(/tan\(/g,"TAN(")

        .replace(/asin\(/g,"ASIN(")
        .replace(/acos\(/g,"ACOS(")
        .replace(/atan\(/g,"ATAN(")

        .replace(/sinh\(/g,"Math.sinh(")
        .replace(/cosh\(/g,"Math.cosh(")
        .replace(/tanh\(/g,"Math.tanh(")

        .replace(/log\(/g,"Math.log10(")
        .replace(/ln\(/g,"Math.log(")

        .replace(/sqrt\(/g,"Math.sqrt(")
        .replace(/cbrt\(/g,"Math.cbrt(")

        .replace(/abs\(/g,"Math.abs(")

        .replace(/floor\(/g,"Math.floor(")
        .replace(/ceil\(/g,"Math.ceil(")
        .replace(/round\(/g,"Math.round(")

        .replace(/exp\(/g,"Math.exp(")

        .replace(/inv\(/g,"INV(")

        .replace(/fact\(/g,"FACT(")

        .replace(/npr\(/g,"NPR(")
        .replace(/ncr\(/g,"NCR(")

        .replace(/gcd\(/g,"GCD(")
        .replace(/lcm\(/g,"LCM(")

        .replace(/mod\(/g,"MOD(")

        .replace(/logb\(/g,"LOGB(")

        .replace(
            /sign\(/g,
            "Math.sign("
        );


    /*
       Power
    */

    x=x.replace(
        /\^/g,
        "**"
    );


    /*
       Trigonometry
    */

    x=x.replace(
        /SIN\(([^()]*)\)/g,

        (_,v)=>
            "Math.sin("+
            toRad(
                Number(
                    evalBasic(v)
                )
            )+
            ")"
    );


    x=x.replace(
        /COS\(([^()]*)\)/g,

        (_,v)=>
            "Math.cos("+
            toRad(
                Number(
                    evalBasic(v)
                )
            )+
            ")"
    );


    x=x.replace(
        /TAN\(([^()]*)\)/g,

        (_,v)=>
            "Math.tan("+
            toRad(
                Number(
                    evalBasic(v)
                )
            )+
            ")"
    );


    /*
       Inverse trig
    */

    x=x.replace(
        /ASIN\(([^()]*)\)/g,

        (_,v)=>
            String(
                fromRad(
                    Math.asin(
                        Number(
                            evalBasic(v)
                        )
                    )
                )
            )
    );


    x=x.replace(
        /ACOS\(([^()]*)\)/g,

        (_,v)=>
            String(
                fromRad(
                    Math.acos(
                        Number(
                            evalBasic(v)
                        )
                    )
                )
            )
    );


    x=x.replace(
        /ATAN\(([^()]*)\)/g,

        (_,v)=>
            String(
                fromRad(
                    Math.atan(
                        Number(
                            evalBasic(v)
                        )
                    )
                )
            )
    );


    /*
       Factorial
    */

    x=x.replace(
        /FACT\(([^()]*)\)/g,

        (_,v)=>
            String(
                factorial(
                    Number(
                        evalBasic(v)
                    )
                )
            )
    );


    /*
       Inverse
    */

    x=x.replace(
        /INV\(([^()]*)\)/g,

        (_,v)=>
            String(
                1/
                Number(
                    evalBasic(v)
                )
            )
    );


    /*
       nPr
    */

    x=x.replace(
        /NPR\(([^,()]+),([^()]+)\)/g,

        (_,a,b)=>
            String(
                factorial(
                    Number(
                        evalBasic(a)
                    )
                )
                /
                factorial(
                    Number(
                        evalBasic(a)
                    )
                    -
                    Number(
                        evalBasic(b)
                    )
                )
            )
    );


    /*
       nCr
    */

    x=x.replace(
        /NCR\(([^,()]+),([^()]+)\)/g,

        (_,a,b)=>
            String(
                factorial(
                    Number(
                        evalBasic(a)
                    )
                )
                /
                (
                    factorial(
                        Number(
                            evalBasic(b)
                        )
                    )
                    *
                    factorial(
                        Number(
                            evalBasic(a)
                        )
                        -
                        Number(
                            evalBasic(b)
                        )
                    )
                )
            )
    );


    /*
       GCD
    */

    x=x.replace(
        /GCD\(([^,()]+),([^()]+)\)/g,

        (_,a,b)=>
            String(
                gcd(
                    Number(
                        evalBasic(a)
                    ),
                    Number(
                        evalBasic(b)
                    )
                )
            )
    );


    /*
       LCM
    */

    x=x.replace(
        /LCM\(([^,()]+),([^()]+)\)/g,

        (_,a,b)=>
            String(
                lcm(
                    Number(
                        evalBasic(a)
                    ),
                    Number(
                        evalBasic(b)
                    )
                )
            )
    );


    /*
       MOD
    */

    x=x.replace(
        /MOD\(([^,()]+),([^()]+)\)/g,

        (_,a,b)=>
            String(
                Number(
                    evalBasic(a)
                )
                %
                Number(
                    evalBasic(b)
                )
            )
    );


    /*
       LOG BASE
    */

    x=x.replace(
        /LOGB\(([^,()]+),([^()]+)\)/g,

        (_,a,b)=>
            String(
                Math.log(
                    Number(
                        evalBasic(a)
                    )
                )
                /
                Math.log(
                    Number(
                        evalBasic(b)
                    )
                )
            )
    );


    /*
       Security
    */

    if(
        /[;{}\[\]'"`<>]|
        window|
        document|
        alert|
        function|
        constructor|
        prototype/i
        .test(x)
    ){

        throw Error(
            "Invalid expression"
        );
    }


    /*
       Final calculation
    */

    const result =
        Function(
            "answer",

            '"use strict";return ('+
            x+
            ')'
        )(answer);


    if(
        typeof result!=="number" ||
        !Number.isFinite(result)
    ){

        throw Error(
            "Math Error"
        );
    }


    return result;
}


/* =====================================================
   CALCULATE
===================================================== */

function calculate(){

    if(!tokens.length)
        return;


    try{

        const expr =
            expressionString();


        const result =
            evaluate(expr);


        answer=result;


        history.unshift({

            expression:expr,

            answer:result

        });


        if(history.length>50)
            history.pop();


        /*
           IMPORTANT:

           We do NOT hide the expression.

           Therefore pressing =
           will never make the upper
           display disappear.
        */

        render();

    }catch(error){

        answerDisplay.textContent =
            "Error";

        console.error(error);
    }
}

function memoryStore(){

        memory=
            evaluate(
                expressionString()
            );

    }catch{}
}


function memoryAdd(){

    try{

        memory+=
            evaluate(
                expressionString()
            );

    }catch{}
}


function memorySub(){

    try{

        memory-=
            evaluate(
                expressionString()
            );

    }catch{}
}

function openIntegral(){

    openModal(

        "Numerical Integration",

        `
        <input
        id="intExpr"
        placeholder="Example: x*x">

        <input
        id="intA"
        inputmode="decimal"
        placeholder="Lower limit">

        <input
        id="intB"
        inputmode="decimal"
        placeholder="Upper limit">
        `,

        function(){

            try{

                const f =
                    $("intExpr").value;

                const a =
                    Number(
                        $("intA").value
                    );

                const b =
                    Number(
                        $("intB").value
                    );

                const n=1000;

                const h =
                    (b-a)/n;

                const fn =
                    Function(
                        "x",
                        "return ("+
                        f+
                        ")"
                    );

                let sum=0;


                for(
                    let i=0;
                    i<=n;
                    i++
                ){

                    const y =
                        fn(
                            a+i*h
                        );


                    if(
                        i===0 ||
                        i===n
                    ){

                        sum+=y;

                    }else if(
                        i%2===0
                    ){

                        sum+=2*y;

                    }else{

                        sum+=4*y;
                    }
                }


                showResult(
                    "∫ = "+
                    formatNumber(
                        sum*h/3
                    )
                );

            }catch{

                showResult(
                    "Integration Error"
                );
            }
        }
    );
}

        placeholder="Initial guess">
        `,

        function(){

            try{

                const f =
                    $("eq").value;

                let x =
                    Number(
                        $("guess").value
                    );

                const fn =
                    Function(
                        "x",
                        "return ("+
                        f+
                        ")"
                    );


                for(
                    let i=0;
                    i<100;
                    i++
                ){

                    const h=1e-6;

                    const fx =
                        fn(x);

                    const d =
                        (
                            fn(x+h)-
                            fn(x-h)
                        )/
                        (2*h);


                    if(
                        Math.abs(d)
                        <1e-14
                    )
                        break;


                    const next =
                        x-
                        fx/d;


                    if(
                        Math.abs(
                            next-x
                        )
                        <1e-12
                    ){

                        x=next;

                        break;
                    }


                    x=next;
                }


                showResult(
                    "x = "+
                    formatNumber(x)
                );

            }catch{

                showResult(
                    "Could not solve equation."
                );
            }
        }
    );
}


/* =====================================================
   MATRIX
===================================================== */

function parseMatrix(text){

    const a =
        text
        .trim()
        .split(/\n+/)
        .map(
            row=>
                row
                .trim()
                .split(/[\s,]+/)
                .map(Number)
        );


    if(
        !a.length ||
        a.some(
            row=>
                !row.length ||
                row.some(
                    v=>!Number.isFinite(v)
                ) ||
                row.length!==a[0].length
        )
    ){

        throw Error();
    }


    return a;
}


function determinant(a){

    if(
        a.length===2 &&
        a[0].length===2
    ){

        return
            a[0][0]*a[1][1]
            -
            a[0][1]*a[1][0];
    }


    if(
        a.length===3 &&
        a[0].length===3
    ){

        return

            a[0][0]*
            (
                a[1][1]*a[2][2]
                -
                a[1][2]*a[2][1]
            )

            -

            a[0][1]*
            (
                a[1][0]*a[2][2]
                -
                a[1][2]*a[2][0]
            )

            +

            a[0][2]*
            (
                a[1][0]*a[2][1]
                -
                a[1][1]*a[2][0]
            );
    }


    throw Error();
}


function matrixText(a){

    return a
        .map(
            r=>
                r
                .map(formatNumber)
                .join("\t")
        )
        .join("\n");
}


function openMatrix(){

    openModal(

        "Matrix Calculator",

        `
        <select id="matrixOp">

            <option value="det">
                Determinant
            </option>

            <option value="inverse">
                Inverse
            </option>

            <option value="add">
                A + B
            </option>

            <option value="mul">
                A × B
            </option>

        </select>

        <textarea
        id="matrixA"
        placeholder="A
1 2
3 4"></textarea>

        <textarea
        id="matrixB"
        placeholder="B
5 6
7 8"></textarea>
        `,

        function(){

            try{

                const op =
                    $("matrixOp").value;

                const A =
                    parseMatrix(
                        $("matrixA").value
                    );


                if(op==="det"){

                    showResult(
                        "det(A) = "+
                        formatNumber(
                            determinant(A)
                        )
                    );

                    return;
                }


                if(op==="inverse"){

                    if(
                        A.length!==2 ||
                        A[0].length!==2
                    )
                        throw Error();


                    const d =
                        determinant(A);


                    if(!d)
                        throw Error();


                    showResult(

                        matrixText([

                            [
                                A[1][1]/d,
                                -A[0][1]/d
                            ],

                            [
                                -A[1][0]/d,
                                A[0][0]/d
                            ]

                        ])
                    );

                    return;
                }


                const B =
                    parseMatrix(
                        $("matrixB").value
                    );


                if(op==="add"){

                    if(
                        A.length!==B.length ||
                        A[0].length!==B[0].length
                    )
                        throw Error();


                    showResult(

                        matrixText(
                            A.map(
                                (r,i)=>
                                    r.map(
                                        (v,j)=>
                                            v+B[i][j]
                                    )
                            )
                        )
                    );

                    return;
                }


                if(
                    A[0].length!==B.length
                )
                    throw Error();


                showResult(

                    matrixText(

                        A.map(
                            r=>
                                B[0].map(
                                    (_,j)=>
                                        r.reduce(
                                            (s,v,k)=>
                                                s+
                                                v*
                                                B[k][j],
                                            0
                                        )
                                )
                        )
                    )
                );

            }catch{

                showResult(
                    "Matrix Error"
                );
            }
        }
    );
}


/* =====================================================

function openVector(){

                        v=>!Number.isFinite(v)
                    )
                )
                    throw Error();


                if(op==="dot"){

                    showResult(

                        "A · B = "+
                        formatNumber(

                            A.reduce(
                                (s,v,i)=>
                                    s+
                                    v*B[i],
                                0
                            )
                        )
                    );

                    return;
                }


                if(op==="cross"){

                    if(
                        A.length!==3
                    )
                        throw Error();


                    const C=[

                        A[1]*B[2]
                        -
                        A[2]*B[1],

                        A[2]*B[0]
                        -
                        A[0]*B[2],

                        A[0]*B[1]
                        -
                        A[1]*B[0]

                    ];


                    showResult(
                        "["+
                        C
                        .map(formatNumber)
                        .join(", ")+
                        "]"
                    );

                    return;
                }


                const dot =
                    A.reduce(
                        (s,v,i)=>
                            s+
                            v*B[i],
                        0
                    );


                const ma =
                    Math.hypot(...A);

                const mb =
                    Math.hypot(...B);


                const ratio =
                    Math.max(
                        -1,
                        Math.min(
                            1,
                            dot/(ma*mb)
                        )
                    );


                showResult(

                    "Angle = "+
                    formatNumber(
                        fromRad(
                            Math.acos(
                                ratio
                            )
                        )
                    )+
                    " "+
                    angleMode
                );

            }catch{

                showResult(
                    "Vector Error"
                );
            }
        }
    );
}

/* =====================================================
   STATISTICS
===================================================== */

function openStats(){

    openModal(

        "Statistics",

        `
        <textarea
        id="stats"
        placeholder="10,20,30,40,50"></textarea>
        `,

        function(){

            const d =
                $("stats").value
                .split(/[\s,]+/)
                .map(Number)
                .filter(
                    Number.isFinite
                );


            if(!d.length){

                showResult(
                    "No data."
                );

                return;
            }


            const sum =
                d.reduce(
                    (a,b)=>a+b,
                    0
                );


            const mean =
                sum/d.length;


            const variance =
                d.reduce(
                    (s,x)=>
                        s+
                        (x-mean)**2,
                    0
                )
                /
                d.length;


            d.sort(
                (a,b)=>a-b
            );


            const median =
                d.length%2
                ?
                d[
                    (d.length-1)/2
                ]
                :
                (
                    d[d.length/2-1]
                    +
                    d[d.length/2]
                )/2;


            showResult(

                "n = "+
                d.length+

                "\nSum = "+
                formatNumber(sum)+

                "\nMean = "+
                formatNumber(mean)+

                "\nMedian = "+
                formatNumber(median)+

                "\nVariance = "+
                formatNumber(variance)+

                "\nStandard Deviation = "+
                formatNumber(
                    Math.sqrt(
                        variance
                    )
                )
            );
        }
    );
}

   UNIT CONVERTER
===================================================== */

function openConverter(){

    openModal(

        "Length Converter",

        `
        <input
        id="cv"
        inputmode="decimal"
        placeholder="Value">

        <select id="cf">

            <option>m</option>
            <option>km</option>
            <option>cm</option>
            <option>mm</option>

        </select>

        <select id="ct">

            <option>m</option>
            <option>km</option>
            <option>cm</option>
            <option>mm</option>

        </select>
        `,

        function(){

            const v =
                Number(
                    $("cv").value
                );

            const f =
                $("cf").value;

            const t =
                $("ct").value;


            const k={

                m:1,
                km:1000,
                cm:.01,
                mm:.001

            };


            if(
                !Number.isFinite(v)
            ){

                showResult(
                    "Enter a valid value."
                );

                return;
            }


            showResult(

                formatNumber(v)+
                " "+
                f+
                " = "+
                formatNumber(
                    v*k[f]/k[t]
                )+
                " "+
                t
            );
        }
    );
}

/* =====================================================
   BUTTON EVENT SYSTEM
===================================================== */

document.addEventListener(
    "click",

    function(event){

        const button =
            event.target.closest(
                "button"
            );


        if(!button)
            return;


        /*
           Normal insert
        */

        if(
            button.dataset.insert
            !==undefined
        ){

            insert(
                button.dataset.insert
            );

            return;
        }


        const action =
            button.dataset.action;


        /*
           Angle
        */

        if(
            action==="angle"
        ){

            setAngle(
                button.dataset.value
            );

            return;
        }


        /*
           Cursor
        */

        if(action==="left"){

            moveLeft();

            return;
        }


        if(action==="right"){

            moveRight();

            return;
        }


        if(action==="up"){

            moveUp();

            return;
        }


        if(action==="down"){

            moveDown();

            return;
        }


        /*
           2nd
        */

        if(action==="second"){

            second=!second;

            button.classList.toggle(
                "active",
                second
            );

            return;
        }


        /*
           Clear
        */

        if(action==="clear"){

            clearAll();

            return;
        }


        /*
           Backspace
        */

        if(action==="backspace"){

            backspace();

            return;
        }


        /*
           Equals
        */

        if(action==="calculate"){

            calculate();

            return;
        }


        /*
           Fraction
        */

        if(action==="fraction"){

            insertFraction();

            return;
        }


        /*
           History
        */

        if(action==="history"){

            showHistory();

            return;
        }


        /*
           Memory
        */

        if(action==="mc"){

            memoryClear();

            return;
        }

        if(action==="mr"){

            memoryRecall();

            return;
        }

        if(action==="mplus"){

            memoryAdd();

            return;
        }

        if(action==="mminus"){

            memorySub();

            return;
        }

        if(action==="ms"){

            memoryStore();

            return;
        }


        /*
           Engineering tools
        */

        const tool =
            button.dataset.tool;


        if(tool==="derivative")
            openDerivative();

        else if(tool==="integral")
            openIntegral();

        else if(tool==="limit")
            openLimit();

        else if(tool==="equation")
            openEquation();

        else if(tool==="matrix")
            openMatrix();

        else if(tool==="vector")
            openVector();

        else if(tool==="complex")
            openComplex();

        else if(tool==="stats")
            openStats();

        else if(tool==="converter")
            openConverter();

        else if(tool==="constants")
            openConstants();

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",

    function(e){

        if(
            [
                "INPUT",
                "TEXTAREA",
                "SELECT"
            ].includes(
                e.target.tagName
            )
        )
            return;


        if(
            (
                e.key>="0" &&
                e.key<="9"
            )
            ||
            [
                "+",
                "-",
                "*",
                "/",
                "%",
                "^",
                "(",
                ")",
                ".",
                ","
            ].includes(e.key)
        ){

            insert(e.key);

            e.preventDefault();

            return;
        }


        if(e.key==="Enter"){

            calculate();

            e.preventDefault();

            return;
        }


        if(
            e.key==="Backspace"
        ){

            backspace();

            e.preventDefault();

            return;
        }


        if(
            e.key==="ArrowLeft"
        ){

            moveLeft();

            e.preventDefault();

            return;
        }


        if(
            e.key==="ArrowRight"
        ){

            moveRight();

            e.preventDefault();

            return;
        }


        if(
            e.key==="ArrowUp"
        ){

            moveUp();

            e.preventDefault();

            return;
        }


        if(
            e.key==="ArrowDown"
        ){

            moveDown();

            e.preventDefault();

            return;
        }


        if(
            e.key==="Escape"
        ){

            clearAll();

            e.preventDefault();
        }

    }
);

render();
