<script>

/* =====================================================
   VARIABLES
===================================================== */

let angleMode="DEG";

let secondMode=false;

let engineeringNotation=false;

let memory=0;

let answer=0;


/* =====================================================
   DISPLAY ELEMENT
===================================================== */

const expression =
document.getElementById("expression");

const result =
document.getElementById("result");


/* =====================================================
   INSERT
   IMPORTANT:
   NO focus()
   THEREFORE ANDROID KEYBOARD
   WILL NOT OPEN.
===================================================== */

function insert(value){

    expression.value += value;

}


/* =====================================================
   BACKSPACE
===================================================== */

function backspace(){

    expression.value =
        expression.value.slice(0,-1);

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    expression.value="";

    result.textContent="0";

}


function clearEntry(){

    expression.value="";

}


/* =====================================================
   ANGLE
===================================================== */

function setAngle(mode){

    angleMode=mode;

    document.getElementById(
        "angleBadge"
    ).textContent=mode;


    document.getElementById(
        "degBtn"
    ).classList.remove("active");


    document.getElementById(
        "radBtn"
    ).classList.remove("active");


    document.getElementById(
        "gradBtn"
    ).classList.remove("active");


    document.getElementById(
        mode.toLowerCase()+"Btn"
    ).classList.add("active");

}


/* =====================================================
   SECOND
===================================================== */

function toggleSecond(){

    secondMode=!secondMode;

    document.getElementById(
        "secondBtn"
    ).classList.toggle(
        "active",
        secondMode
    );

}


/* =====================================================
   ANGLE CONVERSION
===================================================== */

function toRadians(x){

    if(angleMode==="DEG")
        return x*Math.PI/180;

    if(angleMode==="GRAD")
        return x*Math.PI/200;

    return x;

}


function fromRadians(x){

    if(angleMode==="DEG")
        return x*180/Math.PI;

    if(angleMode==="GRAD")
        return x*200/Math.PI;

    return x;

}


/* =====================================================
   CUSTOM MATH SCOPE
===================================================== */

function createScope(){

    return {

        Ans:answer,

        pi:Math.PI,

        e:Math.E,


        sin:x =>
            Math.sin(
                toRadians(x)
            ),


        cos:x =>
            Math.cos(
                toRadians(x)
            ),


        tan:x =>
            Math.tan(
                toRadians(x)
            ),


        asin:x =>
            fromRadians(
                Math.asin(x)
            ),


        acos:x =>
            fromRadians(
                Math.acos(x)
            ),


        atan:x =>
            fromRadians(
                Math.atan(x)
            ),


        sinh:x =>
            Math.sinh(x),


        cosh:x =>
            Math.cosh(x),


        tanh:x =>
            Math.tanh(x),


        ln:x =>
            Math.log(x),


        log10:x =>
            Math.log10(x),


        exp:x =>
            Math.exp(x),


        nPr:(n,r) =>
            math.factorial(n) /
            math.factorial(n-r),


        nCr:(n,r) =>
            math.factorial(n) /
            (
                math.factorial(r) *
                math.factorial(n-r)
            )

    };

}


/* =====================================================
   CALCULATE
===================================================== */

function calculate(){

    const exp =
        expression.value.trim();


    if(!exp)
        return;


    try{

        let value =
            math.evaluate(
                exp,
                createScope()
            );


        answer=value;


        let formatted =
            formatResult(value);


        result.textContent=
            formatted;


        addHistory(
            exp,
            formatted
        );


    }catch(error){

        result.textContent=
            "Error";


        console.log(error);

    }

}


/* =====================================================
   FORMAT
===================================================== */

function formatResult(value){

    try{

        if(typeof value==="number"){

            if(!Number.isFinite(value))
                return String(value);


            if(
                Math.abs(value)<1e-12
            ){

                value=0;

            }


            if(
                engineeringNotation
            ){

                return Number(value)
                    .toExponential(8);

            }


            return math.format(
                value,
                {
                    precision:14
                }
            );

        }


        return math.format(
            value,
            {
                precision:14
            }
        );


    }catch(error){

        return String(value);

    }

}


/* =====================================================
   ENGINEERING NOTATION
===================================================== */

function toggleNotation(){

    engineeringNotation=
        !engineeringNotation;


    if(expression.value)
        calculate();

}


/* =====================================================
   MEMORY
===================================================== */

function currentValue(){

    try{

        return Number(
            math.evaluate(
                expression.value,
                createScope()
            )
        );

    }catch(error){

        return answer;

    }

}


function memoryClear(){

    memory=0;

}


function memoryRecall(){

    insert(
        String(memory)
    );

}


function memoryAdd(){

    memory +=
        currentValue();

}


function memorySubtract(){

    memory -=
        currentValue();

}


function memoryStore(){

    memory =
        currentValue();

}


/* =====================================================
   HISTORY
===================================================== */

let historyData=
JSON.parse(
    localStorage.getItem(
        "adiyogiScientificHistory"
    ) || "[]"
);


function addHistory(
    exp,
    res
){

    historyData.unshift({

        exp:exp,

        result:res

    });


    historyData=
        historyData.slice(0,50);


    localStorage.setItem(
        "adiyogiScientificHistory",
        JSON.stringify(
            historyData
        )
    );


    renderHistory();

}


function renderHistory(){

    const box=
        document.getElementById(
            "history"
        );


    if(
        historyData.length===0
    ){

        box.textContent=
            "No calculations yet.";

        return;

    }


    box.innerHTML=
        historyData.map(
            (item,index)=>`

            <div
            class="history-item"
            onclick="loadHistory(${index})">

            ${escapeHtml(item.exp)}
            =
            ${escapeHtml(item.result)}

            </div>

            `
        ).join("");

}


function loadHistory(index){

    expression.value=
        historyData[index].exp;

    calculate();

}


function clearHistory(){

    historyData=[];

    localStorage.removeItem(
        "adiyogiScientificHistory"
    );

    renderHistory();

}


function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


/* =====================================================
   DERIVATIVE
===================================================== */

function openDerivative(){

    const exp=
        prompt(
            "Enter function of x\nExample: x^3 + 2*x"
        );


    if(!exp)
        return;


    try{

        const derivative=
            math.derivative(
                exp,
                "x"
            ).toString();


        const x=
            Number(
                prompt(
                    "Enter x value"
                )
            );


        const value=
            math.evaluate(
                derivative,
                {x:x}
            );


        alert(
            "Derivative:\n"+
            derivative+
            "\n\nAt x = "+
            x+
            "\nResult = "+
            formatResult(value)
        );


    }catch(error){

        alert(
            "Derivative error."
        );

    }

}


/* =====================================================
   INTEGRATION
===================================================== */

function openIntegral(){

    const exp=
        prompt(
            "Enter function of x\nExample: x^2"
        );


    if(!exp)
        return;


    const a=
        Number(
            prompt(
                "Lower limit"
            )
        );


    const b=
        Number(
            prompt(
                "Upper limit"
            )
        );


    if(
        !Number.isFinite(a) ||
        !Number.isFinite(b)
    )
        return;


    try{

        const n=10000;

        const h=
            (b-a)/n;


        let sum=0;


        for(
            let i=0;
            i<=n;
            i++
        ){

            const x=
                a+i*h;


            const y=
                math.evaluate(
                    exp,
                    {x:x}
                );


            if(
                i===0 ||
                i===n
            ){

                sum+=y;

            }

            else if(
                i%2===0
            ){

                sum+=2*y;

            }

            else{

                sum+=4*y;

            }

        }


        const value=
            sum*h/3;


        alert(
            "Definite Integral\n\n"+
            "Function: "+
            exp+
            "\nLimits: "+
            a+
            " to "+
            b+
            "\n\nResult = "+
            formatResult(value)
        );


    }catch(error){

        alert(
            "Integration error."
        );

    }

}

function openLimit(){

        prompt(
            "Enter function\nExample: sin(x)/x"
        );


    if(!exp)
        return;


    const point=
        Number(
            prompt(
                "x approaches"
            )
        );


    try{

        const h=1e-7;


        const left=
            math.evaluate(
                exp,
                {
                    x:
                    point-h
                }
            );


        const right=
            math.evaluate(
                exp,
                {
                    x:
                    point+h
                }
            );


        const value=
            (left+right)/2;


        alert(
            "Approximate Limit = "+
            formatResult(value)
        );


    }catch(error){

        alert(
            "Limit error."
        );

    }

}


/* =====================================================
   EQUATION SOLVER
===================================================== */

function openEquation(){

    const exp=
        prompt(
            "Enter equation expression.\nExample: x^2-5*x+6"
        );


    if(!exp)
        return;


    const guess=
        Number(
            prompt(
                "Initial guess",
                "1"
            )
        );


    try{

        let x=guess;


        for(
            let i=0;
            i<100;
            i++
        ){

            const f=
                math.evaluate(
                    exp,
                    {x:x}
                );


            const h=1e-6;


            const fp=
                (
                    math.evaluate(
                        exp,
                        {x:x+h}
                    )
                    -
                    math.evaluate(
                        exp,
                        {x:x-h}
                    )
                )
                /(2*h);


            if(
                Math.abs(fp)<1e-14
            )
                break;


            const next=
                x-f/fp;


            if(
                Math.abs(next-x)
                <1e-12
            ){

                x=next;

                break;

            }


            x=next;

        }


        alert(
            "Equation:\n"+
            exp+
            " = 0\n\n"+
            "x ≈ "+
            formatResult(x)
        );


    }catch(error){

        alert(
            "Equation solving error."
        );

    }

}
