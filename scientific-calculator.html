<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Adiyogi Scientific Calculator</title>

<meta name="description"
content="Advanced scientific and engineering calculator by AdiyogiTools.">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070b16;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overscroll-behavior:none;
}

button{
    font-family:inherit;
    border:0;
    outline:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    cursor:pointer;
}

/* =========================
   MAIN APP
========================= */

.app{
    width:100%;
    height:100dvh;
    max-width:900px;
    margin:auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#090e1c;
}

/* =========================
   HEADER
========================= */

.header{
    flex:0 0 auto;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 12px;
    background:#0d1323;
    border-bottom:1px solid #202a40;
}

.brand{
    font-size:18px;
    font-weight:bold;
    white-space:nowrap;
}

.header-right{
    display:flex;
    gap:6px;
}

.badge{
    background:#1b2942;
    color:#9edcff;
    border-radius:10px;
    padding:7px 10px;
    font-size:12px;
}

/* =========================
   DISPLAY
========================= */

.display-area{
    flex:0 0 auto;
    padding:7px 10px 5px;
    background:#090e1c;
}

.mode-row{
    height:20px;
    display:flex;
    align-items:center;
    gap:16px;
    padding-left:4px;
    font-size:11px;
    color:#a9b4c9;
    font-weight:bold;
}

.mode-row .active{
    color:#65d6ff;
}

.display{
    height:82px;
    background:#dceaea;
    color:#101820;
    border-radius:14px;
    padding:8px 12px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px #c2d3d3;
}

.expression{
    font-size:20px;
    line-height:25px;
    min-height:25px;
    overflow:hidden;
    white-space:nowrap;
    text-align:left;
}

.answer{
    font-size:28px;
    line-height:32px;
    font-weight:bold;
    overflow:hidden;
    white-space:nowrap;
    text-align:right;
}

/* =========================
   CONTROL ROW
========================= */

.controls{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    padding:5px 10px;
}

.ctrl{
    height:34px;
    border-radius:9px;
    background:#293248;
    color:#fff;
    font-size:12px;
    font-weight:bold;
}

.ctrl.active{
    background:#7545f5;
}

.ctrl.orange{
    background:#f49a45;
    color:#111;
}

/* =========================
   KEYPAD
========================= */

.keypad-wrap{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:3px 8px 8px;
    scrollbar-width:none;
}

.keypad-wrap::-webkit-scrollbar{
    display:none;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
}

.key{
    min-width:0;
    height:43px;
    border-radius:10px;
    background:#252d40;
    color:#fff;
    font-size:15px;
    font-weight:500;
    box-shadow:inset 0 -1px 0 rgba(255,255,255,.04);
}

.key:active{
    transform:scale(.96);
    background:#39445d;
}

.key.func{
    background:#30394e;
}

.key.operator{
    background:#454d61;
}

.key.orange{
    background:#f17d4f;
    color:#111;
}

.key.green{
    background:#18a866;
}

.key.yellow{
    color:#ffe85b;
}

.key.purple{
    color:#d9b4ff;
}

/* small labels */
.sub{
    font-size:10px;
    opacity:.7;
}

/* =========================
   ADVANCED TOOLS
========================= */

.tools{
    margin:7px 6px 8px;
    padding:9px;
    border:1px solid #27334d;
    border-radius:14px;
    background:#11182a;
}

.tools-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:7px;
}

.tools-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.tool-btn{
    min-height:38px;
    border-radius:9px;
    background:#252f46;
    color:#fff;
    font-size:11px;
    font-weight:bold;
    border:1px solid #394762;
}

.tool-btn:active{
    background:#394a68;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:rgba(0,0,0,.72);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(560px,100%);
    max-height:90dvh;
    overflow:auto;
    background:#111827;
    border:1px solid #33415d;
    border-radius:18px;
    padding:16px;
}

.modal-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

.modal input,
.modal select,
.modal textarea{
    width:100%;
    padding:11px;
    margin:5px 0;
    border-radius:9px;
    border:1px solid #3b4861;
    background:#202a3d;
    color:#fff;
    font-size:15px;
}

.modal textarea{
    min-height:90px;
    resize:vertical;
}

.modal-buttons{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.modal-buttons button{
    flex:1;
    padding:11px;
    border-radius:9px;
    background:#2c3850;
    color:#fff;
}

.modal-buttons .primary{
    background:#7545f5;
}

.result-box{
    margin-top:10px;
    padding:12px;
    background:#0a1020;
    border-radius:10px;
    border:1px solid #273650;
    white-space:pre-wrap;
    word-break:break-word;
}

/* =========================
   FRACTION MODAL
========================= */

.fraction-layout{
    display:grid;
    grid-template-columns:1fr 50px 1fr;
    align-items:center;
    gap:8px;
}

.fraction-layout input{
    text-align:center;
}

.frac-line{
    height:2px;
    background:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        height:43px;
    }

    .brand{

    }

    .badge{

    }

    .display{

@media(max-width:390px){

    }

    .keypad{
        gap:3px;
    }

    .key{
        height:37px;
        border-radius:8px;
        font-size:13px;
    }
}
</style>

<script>
/* =========================================================
   ADIYOGI SCIENTIFIC CALCULATOR ENGINE
========================================================= */

let expression = "";
let answer = 0;
let cursor = 0;

let angleMode = "DEG";
let memory = 0;
let secondMode = false;

const history = [];

const expressionEl =
document.getElementById("expression");

const answerEl =
document.getElementById("answer");

const modal =
document.getElementById("modal");

const modalTitle =
document.getElementById("modalTitle");

const modalContent =
document.getElementById("modalContent");

const modalResult =
document.getElementById("modalResult");

const modalRun =
document.getElementById("modalRun");


/* =========================================================
   DISPLAY
========================================================= */

function render(){

    expressionEl.textContent =
        expression || "";

    answerEl.textContent =
        formatNumber(answer);

}

function formatNumber(n){

    if(typeof n !== "number")
        return String(n);

    if(!Number.isFinite(n))
        return "Math Error";

    if(Math.abs(n) < 1e-14)
        n = 0;

    return Number(n.toPrecision(12)).toString();

}


/* =========================================================
   ANGLE
========================================================= */

function setAngle(mode){

    angleMode = mode;

    document.querySelectorAll(".controls .ctrl")
    .forEach(b=>b.classList.remove("active"));

    const buttons =
        document.querySelectorAll(".controls .ctrl");

    if(mode==="DEG") buttons[0].classList.add("active");
    if(mode==="RAD") buttons[1].classList.add("active");
    if(mode==="GRAD") buttons[2].classList.add("active");

    document.getElementById("angleBadge").textContent =
        mode;
}

function toRad(x){

    if(angleMode==="DEG")
        return x*Math.PI/180;

    if(angleMode==="GRAD")
        return x*Math.PI/200;

    return x;
}

function fromRad(x){

    if(angleMode==="DEG")
        return x*180/Math.PI;

    if(angleMode==="GRAD")
        return x*200/Math.PI;

    return x;
}


/* =========================================================
   INSERT / CURSOR
========================================================= */

function insert(value){

    expression =
        expression.slice(0,cursor)
        + value
        + expression.slice(cursor);

    cursor += value.length;

    render();
}

function backspace(){

    if(cursor<=0) return;

    expression =
        expression.slice(0,cursor-1)
        + expression.slice(cursor);

    cursor--;

    render();
}

function moveCursor(direction){

    cursor += direction;

    if(cursor<0)
        cursor=0;

    if(cursor>expression.length)
        cursor=expression.length;

    render();
}

function clearAll(){

    expression="";
    cursor=0;
    answer=0;

    render();
}


/* =========================================================
   SECOND MODE
========================================================= */

function openSecond(){

    secondMode=!secondMode;

    alert(
        secondMode
        ? "2nd functions enabled"
        : "2nd functions disabled"
    );
}


/* =========================================================
   MATH FUNCTIONS
========================================================= */

function factorial(n){

    if(n<0 || !Number.isInteger(n))
        throw new Error("Factorial requires non-negative integer");

    if(n>170)
        throw new Error("Number too large");

    let r=1;

    for(let i=2;i<=n;i++)
        r*=i;

    return r;
}

function nPr(n,r){

    if(n<0 || r<0 || r>n)
        throw new Error("Invalid nPr");

    return factorial(n)/factorial(n-r);
}

function nCr(n,r){

    if(n<0 || r<0 || r>n)
        throw new Error("Invalid nCr");

    return factorial(n)/
        (factorial(r)*factorial(n-r));
}

function gcd(a,b){

    a=Math.abs(Math.trunc(a));
    b=Math.abs(Math.trunc(b));

    while(b){
        [a,b]=[b,a%b];
    }

    return a;
}

function lcm(a,b){

    if(a===0 || b===0)
        return 0;

    return Math.abs(a*b)/gcd(a,b);
}


/* =========================================================
   TOKENIZER
========================================================= */

function tokenize(str){

    str=str
        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-")
        .replaceAll("π","pi")
        .replace(/\s+/g,"");

    const tokens=[];
    let i=0;

    while(i<str.length){

        const c=str[i];

        if(/[0-9.]/.test(c)){

            let num="";

            while(
                i<str.length &&
                /[0-9.eE+-]/.test(str[i])
            ){

                if(
                    (str[i]=="+" || str[i]=="-") &&
                    num.length &&
                    !/[eE]$/.test(num)
                ){
                    break;
                }

                num+=str[i];
                i++;
            }

            if(!Number.isFinite(Number(num)))
                throw new Error("Invalid number");

            tokens.push({
                type:"number",
                value:Number(num)
            });

            continue;
        }

        if(/[a-zA-Z_]/.test(c)){

            let name="";

            while(
                i<str.length &&
                /[a-zA-Z0-9_]/.test(str[i])
            ){

                name+=str[i];
                i++;
            }

            tokens.push({
                type:"name",
                value:name
            });

            continue;
        }

        if("+-*/%^(),".includes(c)){

            tokens.push({
                type:c,
                value:c
            });

            i++;
            continue;
        }

        throw new Error("Unknown symbol: "+c);
    }

    return tokens;
}


/* =========================================================
   SHUNTING YARD
========================================================= */

const precedence={
    "+":1,
    "-":1,
    "*":2,
    "/":2,
    "%":2,
    "^":3,
    "u-":4
};

const rightAssociative={
    "^":true,
    "u-":true
};

function toRPN(tokens){

    const output=[];
    const stack=[];

    let prev=null;

    for(const token of tokens){

        if(token.type==="number"){
            output.push(token);
            prev=token;
            continue;
        }

        if(token.type==="name"){

            stack.push(token);
            prev=token;
            continue;
        }

        if(token.type==="("){

            stack.push(token);
            prev=token;
            continue;
        }

        if(token.type===","){

            while(
                stack.length &&
                stack[stack.length-1].type!=="("
            ){
                output.push(stack.pop());
            }

            if(!stack.length)
                throw new Error("Invalid comma");

            prev=token;
            continue;
        }

        if(token.type===")"){

            while(
                stack.length &&
                stack[stack.length-1].type!=="("
            ){
                output.push(stack.pop());
            }

            if(!stack.length)
                throw new Error("Mismatched parentheses");

            stack.pop();

            if(
                stack.length &&
                stack[stack.length-1].type==="name"
            ){
                output.push(stack.pop());
            }

            prev=token;
            continue;
        }

        let op=token.type;

        if(
            op==="-" &&
            (
                prev===null ||
                ["(","+", "-", "*","/","%","^",","]
                .includes(prev.type)
            )
        ){
            op="u-";
        }

        while(stack.length){

            const top=stack[stack.length-1];

            if(top.type==="name")
            {
                output.push(stack.pop());
                continue;
            }

            if(!precedence[top.type])
                break;

            const p1=precedence[op];
            const p2=precedence[top.type];

            if(
                (!rightAssociative[op] && p1<=p2) ||
                (rightAssociative[op] && p1<p2)
            ){
                output.push(stack.pop());
            }else{
                break;
            }
        }

        stack.push({
            type:op,
            value:op
        });

        prev={
            type:op
        };
    }

    while(stack.length){

        const x=stack.pop();

        if(x.type==="(" || x.type===")")
            throw new Error("Mismatched parentheses");

        output.push(x);
    }

    return output;
}


/* =========================================================
   FUNCTION EVALUATION
========================================================= */

function functionValue(name,args){

    const x=args[0];

    switch(name.toLowerCase()){

        case "sin":
            return Math.sin(toRad(x));

        case "cos":
            return Math.cos(toRad(x));

        case "tan":
            return Math.tan(toRad(x));

        case "asin":
            return fromRad(Math.asin(x));

        case "acos":
            return fromRad(Math.acos(x));

        case "atan":
            return fromRad(Math.atan(x));

        case "sinh":
            return Math.sinh(x);

        case "cosh":
            return Math.cosh(x);

        case "tanh":
            return Math.tanh(x);

        case "log":
            return Math.log10(x);

        case "ln":
            return Math.log(x);

        case "sqrt":
            return Math.sqrt(x);

        case "cbrt":
            return Math.cbrt(x);

        case "abs":
            return Math.abs(x);

        case "floor":
            return Math.floor(x);

        case "ceil":
            return Math.ceil(x);

        case "round":
            return Math.round(x);

        case "fact":
            return factorial(x);

        case "exp":
            return Math.exp(x);

        case "sign":
            return Math.sign(x);

        case "inv":
            return 1/x;

        case "mod":
        case "MOD":
            return args[0]%args[1];

        case "npr":
            return nPr(args[0],args[1]);

        case "ncr":
            return nCr(args[0],args[1]);

        case "gcd":
            return gcd(args[0],args[1]);

        case "lcm":
            return lcm(args[0],args[1]);

        case "logb":
            return Math.log(args[0])/Math.log(args[1]);

        case "pow":
            return Math.pow(args[0],args[1]);

        default:
            throw new Error("Unknown function: "+name);
    }
}


/* =========================================================
   EVALUATOR
========================================================= */

function evaluate(expr){

    let tokens=tokenize(expr);

    /* implicit multiplication */

    const expanded=[];

    for(let i=0;i<tokens.length;i++){

        const a=tokens[i];
        const b=tokens[i+1];

        expanded.push(a);

        if(
            b &&
            (
                a.type==="number" ||
                a.type==="name" ||
                a.type===")"
            ) &&
            (
                b.type==="number" ||
                b.type==="name" ||
                b.type==="("
            )
        ){

            if(
                !(
                    a.type==="name" &&
                    b.type==="("
                )
            ){
                expanded.push({
                    type:"*",
                    value:"*"
                });
            }
        }
    }

    tokens=expanded;

    const rpn=toRPN(tokens);

    const stack=[];

    for(const t of rpn){

        if(t.type==="number"){
            stack.push(t.value);
            continue;
        }

        if(t.type==="name"){

            const name=t.value.toLowerCase();

            if(name==="pi"){
                stack.push(Math.PI);
                continue;
            }

            if(name==="e"){
                stack.push(Math.E);
                continue;
            }

            if(name==="ans"){
                stack.push(answer);
                continue;
            }

            /* Functions are evaluated with the
               number of available arguments.
            */

            if(
                [
                    "sin","cos","tan",
                    "asin","acos","atan",
                    "sinh","cosh","tanh",
                    "log","ln","sqrt","cbrt",
                    "abs","floor","ceil","round",
                    "fact","exp","sign","inv"
                ].includes(name)
            ){

                if(stack.length<1)
                    throw new Error("Missing argument");

                stack.push(
                    functionValue(name,[stack.pop()])
                );

                continue;
            }

            if(
                [
                    "mod","npr","ncr",
                    "gcd","lcm","logb","pow"
                ].includes(name)
            ){

                if(stack.length<2)
                    throw new Error("Missing arguments");

                const b=stack.pop();
                const a=stack.pop();

                stack.push(
                    functionValue(name,[a,b])
                );

                continue;
            }

            throw new Error("Unknown identifier");
        }

        if(t.type==="u-"){

            if(!stack.length)
                throw new Error("Invalid negative");

            stack.push(-stack.pop());
            continue;
        }

        if(stack.length<2)
            throw new Error("Invalid expression");

        const b=stack.pop();
        const a=stack.pop();

        switch(t.type){

            case "+":
                stack.push(a+b);
                break;

            case "-":
                stack.push(a-b);
                break;

            case "*":
                stack.push(a*b);
                break;

            case "/":
                stack.push(a/b);
                break;

            case "%":
                stack.push(a%b);
                break;

            case "^":
                stack.push(Math.pow(a,b));
                break;

            default:
                throw new Error("Unknown operator");
        }
    }

    if(stack.length!==1)
        throw new Error("Invalid expression");

    return stack[0];
}


/* =========================================================
   CALCULATE
========================================================= */

function calculate(){

    if(!expression.trim())
        return;

    try{

        const result=
            evaluate(expression);

        answer=result;

        history.unshift({
            expression:expression,
            answer:result
        });

        if(history.length>50)
            history.pop();

        expressionEl.textContent=expression;

        answerEl.textContent=
            formatNumber(result);

        cursor=expression.length;

    }catch(err){

        answerEl.textContent="Error";

    }
}

========================================================= */

function openDerivative(){

    openModal(
        "Numerical Derivative",
        `
        <input id="dExpr"
               placeholder="Example: x^2 + sin(x)">

        <input id="dX"
               type="number"
               inputmode="decimal"
               placeholder="x value">

        <select id="dOrder">
            <option value="1">First derivative</option>
            <option value="2">Second derivative</option>
        </select>

        <p>
        Use variable <b>x</b>.
        Angle mode applies to trigonometric functions.
        </p>
        `,
        runDerivative
    );
}

function evaluateX(expr,x){

    return evaluate(
        expr.replace(
            /\bx\b/gi,
            "(" + x + ")"
        )
    );
}

function runDerivative(){

    const expr=
        document.getElementById("dExpr").value;

    const x=
        Number(document.getElementById("dX").value);

    const order=
        Number(document.getElementById("dOrder").value);

    const h=
        Math.max(
            1e-5,
            Math.abs(x)*1e-5
        );

    try{

        let result;

        if(order===1){

            result=
                (
                    evaluateX(expr,x+h)
                    -
                    evaluateX(expr,x-h)
                )/(2*h);

        }else{

            result=
                (
                    evaluateX(expr,x+h)
                    -
                    2*evaluateX(expr,x)
                    +
                    evaluateX(expr,x-h)
                )/(h*h);
        }

        showModalResult(
            "Derivative = "+formatNumber(result)
        );

    }catch(e){

        showModalResult(
            "Error: "+e.message
        );
    }
}

        <input id="iN"
               type="number"
               inputmode="numeric"
               value="1000"
               placeholder="Intervals (even number)">
        `,
        runIntegral
    );
}

function runIntegral(){

    const expr=
        document.getElementById("iExpr").value;

    const a=
        Number(document.getElementById("iA").value);

    const b=
        Number(document.getElementById("iB").value);

    let n=
        Number(document.getElementById("iN").value)||1000;

    if(n%2!==0) n++;

    try{

        const h=(b-a)/n;

        let sum=
            evaluateX(expr,a)
            +
            evaluateX(expr,b);

        for(let i=1;i<n;i++){

            const x=a+i*h;

            sum+=
                (i%2===0?2:4)
                *evaluateX(expr,x);
        }

        const result=
            sum*h/3;

        showModalResult(
            "Integral = "+formatNumber(result)
        );

    }catch(e){

        showModalResult(
            "Error: "+e.message
        );
    }
}

function openEquation(){

        `
        <input id="eqExpr"

               type="number"
               inputmode="decimal"

        <p>

        </p>
        `,
        runEquation
    );
}

function runEquation(){

    const expr=
        document.getElementById("eqExpr").value;

    let x=
        Number(document.getElementById("eqGuess").value);

    try{

        for(let i=0;i<100;i++){

            const h=1e-6;

            const fx=
                evaluateX(expr,x);

            const derivative=
                (
                    evaluateX(expr,x+h)
                    -
                    evaluateX(expr,x-h)
                )/(2*h);

            if(Math.abs(derivative)<1e-14)
                throw new Error("Derivative too small");

            const next=
                x-fx/derivative;

            if(Math.abs(next-x)<1e-12){

                x=next;
                break;
            }

            x=next;
        }

        showModalResult(
            "Root x = "+formatNumber(x)+
            "\nf(x) = "+formatNumber(evaluateX(expr,x))
        );

    }catch(e){

        showModalResult(
            "Could not converge.\n"+e.message
        );
    }
}

            </option>

            </option>

            </option>

placeholder="Matrix A
Example:
1 2
3 4"></textarea>

        <textarea id="matrixB"
placeholder="Matrix B
Required for addition/multiplication"></textarea>
        `,
        runMatrix
    );
}

function parseMatrix(text){

    return text.trim()
        .split(/\n/)
        .map(row=>
            row.trim()
            .split(/[,\s]+/)
            .map(Number)
        );
}

function matrixValid(A){

    if(!A.length)
        return false;

    const cols=A[0].length;

    return A.every(r=>
        r.length===cols &&
        r.every(Number.isFinite)
    );
}

function determinant(A){

    const n=A.length;

    if(n!==A[0].length)
        throw new Error("Matrix must be square");

    if(n===1)
        return A[0][0];

    if(n===2)
        return A[0][0]*A[1][1]
             -A[0][1]*A[1][0];

    if(n===3){

        return A[0][0]*
        (
            A[1][1]*A[2][2]
            -
            A[1][2]*A[2][1]
        )
        -
        A[0][1]*
        (
            A[1][0]*A[2][2]
            -
            A[1][2]*A[2][0]
        )
        +
        A[0][2]*
        (
            A[1][0]*A[2][1]
            -
            A[1][1]*A[2][0]
        );
    }

    throw new Error("Currently supports up to 3×3");
}

function inverseMatrix(A){

    const n=A.length;

    if(n!==A[0].length)
        throw new Error("Square matrix required");

    if(n>3)
        throw new Error("Maximum 3×3");

    const aug=
        A.map((row,i)=>[
            ...row,
            ...Array.from(
                {length:n},
                (_,j)=>i===j?1:0
            )
        ]);

    for(let i=0;i<n;i++){

        let pivot=i;

        for(let r=i+1;r<n;r++){

            if(
                Math.abs(aug[r][i])
                >
                Math.abs(aug[pivot][i])
            )
                pivot=r;
        }

        if(Math.abs(aug[pivot][i])<1e-14)
            throw new Error("Singular matrix");

        [aug[i],aug[pivot]]=
        [aug[pivot],aug[i]];

        const div=aug[i][i];

        for(let j=0;j<2*n;j++)
            aug[i][j]/=div;

        for(let r=0;r<n;r++){

            if(r===i) continue;

            const factor=aug[r][i];

            for(let j=0;j<2*n;j++)
                aug[r][j]-=factor*aug[i][j];
        }
    }

    return aug.map(row=>
        row.slice(n)
    );
}

function addMatrix(A,B){

    if(
        A.length!==B.length ||
        A[0].length!==B[0].length
    )
        throw new Error("Different dimensions");

    return A.map((r,i)=>
        r.map((x,j)=>x+B[i][j])
    );
}

function multiplyMatrix(A,B){

    if(A[0].length!==B.length)
        throw new Error("Invalid dimensions");

    return A.map(row=>
        B[0].map((_,j)=>
            row.reduce(
                (sum,x,k)=>
                    sum+x*B[k][j],
                0
            )
        )
    );
}

function matrixText(A){

    return A.map(row=>
        row.map(formatNumber).join("\t")
    ).join("\n");
}

function runMatrix(){

    try{

        const op=
            document.getElementById("matrixOp").value;

        const A=
            parseMatrix(
                document.getElementById("matrixA").value
            );

        if(!matrixValid(A))
            throw new Error("Invalid Matrix A");

        let result;

        if(op==="det"){

            result=
                "det(A) = "
                +formatNumber(determinant(A));

        }else if(op==="inv"){

            result=
                matrixText(inverseMatrix(A));

        }else{

            const B=
                parseMatrix(
                    document.getElementById("matrixB").value
                );

            if(!matrixValid(B))
                throw new Error("Invalid Matrix B");

            if(op==="add")
                result=matrixText(addMatrix(A,B));

            if(op==="mul")
                result=matrixText(multiplyMatrix(A,B));
        }

        showModalResult(result);

    }catch(e){

        showModalResult(
            "Error: "+e.message
        );
    }
}


/* =========================================================
   VECTOR
========================================================= */

function openVector(){

    openModal(
        "Vector Calculator",
        `
        <select id="vectorOp">

            <option value="dot">
                Dot Product
            </option>

            <option value="cross">
                Cross Product
            </option>

            <option value="mag">
                Magnitude of A
            </option>

            <option value="angle">
                Angle Between A and B
            </option>

        </select>

        <input id="vectorA"
               placeholder="Vector A: 1,2,3">

        <input id="vectorB"
               placeholder="Vector B: 4,5,6">
        `,
        runVector
    );
}

function parseVector(text){

    return text
        .split(/[,\s]+/)
        .map(Number);
}

function runVector(){

    try{

        const op=
            document.getElementById("vectorOp").value;

        const A=
            parseVector(
                document.getElementById("vectorA").value
            );

        const B=
            parseVector(
                document.getElementById("vectorB").value
            );

        if(A.some(x=>!Number.isFinite(x)))
            throw new Error("Invalid Vector A");

        if(op==="mag"){

            const m=
                Math.sqrt(
                    A.reduce(
                        (s,x)=>s+x*x,
                        0
                    )
                );

            showModalResult(
                "|A| = "+formatNumber(m)
            );

            return;
        }

        if(A.length!==B.length)
            throw new Error("Dimensions must match");

        if(op==="dot"){

            const d=
                A.reduce(
                    (s,x,i)=>s+x*B[i],
                    0
                );

            showModalResult(
                "A · B = "+formatNumber(d)
            );

            return;
        }

        if(op==="cross"){

            if(A.length!==3 || B.length!==3)
                throw new Error("Cross product requires 3D vectors");

            const C=[
                A[1]*B[2]-A[2]*B[1],
                A[2]*B[0]-A[0]*B[2],
                A[0]*B[1]-A[1]*B[0]
            ];

            showModalResult(
                "A × B = [ "+
                C.map(formatNumber).join(", ")
                +" ]"
            );

            return;
        }

        if(op==="angle"){

            const dot=
                A.reduce(
                    (s,x,i)=>s+x*B[i],
                    0
                );

            const ma=
                Math.sqrt(
                    A.reduce(
                        (s,x)=>s+x*x,
                        0
                    )
                );

            const mb=
                Math.sqrt(
                    B.reduce(
                        (s,x)=>s+x*x,
                        0
                    )
                );

            const theta=
                Math.acos(
                    Math.min(
                        1,
                        Math.max(
                            -1,
                            dot/(ma*mb)
                        )
                    )
                );

            showModalResult(
                "Angle = "
                +formatNumber(fromRad(theta))
                +" "+angleMode
            );
        }

    }catch(e){

        showModalResult(
            "Error: "+e.message
        );
    }
}


/* =========================================================
   COMPLEX
========================================================= */

function openComplex(){

    openModal(
        "Complex Numbers",
        `
        <select id="complexOp">

            <option value="add">Addition</option>
            <option value="sub">Subtraction</option>
            <option value="mul">Multiplication</option>
            <option value="div">Division</option>
            <option value="mag">Magnitude</option>
            <option value="arg">Argument</option>

        </select>

        <input id="complexA"
               placeholder="A = a+bi">

        <input id="complexB"
               placeholder="B = c+di">
        `,
        runComplex
    );
}

function parseComplex(s){

    s=s.replace(/\s/g,"");

    if(!s.endsWith("i"))
        return {
            re:Number(s),
            im:0
        };

    s=s.slice(0,-1);

    let idx=-1;

    for(let i=1;i<s.length;i++){

        if(
            (s[i]=="+" || s[i]=="-") &&
            s[i-1]!=="e"
        )
            idx=i;
    }

    if(idx===-1){

        return {
            re:0,
            im:s===""?1:Number(s)
        };
    }

    return {
        re:Number(s.slice(0,idx)),
        im:Number(s.slice(idx))
    };
}

function complexText(z){

    const re=
        formatNumber(z.re);

    const im=
        formatNumber(Math.abs(z.im));

    return re+
        (z.im>=0?"+":"-")+
        im+"i";
}

function runComplex(){

    try{

        const op=
            document.getElementById("complexOp").value;

        const a=
            parseComplex(
                document.getElementById("complexA").value
            );

        const b=
            parseComplex(
                document.getElementById("complexB").value
            );

        let z;

        if(op==="add"){

            z={
                re:a.re+b.re,
                im:a.im+b.im
            };

        }else if(op==="sub"){

            z={
                re:a.re-b.re,
                im:a.im-b.im
            };

        }else if(op==="mul"){

            z={
                re:a.re*b.re-a.im*b.im,
                im:a.re*b.im+a.im*b.re
            };

        }else if(op==="div"){

            const d=
                b.re*b.re+b.im*b.im;

            z={
                re:(a.re*b.re+a.im*b.im)/d,
                im:(a.im*b.re-a.re*b.im)/d
            };

        }else if(op==="mag"){

            showModalResult(
                "|A| = "+
                formatNumber(
                    Math.hypot(a.re,a.im)
                )
            );

            return;

        }else{

            showModalResult(
                "arg(A) = "+
                formatNumber(
                    fromRad(
                        Math.atan2(a.im,a.re)
                    )
                )+
                " "+angleMode
            );

            return;
        }

        showModalResult(
            complexText(z)
        );

    }catch(e){

        showModalResult(
            "Error: "+e.message
        );
    }
}

10, 20, 30, 40, 50"></textarea>
        `,
        runStats
    );
}

function runStats(){

    try{

        const data=
            document.getElementById("statsData")
            .value
            .split(/[,\s]+/)
            .map(Number)
            .filter(Number.isFinite);

        if(!data.length)
            throw new Error("No data");

        const n=data.length;

        const sum=
            data.reduce((a,b)=>a+b,0);

        const mean=sum/n;

        const sorted=[...data].sort((a,b)=>a-b);

        const median=
            n%2
            ? sorted[Math.floor(n/2)]
            : (
                sorted[n/2-1]+
                sorted[n/2]
            )/2;

        const variance=
            data.reduce(
                (s,x)=>s+(x-mean)**2,
                0
            )/n;

        const sd=Math.sqrt(variance);

        showModalResult(
            "n = "+n+
            "\nSum = "+formatNumber(sum)+
            "\nMean = "+formatNumber(mean)+
            "\nMedian = "+formatNumber(median)+
            "\nVariance = "+formatNumber(variance)+
            "\nStd. Deviation = "+formatNumber(sd)+
            "\nMinimum = "+formatNumber(sorted[0])+
            "\nMaximum = "+formatNumber(sorted[n-1])
        );

    }catch(e){

        showModalResult(
            "Error: "+e.message
        );
    }
}


/* =========================================================
   UNIT CONVERTER
========================================================= */

function openConverter(){

    openModal(
        "Engineering Unit Converter",
        `
        <select id="convType">

            <option value="length">Length</option>
            <option value="mass">Mass</option>
            <option value="area">Area</option>
            <option value="volume">Volume</option>
            <option value="pressure">Pressure</option>
            <option value="speed">Speed</option>
            <option value="temperature">Temperature</option>

        </select>

        <input id="convValue"
               type="number"
               inputmode="decimal"
               placeholder="Value">

        <select id="convFrom"></select>

        <select id="convTo"></select>
        `,
        runConverter
    );

    updateConverterUnits();

    document
        .getElementById("convType")
        .addEventListener(
            "change",
            updateConverterUnits
        );
}

const units={

    length:{
        m:1,
        km:1000,
        cm:.01,
        mm:.001,
        ft:.3048,
        inch:.0254,
        yd:.9144,
        mile:1609.344
    },

    mass:{
        kg:1,
        g:.001,
        mg:.000001,
        tonne:1000,
        lb:.45359237
    },

    area:{
        m2:1,
        km2:1e6,
        cm2:1e-4,
        ft2:.09290304,
        acre:4046.8564224
    },

    volume:{
        m3:1,
        litre:.001,
        ml:.000001,
        cm3:1e-6,
        ft3:.0283168466
    },

    pressure:{
        Pa:1,
        kPa:1000,
        MPa:1e6,
        bar:1e5,
        atm:101325,
        psi:6894.757293
    },

    speed:{
        mps:1,
        kmph:1/3.6,
        mph:.44704,
        knot:.514444
    }
};

function updateConverterUnits(){

    const type=
        document.getElementById("convType").value;

    const from=
        document.getElementById("convFrom");

    const to=
        document.getElementById("convTo");

    from.innerHTML="";
    to.innerHTML="";

    if(type==="temperature"){

        ["C","F","K"].forEach(u=>{
            from.innerHTML+=
                `<option>${u}</option>`;

            to.innerHTML+=
                `<option>${u}</option>`;
        });

        return;
    }

    Object.keys(units[type]).forEach(u=>{

        from.innerHTML+=
            `<option value="${u}">${u}</option>`;

        to.innerHTML+=
            `<option value="${u}">${u}</option>`;
    });
}

function runConverter(){

    const type=
        document.getElementById("convType").value;

    const value=
        Number(
            document.getElementById("convValue").value
        );

    const from=
        document.getElementById("convFrom").value;

    const to=
        document.getElementById("convTo").value;

    let result;

    if(type==="temperature"){

        let c;

        if(from==="C") c=value;
        if(from==="F") c=(value-32)*5/9;
        if(from==="K") c=value-273.15;

        if(to==="C") result=c;
        if(to==="F") result=c*9/5+32;
        if(to==="K") result=c+273.15;

    }else{

        const base=
            value*units[type][from];

        result=
            base/units[type][to];
    }

    showModalResult(
        formatNumber(value)+" "+from+
        " = "+
        formatNumber(result)+" "+to
    );
}

function showHistory(){

    if(!history.length){

        alert("No calculation history yet.");

        return;
    }

    openModal(
        "Calculation History",
        `
        <div id="historyList"></div>
        `,
        function(){}
    );

    const list=
        document.getElementById("historyList");

    list.innerHTML=
        history.map(
            (h,i)=>
            `
            <div style="
                padding:10px;
                margin:5px 0;
                background:#202a3d;
                border-radius:8px;
            ">
            ${i+1}. ${h.expression}
            <br>
            <b>= ${formatNumber(h.answer)}</b>
            </div>
            `
        ).join("");

    modalRun.style.display="none";
}


/* =========================================================
   KEYBOARD SUPPORT
   Main calculator has NO input field, so native
   mobile keyboard will not appear.
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key>="0" && e.key<="9"){
            insert(e.key);
        }

        else if(
            ["+","-","*","/","%","^",
             "(",")",".",","]
            .includes(e.key)
        ){
            insert(e.key);
        }

        else if(e.key==="Enter"){
            calculate();
        }

        else if(e.key==="Backspace"){
            backspace();
        }

        else if(e.key==="ArrowLeft"){
            moveCursor(-1);
        }

        else if(e.key==="ArrowRight"){
            moveCursor(1);
        }

        else if(e.key==="Escape"){
            clearAll();
        }
    }
);


/* =========================================================
   PREVENT ACCIDENTAL FOCUS / ZOOM
========================================================= */

document.querySelectorAll("button")
.forEach(btn=>{

    btn.addEventListener(
        "mousedown",
        e=>e.preventDefault()
    );

    btn.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
        },
        {passive:false}
    );
});

========================================================= */

render();
