<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Adiyogi Scientific Calculator</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080d19;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overscroll-behavior:none;
}

button{
    border:none;
    outline:none;
    font-family:inherit;
    user-select:none;
    -webkit-user-select:none;
    cursor:pointer;
}


/* =====================================================
   APP
===================================================== */

.app{

    width:100%;
    max-width:900px;

    height:100dvh;

    margin:auto;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:#080d19;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:48px;
    min-height:48px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:5px 12px;

    background:#0d1322;

    border-bottom:1px solid #202a40;
}

.brand{

    font-size:18px;
    font-weight:bold;

    white-space:nowrap;
}

.header-right{

    display:flex;
    gap:5px;
}

.badge{

    background:#192842;

    color:#9edbff;

    border-radius:10px;

    padding:7px 9px;

    font-size:11px;
}


/* =====================================================
   DISPLAY
===================================================== */

.display-area{

    flex:none;

    padding:5px 10px;

    background:#080d19;
}

.mode-row{

    height:21px;

    display:flex;

    align-items:center;

    gap:18px;

    padding-left:5px;

    font-size:11px;

    font-weight:bold;

    color:#aab4c8;
}

.mode-row .active{

    color:#65d7ff;
}

.display{

    height:76px;

    background:#dceaea;

    color:#111820;

    border-radius:14px;

    padding:7px 12px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    overflow:hidden;

    box-shadow:
    inset 0 0 0 1px #c2d4d4;
}

.expression{

    min-height:23px;

    font-size:18px;

    line-height:23px;

    white-space:nowrap;

    overflow:hidden;

    text-align:left;
}

.answer{

    font-size:26px;

    line-height:30px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-align:right;
}


/* =====================================================
   CONTROL ROW
===================================================== */

.controls{

    flex:none;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    gap:4px;

    padding:4px 10px;
}

.ctrl{

    height:32px;

    border-radius:9px;

    background:#293249;

    color:white;

    font-size:11px;

    font-weight:bold;
}

.ctrl.active{

    background:#7545f5;
}

.ctrl:active{

    background:#46536e;

    transform:scale(.96);
}


/* =====================================================
   SCROLL AREA
===================================================== */

.scroll-area{

    flex:1;

    min-height:0;

    overflow-y:auto;

    overflow-x:hidden;

    padding:2px 8px 15px;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior-y:contain;

    touch-action:pan-y;

    scrollbar-width:none;
}

.scroll-area::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   KEYPAD
===================================================== */

.keypad{

    display:grid;

    grid-template-columns:
    repeat(6,1fr);

    gap:4px;
}

.key{

    height:41px;

    border-radius:10px;

    background:#252e42;

    color:white;

    font-size:14px;

    font-weight:500;

    touch-action:manipulation;

    transition:
    transform .08s,
    background .08s;
}

.key:active{

    transform:scale(.95);

    background:#43506b;
}

.func{

    background:#30394e;
}

.operator{

    background:#454e62;
}

.orange{

    background:#f27d4d;

    color:#111;
}

.green{

    background:#18a968;
}

.yellow{

    color:#ffe85a;
}

.purple{

    color:#d7b0ff;
}


/* =====================================================
   ENGINEERING TOOLS
===================================================== */

.tools{

    margin:7px 5px 0;

    padding:9px;

    background:#11182a;

    border:1px solid #29354d;

    border-radius:14px;
}

.tools-title{

    font-size:15px;

    font-weight:bold;

    margin-bottom:7px;
}

.tools-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:5px;
}

.tool-btn{

    height:39px;

    border-radius:9px;

    background:#273149;

    color:white;

    border:1px solid #3a4862;

    font-size:12px;

    font-weight:bold;

    touch-action:manipulation;
}

.tool-btn:active{

    transform:scale(.97);

    background:#465570;
}


/* =====================================================
   MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    z-index:9999;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:
    rgba(0,0,0,.75);
}

.modal.show{

    display:flex;
}

.modal-box{

    width:min(500px,100%);

    max-height:90dvh;

    overflow:auto;

    background:#111827;

    border:1px solid #35425c;

    border-radius:18px;

    padding:16px;
}

.modal-title{

    font-size:20px;

    font-weight:bold;

    margin-bottom:12px;
}


/* =====================================================
   MODAL INPUT
===================================================== */

.modal input,
.modal select,
.modal textarea{

    width:100%;

    padding:11px;

    margin:5px 0;

    background:#202a3d;

    color:white;

    border:1px solid #3b4861;

    border-radius:9px;

    font-size:15px;
}

.modal textarea{

    min-height:90px;
}


/* =====================================================
   FRACTION
===================================================== */

.fraction-box{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    width:100%;

    margin:10px 0;
}

.fraction-box input{

    width:180px;

    text-align:center;

    margin:5px 0;

    font-size:18px;
}

.fraction-line{

    width:190px;

    height:3px;

    background:white;

    border-radius:3px;

    margin:2px 0;
}


/* =====================================================
   MODAL BUTTONS
===================================================== */

.modal-buttons{

    display:flex;

    gap:7px;

    margin-top:10px;
}

.modal-buttons button{

    flex:1;

    height:42px;

    border-radius:9px;

    background:#303b53;

    color:white;

    font-weight:bold;
}

.modal-buttons .primary{

    background:#7545f5;
}

.result{

    margin-top:10px;

    padding:12px;

    border-radius:9px;

    background:#080f20;

    border:1px solid #293650;

    white-space:pre-wrap;

    word-break:break-word;
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:400px){

    .header{

/* =====================================================

        font-size:12px;
    }

    .display{

        height:66px;
    }

    .tools-title{

        font-size:13px;
    }

}

</style>

<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let expression = "";

let answer = 0;

let cursor = 0;

let angleMode = "DEG";

let memory = 0;

let second = false;

const history = [];


/* =====================================================
   ELEMENTS
===================================================== */

const expressionDisplay =
document.getElementById("expression");

const answerDisplay =
document.getElementById("answer");

const angleBadge =
document.getElementById("angleBadge");

const modal =
document.getElementById("modal");

const modalTitle =
document.getElementById("modalTitle");

const modalContent =
document.getElementById("modalContent");

const modalResult =
document.getElementById("modalResult");

const modalCalculate =
document.getElementById("modalCalculate");


/* =====================================================
   DISPLAY
===================================================== */

function render(){

    expressionDisplay.textContent =
        expression;

    answerDisplay.textContent =
        formatNumber(answer);
}


function formatNumber(n){

    if(typeof n !== "number")
        return String(n);

    if(!Number.isFinite(n))
        return "Math Error";

    if(Math.abs(n)<1e-14)
        n=0;

    return Number(
        n.toPrecision(12)
    ).toString();
}


/* =====================================================
   ANGLE
===================================================== */

function setAngle(mode){

    angleMode=mode;

    angleBadge.textContent=mode;

    const buttons =
        document.querySelectorAll(
            ".controls .ctrl"
        );

    buttons.forEach(
        b=>b.classList.remove("active")
    );

    if(mode==="DEG")
        buttons[0].classList.add("active");

    if(mode==="RAD")
        buttons[1].classList.add("active");

    if(mode==="GRAD")
        buttons[2].classList.add("active");
}


function toRad(x){

    if(angleMode==="DEG")
        return x*Math.PI/180;

    if(angleMode==="GRAD")
        return x*Math.PI/200;

    return x;
}


function fromRad(x){

    if(angleMode==="DEG")
        return x*180/Math.PI;

    if(angleMode==="GRAD")
        return x*200/Math.PI;

    return x;
}


/* =====================================================
   CURSOR
===================================================== */

function insert(value){

    expression =
        expression.slice(0,cursor)
        +
        value
        +
        expression.slice(cursor);

    cursor += value.length;

    render();
}


function backspace(){

    if(cursor<=0)
        return;

    expression =
        expression.slice(0,cursor-1)
        +
        expression.slice(cursor);

    cursor--;

    render();
}


function moveCursor(direction){

    cursor += direction;

    if(cursor<0)
        cursor=0;

    if(cursor>expression.length)
        cursor=expression.length;

    render();
}


/*
   UP/DOWN buttons:
   In a single-line expression these are used
   for jumping across function/parenthesis groups.
*/

function moveCursorUp(){

    if(!expression.length)
        return;

    const left =
        expression.lastIndexOf(
            "(",
            cursor-1
        );

    if(left>=0){

        cursor=left;

    }else{

        cursor=0;
    }

    render();
}


function moveCursorDown(){

    if(!expression.length)
        return;

    const right =
        expression.indexOf(
            ")",
            cursor
        );

    if(right>=0){

        cursor=right+1;

    }else{

        cursor=expression.length;
    }

    render();
}


/* =====================================================
   SECOND
===================================================== */

function secondFunction(){

    second=!second;

    alert(
        second
        ? "2nd mode ON"
        : "2nd mode OFF"
    );
}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    expression="";

    cursor=0;

    answer=0;

    render();
}


/* =====================================================
   FACTORIAL
===================================================== */

function factorial(n){

    if(n<0 || !Number.isInteger(n))
        throw new Error(
            "Factorial requires non-negative integer"
        );

    if(n>170)
        throw new Error(
            "Number too large"
        );

    let result=1;

    for(let i=2;i<=n;i++)
        result*=i;

    return result;
}


function nPr(n,r){

    return factorial(n)/
           factorial(n-r);
}


function nCr(n,r){

    return factorial(n)/
           (
               factorial(r)*
               factorial(n-r)
           );
}


/* =====================================================
   GCD LCM
===================================================== */

function gcd(a,b){

    a=Math.abs(Math.trunc(a));

    b=Math.abs(Math.trunc(b));

    while(b){

        const temp=b;

        b=a%b;

        a=temp;
    }

    return a;
}


function lcm(a,b){

    if(a===0 || b===0)
        return 0;

    return Math.abs(
        a*b
    )/gcd(a,b);
}


/* =====================================================
   SIMPLE EVALUATOR
===================================================== */

function evaluate(expr){

    expr=expr
        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-")
        .replaceAll("π","Math.PI")
        .replace(/\bAns\b/g,"answer")
        .replace(/\be\b/g,"Math.E");

    /*
       Scientific functions
    */

    expr=expr
        .replace(/sin\(/g,"SIN(")
        .replace(/cos\(/g,"COS(")
        .replace(/tan\(/g,"TAN(")
        .replace(/asin\(/g,"ASIN(")
        .replace(/acos\(/g,"ACOS(")
        .replace(/atan\(/g,"ATAN(")
        .replace(/sinh\(/g,"Math.sinh(")
        .replace(/cosh\(/g,"Math.cosh(")
        .replace(/tanh\(/g,"Math.tanh(")
        .replace(/log\(/g,"Math.log10(")
        .replace(/ln\(/g,"Math.log(")
        .replace(/sqrt\(/g,"Math.sqrt(")
        .replace(/cbrt\(/g,"Math.cbrt(")
        .replace(/abs\(/g,"Math.abs(")
        .replace(/floor\(/g,"Math.floor(")
        .replace(/ceil\(/g,"Math.ceil(")
        .replace(/round\(/g,"Math.round(")
        .replace(/exp\(/g,"Math.exp(");

    expr=expr.replace(/\^/g,"**");

    /*
       DEG / RAD / GRAD
    */

    expr=expr.replace(
        /SIN\(([^()]*)\)/g,
        (_,x)=>`Math.sin(${toRad(Number(eval(x)))})`
    );

    expr=expr.replace(
        /COS\(([^()]*)\)/g,
        (_,x)=>`Math.cos(${toRad(Number(eval(x)))})`
    );

    expr=expr.replace(
        /TAN\(([^()]*)\)/g,
        (_,x)=>`Math.tan(${toRad(Number(eval(x)))})`
    );

    expr=expr.replace(
        /ASIN\(([^()]*)\)/g,
        (_,x)=>fromRad(
            Math.asin(
                Number(eval(x))
            )
        )
    );

    expr=expr.replace(
        /ACOS\(([^()]*)\)/g,
        (_,x)=>fromRad(
            Math.acos(
                Number(eval(x))
            )
        )
    );

    expr=expr.replace(
        /ATAN\(([^()]*)\)/g,
        (_,x)=>fromRad(
            Math.atan(
                Number(eval(x))
            )
        );

    expr=expr.replace(
        /fact\(([^()]*)\)/g,
        (_,x)=>factorial(
            Number(eval(x))
        )
    );

    expr=expr.replace(
        /npr\(([^,]+),([^()]+)\)/g,
        (_,a,b)=>
            nPr(
                Number(eval(a)),
                Number(eval(b))
            )
    );

    expr=expr.replace(
        /ncr\(([^,]+),([^()]+)\)/g,
        (_,a,b)=>
            nCr(
                Number(eval(a)),
                Number(eval(b))
            )
    );

    expr=expr.replace(
        /gcd\(([^,]+),([^()]+)\)/g,
        (_,a,b)=>
            gcd(
                Number(eval(a)),
                Number(eval(b))
            )
    );

    expr=expr.replace(
        /lcm\(([^,]+),([^()]+)\)/g,
        (_,a,b)=>
            lcm(
                Number(eval(a)),
                Number(eval(b))
            )
    );

    expr=expr.replace(
        /inv\(([^()]*)\)/g,
        (_,x)=>1/Number(eval(x))
    );

    /*
       Security:
       Only mathematical characters are allowed.
    */

    if(
        /[;{}[\]'"`<>]|window|document|alert|function/i
        .test(expr)
    )
        throw new Error("Invalid expression");

    const result =
        Function(
            "answer",
            `"use strict"; return (${expr})`
        )(answer);

    if(!Number.isFinite(result))
        throw new Error("Math Error");

    return result;
}


/* =====================================================
   CALCULATE
===================================================== */

function calculate(){

    if(!expression.trim())
        return;

    try{

        const result=
            evaluate(expression);

        answer=result;

        history.unshift({
            expression:expression,
            answer:result
        });

        if(history.length>50)
            history.pop();

        answerDisplay.textContent =
            formatNumber(result);

    }catch(error){

        answerDisplay.textContent="Error";
    }
}

    try{

        memory=
            evaluate(expression);

    }catch{}
}


function memoryAdd(){

    try{

        memory +=
            evaluate(expression);

    }catch{}
}


function memorySub(){

    try{

        memory -=
            evaluate(expression);

    }catch{}
}

/* =====================================================
   HISTORY
===================================================== */

function showHistory(){

    let text="";

    if(!history.length){

        text="No calculation history.";

    }else{

        history.forEach(
            (item,index)=>{

                text +=
                    (index+1)+
                    ". "+
                    item.expression+
                    " = "+
                    formatNumber(
                        item.answer
                    )+
                    "\n\n";
            }
        );
    }

    openModal(
        "Calculation History",
        `<div class="result"
              style="display:block">
              ${escapeHtml(text)}
         </div>`,
        function(){}
    );

    modalCalculate.style.display=
        "none";
}


function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function openIntegral(){

    openModal(

        "Numerical Integration",

        `
        <input
            id="intExpr"
            placeholder="Example: x^2">

        <input
            id="intA"
            type="number"
            inputmode="decimal"
            placeholder="Lower limit">

        <input
            id="intB"
            type="number"
            inputmode="decimal"
            placeholder="Upper limit">

        `,

        function(){

            try{

                const f=
                    document.getElementById(
                        "intExpr"
                    ).value;

                const a=
                    Number(
                        document.getElementById(
                            "intA"
                        ).value
                    );

                const b=
                    Number(
                        document.getElementById(
                            "intB"
                        ).value
                    );

                const n=1000;

                const h=(b-a)/n;

                let sum=0;

                for(
                    let i=0;
                    i<=n;
                    i++
                ){

                    const x=
                        a+i*h;

                    const y=
                        Function(
                            "x",
                            "return "+f
                        )(x);

                    if(
                        i===0 ||
                        i===n
                    )
                        sum+=y;

                    else if(i%2===0)
                        sum+=2*y;

                    else
                        sum+=4*y;
                }

                const result=
                    sum*h/3;

                showResult(
                    "∫ = "+
                    formatNumber(result)
                );

            }catch(e){

                showResult(
                    "Error"
                );
            }
        }
    );
}

function openEquation(){

    openModal(

        "Equation Solver",

        `
        <input
            id="eq"
            placeholder="Example: x*x-4">

        <input
            id="guess"
            type="number"
            inputmode="decimal"
            value="1"
            placeholder="Initial guess">

        `,

        function(){

            try{

                const f=
                    document.getElementById(
                        "eq"
                    ).value;

                let x=
                    Number(
                        document.getElementById(
                            "guess"
                        ).value
                    );

                for(
                    let i=0;
                    i<100;
                    i++
                ){

                    const h=1e-6;

                    const fx=
                        Function(
                            "x",
                            "return "+f
                        )(x);

                    const d=
                        (
                            Function(
                                "x",
                                "return "+f
                            )(x+h)
                            -
                            Function(
                                "x",
                                "return "+f
                            )(x-h)
                        )/(2*h);

                    if(
                        Math.abs(d)<1e-14
                    )
                        break;

                    const nx=
                        x-fx/d;

                    if(
                        Math.abs(nx-x)
                        <1e-12
                    ){

                        x=nx;
                        break;
                    }

                    x=nx;
                }

                showResult(
                    "x = "+
                    formatNumber(x)
                );

            }catch{

                showResult(
                    "Could not solve."
                );
            }
        }
    );
}

                    );

                }

                if(op==="inverse"){

                        )
                    );

                    return;
                }

                const B=
                    parseMatrix(
                        document.getElementById(
                            "matrixB"
                        ).value
                    );

                let C;

                if(op==="add")
                    C=matrixAdd(A,B);

                if(op==="multiply")
                    C=matrixMultiply(A,B);

                showResult(
                    matrixToText(C)
                );

            }catch(e){

                showResult(
                    "Matrix Error"
                );
            }
        }
    );
}


function parseMatrix(text){

    return text
        .trim()
        .split("\n")
        .map(
            row=>
            row.trim()
            .split(/[,\s]+/)
            .map(Number)
        );
}


function determinant(A){

    if(A.length===2){

        return A[0][0]*A[1][1]
             -
               A[0][1]*A[1][0];
    }

    if(A.length===3){

        return

        A[0][0]*
        (
            A[1][1]*A[2][2]
            -
            A[1][2]*A[2][1]
        )
        -
        A[0][1]*
        (
            A[1][0]*A[2][2]
            -
            A[1][2]*A[2][0]
        )
        +
        A[0][2]*
        (
            A[1][0]*A[2][1]
            -
            A[1][1]*A[2][0]
        );
    }

    throw new Error(
        "Use 2x2 or 3x3"
    );
}


function inverseMatrix(A){

    const n=A.length;

    if(
        n!==2 ||
        A[0].length!==2
    )
        throw new Error(
            "Currently 2x2 inverse"
        );

    const d=
        determinant(A);

    if(Math.abs(d)<1e-14)
        throw new Error(
            "Singular matrix"
        );

    return [

        [
            A[1][1]/d,
            -A[0][1]/d
        ],

        [
            -A[1][0]/d,
            A[0][0]/d
        ]

    ];
}


function matrixAdd(A,B){

    return A.map(
        (row,i)=>
        row.map(
            (x,j)=>
            x+B[i][j]
        )
    );
}


function matrixMultiply(A,B){

    return A.map(
        row=>
        B[0].map(
            (_,j)=>
            row.reduce(
                (sum,x,k)=>
                sum+x*B[k][j],
                0
            )
        )
    );
}


function matrixToText(A){

    return A.map(
        row=>
        row.map(
            formatNumber
        ).join("\t")
    ).join("\n");
}


/* =====================================================
   VECTOR
===================================================== */

function openVector(){

    openModal(

        "Vector Calculator",

        `
        <select id="vectorOperation">

            <option value="dot">
                Dot Product
            </option>

            <option value="cross">
                Cross Product
            </option>

            <option value="magnitude">
                Magnitude
            </option>

            <option value="angle">
                Angle Between
            </option>

        </select>

        <input
            id="vectorA"
            placeholder="A: 1,2,3">

        <input
            id="vectorB"
            placeholder="B: 4,5,6">

        `,

        function(){

            try{

                const op=
                    document.getElementById(
                        "vectorOperation"
                    ).value;

                const A=
                    document.getElementById(
                        "vectorA"
                    ).value
                    .split(/[,\s]+/)
                    .map(Number);

                const B=
                    document.getElementById(
                        "vectorB"
                    ).value
                    .split(/[,\s]+/)
                    .map(Number);

                if(op==="magnitude"){

                    const m=
                        Math.sqrt(
                            A.reduce(
                                (s,x)=>
                                s+x*x,
                                0
                            )
                        );

                    showResult(
                        "|A| = "+
                        formatNumber(m)
                    );

                    return;
                }

                if(op==="dot"){

                    const d=
                        A.reduce(
                            (s,x,i)=>
                            s+x*B[i],
                            0
                        );

                    showResult(
                        "A · B = "+
                        formatNumber(d)
                    );

                    return;
                }

                if(op==="cross"){

                    const C=[

                        A[1]*B[2]
                        -
                        A[2]*B[1],

                        A[2]*B[0]
                        -
                        A[0]*B[2],

                        A[0]*B[1]
                        -
                        A[1]*B[0]

                    ];

                    showResult(
                        "["+
                        C.map(
                            formatNumber
                        ).join(", ")+
                        "]"
                    );

                    return;
                }

                const dot=
                    A.reduce(
                        (s,x,i)=>
                        s+x*B[i],
                        0
                    );

                const ma=
                    Math.sqrt(
                        A.reduce(
                            (s,x)=>
                            s+x*x,
                            0
                        )
                    );

                const mb=
                    Math.sqrt(
                        B.reduce(
                            (s,x)=>
                            s+x*x,
                            0
                        )
                    );

                const theta=
                    Math.acos(
                        dot/(ma*mb)
                    );

                showResult(
                    "Angle = "+
                    formatNumber(
                        fromRad(theta)
                    )+
                    " "+
                    angleMode
                );

            }catch{

                showResult(
                    "Vector Error"
                );
            }
        }
    );
}

function openStats(){

    openModal(

        "Statistics",

        `
        <textarea
            id="stats"
            placeholder="10,20,30,40,50"></textarea>

        `,

        function(){

            const data=
                document.getElementById(
                    "stats"
                ).value
                .split(/[,\s]+/)
                .map(Number)
                .filter(
                    Number.isFinite
                );

            if(!data.length){

                showResult(
                    "No data."
                );

                return;
            }

            const sum=
                data.reduce(
                    (a,b)=>a+b,
                    0
                );

            const mean=
                sum/data.length;

            const variance=
                data.reduce(
                    (s,x)=>
                    s+(x-mean)**2,
                    0
                )/data.length;

            showResult(

                "n = "+
                data.length+

                "\nMean = "+
                formatNumber(mean)+

                "\nVariance = "+
                formatNumber(variance)+

                "\nStandard Deviation = "+
                formatNumber(
                    Math.sqrt(variance)
                )
            );
        }
    );
}

/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key>="0" &&
            e.key<="9"
        ){

            insert(e.key);
        }

        else if(
            ["+","-","*","/",
             "%","^","(",")","."]
            .includes(e.key)
        ){

            insert(e.key);
        }

        else if(
            e.key==="Enter"
        ){

            calculate();
        }

        else if(
            e.key==="Backspace"
        ){

            backspace();
        }

        else if(
            e.key==="ArrowLeft"
        ){

            moveCursor(-1);
        }

        else if(
            e.key==="ArrowRight"
        ){

            moveCursor(1);
        }

        else if(
            e.key==="ArrowUp"
        ){

            moveCursorUp();
        }

        else if(
            e.key==="ArrowDown"
        ){

            moveCursorDown();
        }

        else if(
            e.key==="Escape"
        ){

            clearAll();
        }
    }
);
