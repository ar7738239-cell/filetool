<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Adiyogi Scientific Calculator</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080d19;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overscroll-behavior:none;
}

button{
    border:none;
    outline:none;
    font-family:inherit;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    cursor:pointer;
    touch-action:manipulation;
}

.app{

    width:100%;
    max-width:900px;
    height:100dvh;
    margin:auto;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:#080d19;
}


/* HEADER */

.header{

    height:46px;
    min-height:46px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:5px 10px;

    background:#0d1322;

    border-bottom:1px solid #202a40;
}

.brand{

    font-size:18px;
    font-weight:bold;
    white-space:nowrap;
}

.header-right{

    display:flex;
    gap:4px;
}

.badge{

    background:#192842;
    color:#9edbff;

    border-radius:10px;

    padding:7px 8px;

    font-size:10px;
}


/* DISPLAY */

.display-area{

    flex:none;

    padding:4px 10px;

    background:#080d19;
}

.mode-row{

    height:20px;

    display:flex;
    align-items:center;

    gap:18px;

    padding-left:5px;

    font-size:11px;
    font-weight:bold;

    color:#aab4c8;
}

.mode-row .active{
    color:#65d7ff;
}

.display{

    height:78px;

    background:#dceaea;

    color:#111820;

    border-radius:14px;

    padding:6px 12px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    overflow:hidden;

    box-shadow:
    inset 0 0 0 1px #c2d4d4;
}

.expression{

    min-height:22px;

    font-size:17px;
    line-height:22px;

    white-space:nowrap;

    overflow:hidden;

    text-align:left;
}

.answer{

    font-size:26px;
    line-height:30px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-align:right;
}


/* CONTROLS */

.controls{

    flex:none;

    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    gap:4px;

    padding:4px 10px;
}

.ctrl{

    height:31px;

    border-radius:9px;

    background:#293249;

    color:white;

    font-size:11px;

    font-weight:bold;

    touch-action:manipulation;
}

.ctrl.active{
    background:#7545f5;
}

.ctrl:active{
    background:#46536e;
    transform:scale(.95);
}


/* SCROLL */

.scroll-area{

    flex:1;

    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:2px 8px 20px;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior-y:contain;

    touch-action:pan-y;

    scrollbar-width:none;
}

.scroll-area::-webkit-scrollbar{
    display:none;
}


/* KEYPAD */

.keypad{

    display:grid;

    grid-template-columns:
    repeat(6,1fr);

    gap:4px;
}

.key{

    height:41px;

    border-radius:10px;

    background:#252e42;

    color:white;

    font-size:14px;

    font-weight:500;

    touch-action:manipulation;

    transition:
    transform .08s,
    background .08s;
}

.key:active{

    transform:scale(.95);

    background:#43506b;
}

.func{
    background:#30394e;
}

.operator{
    background:#454e62;
}

.orange{
    background:#f27d4d;
    color:#111;
}

.green{
    background:#18a968;
}

.yellow{
    color:#ffe85a;
}

.purple{
    color:#d7b0ff;
}


/* TOOLS */

.tools{

    margin:7px 5px 0;

    padding:9px;

    background:#11182a;

    border:1px solid #29354d;

    border-radius:14px;
}

.tools-title{

    font-size:15px;
    font-weight:bold;

    margin-bottom:7px;
}

.tools-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:5px;
}

.tool-btn{

    height:39px;

    border-radius:9px;

    background:#273149;

    color:white;

    border:1px solid #3a4862;

    font-size:12px;
    font-weight:bold;

    touch-action:manipulation;
}

.tool-btn:active{

    transform:scale(.97);

    background:#465570;
}


/* MODAL */

.modal{

    position:fixed;

    inset:0;

    z-index:9999;

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;

    background:rgba(0,0,0,.75);
}

.modal.show{
    display:flex;
}

.modal-box{

    width:min(500px,100%);

    max-height:90dvh;

    overflow:auto;

    background:#111827;

    border:1px solid #35425c;

    border-radius:18px;

    padding:16px;
}

.modal-title{

    font-size:20px;
    font-weight:bold;

    margin-bottom:12px;
}

.modal input,
.modal select,
.modal textarea{

    width:100%;

    padding:11px;

    margin:5px 0;

    background:#202a3d;

    color:white;

    border:1px solid #3b4861;

    border-radius:9px;

    font-size:15px;
}

.modal textarea{
    min-height:90px;
}

.modal-buttons{

    display:flex;

    gap:7px;

    margin-top:10px;
}

.modal-buttons button{

    flex:1;

    height:42px;

    border-radius:9px;

    background:#303b53;

    color:white;

    font-weight:bold;
}

.modal-buttons .primary{
    background:#7545f5;
}

.result{

    margin-top:10px;

    padding:12px;

    border-radius:9px;

    background:#080f20;

    border:1px solid #293650;

    white-space:pre-wrap;

    word-break:break-word;
}


/* FRACTION */

.fraction-box{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    width:100%;

    margin:10px 0;
}

.fraction-box input{

    width:180px;

    text-align:center;

    margin:5px 0;

    font-size:18px;
}

.fraction-line{

    width:190px;

    height:3px;

    background:white;

    border-radius:3px;

    margin:2px 0;
}


/* MOBILE */

@media(max-width:500px){

    .brand{
        font-size:16px;
    }

    .badge{
        font-size:9px;
        padding:6px;
    }

    .display{
        height:74px;
    }

    .expression{
        font-size:16px;
    }

    .answer{
        font-size:25px;
    }

    .controls{
        padding:3px 8px;
        gap:3px;
    }

    .ctrl{
        height:30px;
        font-size:10px;
    }

    .keypad{
        gap:3px;
    }

    .key{
        height:39px;
        border-radius:9px;
        font-size:13px;
    }

}


/* SMALL PHONE */

@media(max-width:380px){

    .header{
        height:42px;
        min-height:42px;
    }

    .brand{
        font-size:14px;
    }

    .badge{
        font-size:8px;
        padding:5px;
    }

    .display{
        height:68px;
    }

    .key{
        height:36px;
        font-size:12px;
    }

    .ctrl{
        height:28px;
        font-size:9px;
    }

}

</style>

<script>


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let expression = "";

let answer = 0;

let cursor = 0;

let angleMode = "DEG";

let memory = 0;

let second = false;

const history = [];


/* =====================================================
   ELEMENTS
===================================================== */

const expressionDisplay =
document.getElementById("expression");

const answerDisplay =
document.getElementById("answer");

const angleBadge =
document.getElementById("angleBadge");

const modal =
document.getElementById("modal");

const modalTitle =
document.getElementById("modalTitle");

const modalContent =
document.getElementById("modalContent");

const modalResult =
document.getElementById("modalResult");

const modalCalculate =
document.getElementById("modalCalculate");

const modalClose =
document.getElementById("modalClose");


/* =====================================================
   RENDER
===================================================== */

function render(){

    expressionDisplay.textContent =
        expression;

    answerDisplay.textContent =
        formatNumber(answer);
}


function formatNumber(n){

    if(typeof n !== "number")
        return String(n);

    if(!Number.isFinite(n))
        return "Math Error";

    if(Math.abs(n)<1e-14)
        n=0;

    return Number(
        n.toPrecision(12)
    ).toString();
}


/* =====================================================
   ANGLE
===================================================== */

function setAngle(mode){

    angleMode=mode;

    angleBadge.textContent=mode;

    document
        .querySelectorAll(".controls .ctrl")
        .forEach(
            b=>b.classList.remove("active")
        );

    document
        .querySelectorAll(
            '.controls .ctrl[data-action="angle"]'
        )
        .forEach(
            b=>{
                if(
                    b.dataset.value===mode
                ){
                    b.classList.add("active");
                }
            }
        );
}


function toRad(x){

    if(angleMode==="DEG")
        return x*Math.PI/180;

    if(angleMode==="GRAD")
        return x*Math.PI/200;

    return x;
}


function fromRad(x){

    if(angleMode==="DEG")
        return x*180/Math.PI;

    if(angleMode==="GRAD")
        return x*200/Math.PI;

    return x;
}


/* =====================================================
   INSERT
===================================================== */

function insert(value){

    expression =
        expression.slice(0,cursor)
        +
        value
        +
        expression.slice(cursor);

    cursor += value.length;

    render();
}


/* =====================================================
   BACKSPACE
===================================================== */

function backspace(){

    if(cursor<=0)
        return;

    expression =
        expression.slice(0,cursor-1)
        +
        expression.slice(cursor);

    cursor--;

    render();
}


/* =====================================================
   CURSOR
===================================================== */

function moveCursor(direction){

    cursor += direction;

    if(cursor<0)
        cursor=0;

    if(cursor>expression.length)
        cursor=expression.length;

    render();
}


function moveCursorUp(){

    if(!expression.length)
        return;

    const left =
        expression.lastIndexOf(
            "(",
            cursor-1
        );

    if(left>=0)
        cursor=left;
    else
        cursor=0;

    render();
}


function moveCursorDown(){

    if(!expression.length)
        return;

    const right =
        expression.indexOf(
            ")",
            cursor
        );

    if(right>=0)
        cursor=right+1;
    else
        cursor=expression.length;

    render();
}


/* =====================================================
   SECOND
===================================================== */

function secondFunction(){

    second=!second;

    const button =
        document.querySelector(
            '[data-action="second"]'
        );

    if(button){

        button.style.background =
            second
            ? "#7545f5"
            : "";
    }
}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    expression="";
    cursor=0;
    answer=0;

    render();
}


/* =====================================================
   FACTORIAL
===================================================== */

function factorial(n){

    if(
        n<0 ||
        !Number.isInteger(n)
    ){
        throw new Error(
            "Factorial requires non-negative integer"
        );
    }

    if(n>170)
        throw new Error(
            "Number too large"
        );

    let result=1;

    for(
        let i=2;
        i<=n;
        i++
    ){
        result*=i;
    }

    return result;
}


function nPr(n,r){

    if(
        !Number.isInteger(n) ||
        !Number.isInteger(r) ||
        r<0 ||
        n<0 ||
        r>n
    ){
        throw new Error("Invalid nPr");
    }

    return factorial(n)/
           factorial(n-r);
}


function nCr(n,r){

    if(
        !Number.isInteger(n) ||
        !Number.isInteger(r) ||
        r<0 ||
        n<0 ||
        r>n
    ){
        throw new Error("Invalid nCr");
    }

    return factorial(n)/
        (
            factorial(r)*
            factorial(n-r)
        );
}


/* =====================================================
   GCD / LCM
===================================================== */

function gcd(a,b){

    a=Math.abs(Math.trunc(a));
    b=Math.abs(Math.trunc(b));

    while(b){

        const temp=b;

        b=a%b;
        a=temp;
    }

    return a;
}


function lcm(a,b){

    if(a===0 || b===0)
        return 0;

    return Math.abs(a*b)/gcd(a,b);
}


/* =====================================================
   SAFE MATH HELPERS
===================================================== */

function safeEvalBasic(x){

    return Function(
        "answer",
        `"use strict";return (${x})`
    )(answer);
}


/* =====================================================
   SCIENTIFIC EVALUATOR
===================================================== */

function evaluate(expr){

    let x=expr;

    x=x
        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-")
        .replaceAll("π","Math.PI");

    x=x.replace(
        /\bAns\b/g,
        "answer"
    );

    x=x.replace(
        /\be\b/g,
        "Math.E"
    );


    /*
       FUNCTIONS
    */

    x=x.replace(
        /sin\(/g,
        "SIN("
    );

    x=x.replace(
        /cos\(/g,
        "COS("
    );

    x=x.replace(
        /tan\(/g,
        "TAN("
    );

    x=x.replace(
        /asin\(/g,
        "ASIN("
    );

    x=x.replace(
        /acos\(/g,
        "ACOS("
    );

    x=x.replace(
        /atan\(/g,
        "ATAN("
    );

    x=x.replace(
        /sinh\(/g,
        "Math.sinh("
    );

    x=x.replace(
        /cosh\(/g,
        "Math.cosh("
    );

    x=x.replace(
        /tanh\(/g,
        "Math.tanh("
    );

    x=x.replace(
        /log\(/g,
        "Math.log10("
    );

    x=x.replace(
        /ln\(/g,
        "Math.log("
    );

    x=x.replace(
        /sqrt\(/g,
        "Math.sqrt("
    );

    x=x.replace(
        /cbrt\(/g,
        "Math.cbrt("
    );

    x=x.replace(
        /abs\(/g,
        "Math.abs("
    );

    x=x.replace(
        /floor\(/g,
        "Math.floor("
    );

    x=x.replace(
        /ceil\(/g,
        "Math.ceil("
    );

    x=x.replace(
        /round\(/g,
        "Math.round("
    );

    x=x.replace(
        /exp\(/g,
        "Math.exp("
    );

    x=x.replace(
        /inv\(/g,
        "INV("
    );

    x=x.replace(
        /fact\(/g,
        "FACT("
    );

    x=x.replace(
        /npr\(/g,
        "NPR("
    );

    x=x.replace(
        /ncr\(/g,
        "NCR("
    );

    x=x.replace(
        /gcd\(/g,
        "GCD("
    );

    x=x.replace(
        /lcm\(/g,
        "LCM("
    );

    x=x.replace(
        /mod\(/g,
        "MOD("
    );

    x=x.replace(
        /sign\(/g,
        "Math.sign("
    );


    /*
       POWER
    */

    x=x.replace(
        /\^/g,
        "**"
    );


    /*
       ANGLE FUNCTIONS

       IMPORTANT:
       This section has the corrected
       closing parentheses.
    */

    x=x.replace(
        /SIN\(([^()]*)\)/g,
        (_,v)=>
            `Math.sin(${toRad(
                Number(
                    safeEvalBasic(v)
                )
            )})`
    );

    x=x.replace(
        /COS\(([^()]*)\)/g,
        (_,v)=>
            `Math.cos(${toRad(
                Number(
                    safeEvalBasic(v)
                )
            )})`
    );

    x=x.replace(
        /TAN\(([^()]*)\)/g,
        (_,v)=>
            `Math.tan(${toRad(
                Number(
                    safeEvalBasic(v)
                )
            )})`
    );


    x=x.replace(
        /ASIN\(([^()]*)\)/g,
        (_,v)=>
            String(
                fromRad(
                    Math.asin(
                        Number(
                            safeEvalBasic(v)
                        )
                    )
                )
            )
    );

    x=x.replace(
        /ACOS\(([^()]*)\)/g,
        (_,v)=>
            String(
                fromRad(
                    Math.acos(
                        Number(
                            safeEvalBasic(v)
                        )
                    )
                )
            )
    );

    x=x.replace(
        /ATAN\(([^()]*)\)/g,
        (_,v)=>
            String(
                fromRad(
                    Math.atan(
                        Number(
                            safeEvalBasic(v)
                        )
                    )
                )
            )
    );


    /*
       FACTORIAL
    */

    x=x.replace(
        /FACT\(([^()]*)\)/g,
        (_,v)=>
            String(
                factorial(
                    Number(
                        safeEvalBasic(v)
                    )
                )
            )
    );


    /*
       NPR
    */

    x=x.replace(
        /NPR\(([^,()]+),([^()]+)\)/g,
        (_,a,b)=>
            String(
                nPr(
                    Number(safeEvalBasic(a)),
                    Number(safeEvalBasic(b))
                )
            )
    );


    /*
       NCR
    */

    x=x.replace(
        /NCR\(([^,()]+),([^()]+)\)/g,
        (_,a,b)=>
            String(
                nCr(
                    Number(safeEvalBasic(a)),
                    Number(safeEvalBasic(b))
                )
            )
    );


    /*
       GCD
    */

    x=x.replace(
        /GCD\(([^,()]+),([^()]+)\)/g,
        (_,a,b)=>
            String(
                gcd(
                    Number(safeEvalBasic(a)),
                    Number(safeEvalBasic(b))
                )
            )
    );


    /*
       LCM
    */

    x=x.replace(
        /LCM\(([^,()]+),([^()]+)\)/g,
        (_,a,b)=>
            String(
                lcm(
                    Number(safeEvalBasic(a)),
                    Number(safeEvalBasic(b))
                )
            )
    );


    /*
       MOD FUNCTION
    */

    x=x.replace(
        /MOD\(([^,()]+),([^()]+)\)/g,
        (_,a,b)=>
            String(
                Number(safeEvalBasic(a))
                %
                Number(safeEvalBasic(b))
            )
    );


    /*
       INVERSE
    */

    x=x.replace(
        /INV\(([^()]*)\)/g,
        (_,v)=>
            String(
                1/
                Number(
                    safeEvalBasic(v)
                )
            )
    );


    /*
       SECURITY CHECK
    */

    if(
        /[;{}[\]'"`<>]|window|document|alert|function|constructor|prototype/i
        .test(x)
    ){
        throw new Error(
            "Invalid expression"
        );
    }


    /*
       FINAL CALCULATION
    */

    const result=
        Function(
            "answer",
            `"use strict";return (${x})`
        )(answer);

    if(
        typeof result!=="number" ||
        !Number.isFinite(result)
    ){
        throw new Error(
            "Math Error"
        );
    }

    return result;
}


/* =====================================================
   CALCULATE
===================================================== */

function calculate(){

    if(!expression.trim())
        return;

    try{

        const result=
            evaluate(expression);

        answer=result;

        history.unshift({
            expression:expression,
            answer:result
        });

        if(history.length>50)
            history.pop();

        render();

    }catch(error){

        answerDisplay.textContent=
            "Error";

        console.error(
            "Calculator error:",
            error
        );
    }
}

function parseMatrix(text){

    const rows=
        text
        .trim()
        .split(/\n+/)
        .map(
            row=>
            row.trim()
            .split(/[,\s]+/)
            .map(Number)
        );

    if(!rows.length)
        throw new Error();

    const cols=
        rows[0].length;

    if(
        rows.some(
            r=>r.length!==cols
        )
    ){
        throw new Error(
            "Invalid matrix"
        );
    }

    if(
        rows.some(
            r=>r.some(
                v=>!Number.isFinite(v)
            )
        )
    ){
        throw new Error(
            "Invalid matrix"
        );
    }

    return rows;
}


function determinant(A){

    if(
        A.length===2 &&
        A[0].length===2
    ){

        return
            A[0][0]*A[1][1]
            -
            A[0][1]*A[1][0];
    }

    if(
        A.length===3 &&
        A[0].length===3
    ){

        return

            A[0][0]*
            (
                A[1][1]*A[2][2]
                -
                A[1][2]*A[2][1]
            )

            -

            A[0][1]*
            (
                A[1][0]*A[2][2]
                -
                A[1][2]*A[2][0]
            )

            +

            A[0][2]*
            (
                A[1][0]*A[2][1]
                -
                A[1][1]*A[2][0]
            );
    }

    throw new Error(
        "Use 2x2 or 3x3 matrix"
    );
}


function inverseMatrix(A){

    if(
        A.length!==2 ||
        A[0].length!==2
    ){
        throw new Error(
            "Currently 2x2 inverse"
        );
    }

    const d=
        determinant(A);

    if(
        Math.abs(d)<1e-14
    ){
        throw new Error(
            "Singular matrix"
        );
    }

    return [

        [
            A[1][1]/d,
            -A[0][1]/d
        ],

        [
            -A[1][0]/d,
            A[0][0]/d
        ]

    ];
}


function matrixAdd(A,B){

    if(
        A.length!==B.length ||
        A[0].length!==B[0].length
    ){
        throw new Error(
            "Different dimensions"
        );
    }

    return A.map(
        (row,i)=>
        row.map(
            (x,j)=>
            x+B[i][j]
        )
    );
}


function matrixMultiply(A,B){

    if(
        A[0].length!==B.length
    ){
        throw new Error(
            "Invalid dimensions"
        );
    }

    return A.map(
        row=>
        B[0].map(
            (_,j)=>
            row.reduce(
                (sum,x,k)=>
                sum+
                x*
                B[k][j],
                0
            )
        )
    );
}


function matrixToText(A){

    return A.map(
        row=>
        row
        .map(formatNumber)
        .join("\t")
    ).join("\n");
}

function openVector(){

    openModal(

        "Vector Calculator",

        `
        <select id="vectorOperation">

            <option value="dot">
                Dot Product
            </option>

            <option value="cross">
                Cross Product
            </option>

            <option value="magnitude">
                Magnitude
            </option>

            <option value="angle">
                Angle Between
            </option>

        </select>

        <input
            id="vectorA"
            placeholder="A: 1,2,3">

        <input
            id="vectorB"
            placeholder="B: 4,5,6">
        `,

        function(){

            try{

                const op=
                    document.getElementById(
                        "vectorOperation"
                    ).value;

                const A=
                    document.getElementById(
                        "vectorA"
                    ).value
                    .split(/[,\s]+/)
                    .map(Number);

                const B=
                    document.getElementById(
                        "vectorB"
                    ).value
                    .split(/[,\s]+/)
                    .map(Number);

                if(
                    A.some(
                        v=>!Number.isFinite(v)
                    ) ||
                    B.some(
                        v=>!Number.isFinite(v)
                    )
                ){
                    throw new Error();
                }


                if(op==="magnitude"){

                    const m=
                        Math.sqrt(
                            A.reduce(
                                (s,x)=>
                                s+x*x,
                                0
                            )
                        );

                    showResult(
                        "|A| = "+
                        formatNumber(m)
                    );

                    return;
                }


                if(
                    A.length!==B.length
                ){
                    throw new Error();
                }


                if(op==="dot"){

                    const d=
                        A.reduce(
                            (s,x,i)=>
                            s+
                            x*B[i],
                            0
                        );

                    showResult(
                        "A · B = "+
                        formatNumber(d)
                    );

                    return;
                }


                if(op==="cross"){

                    if(
                        A.length!==3 ||
                        B.length!==3
                    ){
                        throw new Error();
                    }

                    const C=[

                        A[1]*B[2]
                        -
                        A[2]*B[1],

                        A[2]*B[0]
                        -
                        A[0]*B[2],

                        A[0]*B[1]
                        -
                        A[1]*B[0]

                    ];

                    showResult(
                        "["+
                        C
                        .map(formatNumber)
                        .join(", ")+
                        "]"
                    );

                    return;
                }


                const dot=
                    A.reduce(
                        (s,x,i)=>
                        s+x*B[i],
                        0
                    );

                const ma=
                    Math.sqrt(
                        A.reduce(
                            (s,x)=>
                            s+x*x,
                            0
                        )
                    );

                const mb=
                    Math.sqrt(
                        B.reduce(
                            (s,x)=>
                            s+x*x,
                            0
                        )
                    );

                const ratio=
                    Math.max(
                        -1,
                        Math.min(
                            1,
                            dot/(ma*mb)
                        )
                    );

                const theta=
                    Math.acos(ratio);

                showResult(
                    "Angle = "+
                    formatNumber(
                        fromRad(theta)
                    )+
                    " "+
                    angleMode
                );

            }catch{

                showResult(
                    "Vector Error"
                );
            }
        }
    );
}

        `

                A × B

        </select>
        `,

        function(){

            try{

                const A=
                    parseComplex(
                        document.getElementById(
                            "complexA"
                        ).value
                    );

                const B=
                    parseComplex(
                        document.getElementById(
                            "complexB"
                        ).value
                    );

                const op=
                    document.getElementById(
                        "complexOp"
                    ).value;

                let C;

                if(op==="add"){

                    C={
                        re:A.re+B.re,
                        im:A.im+B.im
                    };

                }else if(op==="sub"){

                    C={
                        re:A.re-B.re,
                        im:A.im-B.im
                    };

                }else if(op==="mul"){

                    C={
                        re:
                            A.re*B.re-
                            A.im*B.im,

                        im:
                            A.re*B.im+
                            A.im*B.re
                    };

                }else{

                    const den=
                        B.re*B.re+
                        B.im*B.im;

                    if(den===0)
                        throw new Error();

                    C={
                        re:
                            (
                                A.re*B.re+
                                A.im*B.im
                            )/den,

                        im:
                            (
                                A.im*B.re-
                                A.re*B.im
                            )/den
                    };
                }

                showResult(
                    complexToText(C)
                );

            }catch{

                showResult(
                    "Complex number error."
                );
            }
        }
    );
}


function parseComplex(text){

    let s=
        text
        .replace(/\s+/g,"")
        .replace(/i$/,"");

    if(!s)
        return {re:0,im:1};

    const match=
        s.match(
            /^([+-]?\d*\.?\d+(?:e[+-]?\d+)?)?([+-]\d*\.?\d+(?:e[+-]?\d+)?)?$/
        );

    if(!match)
        throw new Error();

    const re=
        match[1]
        ? Number(match[1])
        : 0;

    const im=
        match[2]
        ? Number(match[2])
        : 1;

    return {
        re:re,
        im:im
    };
}


function complexToText(z){

    const re=
        formatNumber(z.re);

    const im=
        formatNumber(
            Math.abs(z.im)
        );

    return (
        re+
        (
            z.im>=0
            ? " + "
            : " - "
        )+
        im+
        "i"
    );
}


/* =====================================================
   STATISTICS
===================================================== */

function openStats(){

    openModal(

        "Statistics",

        `
        <textarea
            id="stats"
            placeholder="10,20,30,40,50"></textarea>
        `,

        function(){

            const data=
                document.getElementById(
                    "stats"
                ).value
                .split(/[,\s]+/)
                .map(Number)
                .filter(
                    Number.isFinite
                );

            if(!data.length){

                showResult(
                    "No data."
                );

                return;
            }

            const sum=
                data.reduce(
                    (a,b)=>a+b,
                    0
                );

            const mean=
                sum/data.length;

            const variance=
                data.reduce(
                    (s,x)=>
                    s+
                    (x-mean)**2,
                    0
                )/
                data.length;

            const sorted=
                [...data].sort(
                    (a,b)=>a-b
                );

            const middle=
                Math.floor(
                    sorted.length/2
                );

            const median=
                sorted.length%2
                ? sorted[middle]
                : (
                    sorted[middle-1]+
                    sorted[middle]
                )/2;

            showResult(

                "n = "+
                data.length+

                "\nSum = "+
                formatNumber(sum)+

                "\nMean = "+
                formatNumber(mean)+

                "\nMedian = "+
                formatNumber(median)+

                "\nVariance = "+
                formatNumber(variance)+

                "\nStandard Deviation = "+
                formatNumber(
                    Math.sqrt(variance)
                )
            );
        }
    );
}

function openConverter(){

    openModal(

        "Engineering Unit Converter",

        `
        <select id="unitType">

            <option value="length">
                Length
            </option>

            <option value="pressure">
                Pressure
            </option>

            <option value="mass">
                Mass
            </option>

            <option value="temperature">
                Temperature
            </option>

        </select>

        <input
            id="unitValue"
            type="text"
            inputmode="decimal"
            placeholder="Value">

        <select id="unitFrom">

            <option>m</option>
            <option>km</option>
            <option>cm</option>
            <option>mm</option>

        </select>

        <select id="unitTo">

            <option>m</option>
            <option>km</option>
            <option>cm</option>
            <option>mm</option>

        </select>
        `,

        function(){

            const value=
                Number(
                    document.getElementById(
                        "unitValue"
                    ).value
                );

            const from=
                document.getElementById(
                    "unitFrom"
                ).value;

            const to=
                document.getElementById(
                    "unitTo"
                ).value;

            if(
                !Number.isFinite(value)
            ){

                showResult(
                    "Enter a valid value."
                );

                return;
            }

            const factors={

                m:1,
                km:1000,
                cm:0.01,
                mm:0.001

            };

            const result=
                value*
                factors[from]/
                factors[to];

            showResult(
                formatNumber(value)+
                " "+
                from+
                " = "+
                formatNumber(result)+
                " "+
                to
            );
        }
    );
}

/* =====================================================
   BUTTON EVENT SYSTEM
===================================================== */

/*
   IMPORTANT FIX:

   Inline onclick handlers hata diye gaye hain.

   Ab saare buttons ko JavaScript
   addEventListener se handle kiya ja raha hai.

   Isse mobile Chrome/Acode/GitHub Pages
   par button touch reliable rahega.
*/


document.addEventListener(
    "click",
    function(event){

        const button=
            event.target.closest(
                "button"
            );

        if(!button)
            return;


        /* ANGLE */

        if(
            button.dataset.action===
            "angle"
        ){

            setAngle(
                button.dataset.value
            );

            return;
        }


        /* INSERT */

        if(
            button.dataset.insert!==undefined
        ){

            insert(
                button.dataset.insert
            );

            return;
        }


        /* ACTION */

        const action=
            button.dataset.action;


        if(action==="cursor-left"){
            moveCursor(-1);
            return;
        }

        if(action==="cursor-right"){
            moveCursor(1);
            return;
        }

        if(action==="cursor-up"){
            moveCursorUp();
            return;
        }

        if(action==="cursor-down"){
            moveCursorDown();
            return;
        }

        if(action==="second"){
            secondFunction();
            return;
        }

        if(action==="clear"){
            clearAll();
            return;
        }

        if(action==="backspace"){
            backspace();
            return;
        }

        if(action==="calculate"){
            calculate();
            return;
        }

        if(action==="fraction"){
            openFraction();
            return;
        }

        if(action==="history"){
            showHistory();
            return;
        }

        if(action==="memory-clear"){
            memoryClear();
            return;
        }

        if(action==="memory-recall"){
            memoryRecall();
            return;
        }

        if(action==="memory-add"){
            memoryAdd();
            return;
        }

        if(action==="memory-sub"){
            memorySub();
            return;
        }

        if(action==="memory-store"){
            memoryStore();
            return;
        }


        /* TOOLS */

        const tool=
            button.dataset.tool;

        if(!tool)
            return;

        if(tool==="derivative"){
            openDerivative();
            return;
        }

        if(tool==="integral"){
            openIntegral();
            return;
        }

        if(tool==="limit"){
            openLimit();
            return;
        }

        if(tool==="equation"){
            openEquation();
            return;
        }

        if(tool==="matrix"){
            openMatrix();
            return;
        }

        if(tool==="vector"){
            openVector();
            return;
        }

        if(tool==="complex"){
            openComplex();
            return;
        }

        if(tool==="stats"){
            openStats();
            return;
        }

        if(tool==="converter"){
            openConverter();
            return;
        }

        if(tool==="constants"){
            openConstants();
            return;
        }

    }
);


/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.target.tagName==="INPUT" ||
            e.target.tagName==="TEXTAREA" ||
            e.target.tagName==="SELECT"
        ){
            return;
        }


        if(
            e.key>="0" &&
            e.key<="9"
        ){

            insert(e.key);

            e.preventDefault();

            return;
        }


        if(
            [
                "+",
                "-",
                "*",
                "/",
                "%",
                "^",
                "(",
                ")",
                "."
            ].includes(e.key)
        ){

            insert(e.key);

            e.preventDefault();

            return;
        }


        if(e.key==="Enter"){

            calculate();

            e.preventDefault();

            return;
        }


        if(e.key==="Backspace"){

            backspace();

            e.preventDefault();

            return;
        }


        if(e.key==="ArrowLeft"){

            moveCursor(-1);

            e.preventDefault();

            return;
        }


        if(e.key==="ArrowRight"){

            moveCursor(1);

            e.preventDefault();

            return;
        }


        if(e.key==="ArrowUp"){

            moveCursorUp();

            e.preventDefault();

            return;
        }


        if(e.key==="ArrowDown"){

            moveCursorDown();

            e.preventDefault();

            return;
        }


        if(e.key==="Escape"){

            clearAll();

            e.preventDefault();
        }

    }
);
